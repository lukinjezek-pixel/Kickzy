<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KICKZY</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{background:#176b3a;color:white;font-family:Arial,Helvetica,sans-serif}
#app{width:100vw;height:100vh}

.hidden{display:none!important}

.menu{
 position:fixed;inset:0;z-index:100;
 display:flex;justify-content:center;align-items:center;
 background:radial-gradient(circle at 50% 35%,#203b2c,#101b16 45%,#050806);
 overflow-y:auto;padding:25px;
}

.menu-box{width:min(760px,94vw);text-align:center}

.logo{
 font-size:clamp(64px,13vw,120px);font-weight:1000;
 letter-spacing:8px;margin-bottom:4px;
 text-shadow:0 8px 30px #000,0 0 30px #4ca7ff40;
}

.menu-subtitle{
 font-size:14px;font-weight:800;letter-spacing:5px;
 opacity:.6;margin-bottom:28px
}

.menu-buttons{display:flex;flex-direction:column;gap:14px}

.menu-btn{
 width:100%;border:0;border-radius:16px;padding:18px 20px;
 font-size:20px;font-weight:900;color:white;
 background:#ffffff0f;border:1px solid #ffffff24;
 cursor:pointer;transition:.15s
}
.menu-btn:hover{transform:translateY(-3px);background:#ffffff18;box-shadow:0 12px 30px #0004}
.menu-btn:active{transform:scale(.97)}
.play-btn{background:linear-gradient(135deg,#2384e8,#4ca7ff)}
.back-btn{margin-top:8px;font-size:15px;padding:13px;background:transparent}

.mode-title{font-size:32px;font-weight:1000;margin-bottom:24px}

.coming-soon{opacity:.45;cursor:default}
.coming-soon:hover{transform:none;background:#ffffff0f;box-shadow:none}

.coin-display{
 margin:0 auto 25px;width:max-content;display:flex;align-items:center;
 gap:9px;padding:10px 17px;border-radius:999px;background:#ffffff0d;
 border:1px solid #ffffff1f;font-size:18px;font-weight:900
}
.coin-icon{font-size:20px}
#coinAmount,#storeCoinAmount{color:#ffd84d}

/* STORE */
.store-box{width:min(1050px,96vw)}
.store-header{
 display:flex;align-items:center;justify-content:space-between;
 gap:15px;margin-bottom:18px
}
.store-header .mode-title{margin:0}

.store-coins{margin:0}

.filters{
 display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
 margin-bottom:18px
}
.filter{
 border:1px solid #ffffff20;background:#ffffff0b;color:#fff;
 padding:9px 14px;border-radius:999px;font-weight:800;cursor:pointer
}
.filter.active{background:#4ca7ff;color:#fff;border-color:#4ca7ff}

.skin-grid{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:12px;
 max-height:55vh;
 overflow-y:auto;
 padding:5px;
}

.skin-card{
 position:relative;
 min-height:190px;
 border-radius:18px;
 padding:12px;
 background:linear-gradient(145deg,#17251e,#0b120e);
 border:1px solid #ffffff18;
 box-shadow:0 8px 25px #0003;
 overflow:hidden;
 transition:.18s
}
.skin-card:hover{transform:translateY(-4px);border-color:#ffffff40}

.skin-preview{
 height:95px;
 display:flex;align-items:center;justify-content:center;
 position:relative;margin-bottom:7px
}

.preview-player{
 width:62px;height:62px;border-radius:50%;
 position:relative;
 border:3px solid white;
 box-shadow:0 0 20px #fff4;
 overflow:visible
}
.preview-player:after{
 content:"";
 position:absolute;width:13px;height:13px;border-radius:50%;
 background:white;right:8px;top:12px;
 box-shadow:0 0 8px #fff
}

.skin-name{font-size:13px;font-weight:1000;margin-bottom:3px}
.rarity{font-size:10px;font-weight:1000;letter-spacing:1px}
.price{font-size:12px;font-weight:900;margin-top:4px;color:#ffd84d}

.skin-action{
 width:100%;margin-top:8px;border:0;border-radius:9px;
 padding:8px;font-weight:1000;cursor:pointer;
 background:#ffffff12;color:white
}
.skin-action.buy{background:#2384e8}
.skin-action.equipped{background:#55d98a;color:#07120b}
.skin-action:disabled{opacity:.35;cursor:not-allowed}

.owned-badge{
 position:absolute;right:8px;top:8px;
 font-size:9px;background:#55d98a;color:#06100a;
 padding:4px 6px;border-radius:8px;font-weight:1000
}

.rarity-Rare{border-color:#4ca7ff55}
.rarity-Super-Rare{border-color:#7b7cff66}
.rarity-Epic{border-color:#b34cff77}
.rarity-Mythic{border-color:#ff4ca477}
.rarity-Legendary{border-color:#ffd84d99}

@media(max-width:800px){
 .skin-grid{grid-template-columns:repeat(3,1fr);max-height:60vh}
}
@media(max-width:500px){
 .skin-grid{grid-template-columns:repeat(2,1fr)}
 .skin-card{min-height:180px}
}

/* GAME */
.game-wrap{
 position:relative;width:100vw;height:100vh;overflow:hidden;background:#176b3a
}
canvas{display:block;width:100%;height:100%;touch-action:none}

.scoreboard{
 position:absolute;top:14px;left:50%;transform:translateX(-50%);
 display:flex;align-items:center;gap:18px;padding:9px 18px;
 border-radius:16px;background:#05080eb8;backdrop-filter:blur(10px);
 border:1px solid #ffffff1f;pointer-events:none;z-index:5
}
.team{font-weight:900;font-size:15px}
.blue{color:#53a8ff}.red{color:#ff6464}
.score{font-size:25px;font-weight:900;min-width:52px;text-align:center}

.timer{
 position:absolute;top:70px;left:50%;transform:translateX(-50%);
 color:#ffffffcc;font-size:13px;font-weight:700;letter-spacing:1px;
 pointer-events:none;z-index:5
}
.pause-btn{
 position:absolute;right:15px;top:15px;z-index:10;border:0;
 border-radius:10px;padding:8px 12px;color:white;
 background:#05080ea6;cursor:pointer;font-weight:800
}

#goalText{
 position:absolute;inset:0;display:flex;justify-content:center;align-items:center;
 font-size:clamp(48px,10vw,110px);font-weight:1000;letter-spacing:5px;
 opacity:0;transform:scale(.65);pointer-events:none;z-index:8;
 text-shadow:0 8px 35px #000,0 0 35px #fff4
}
#goalText.show{animation:goalAnimation 1.2s ease-out forwards}
@keyframes goalAnimation{
 0%{opacity:0;transform:scale(.65)}
 20%{opacity:1;transform:scale(1.12)}
 45%{transform:scale(1)}
 100%{opacity:0;transform:scale(1.08)}
}

#resultOverlay{
 position:absolute;inset:0;z-index:30;display:flex;justify-content:center;
 align-items:center;background:#030806c2;backdrop-filter:blur(10px)
}
.result-box{
 width:min(460px,88vw);padding:42px 30px;text-align:center;border-radius:25px;
 background:linear-gradient(145deg,#19261ff7,#080e0bf7);
 border:1px solid #ffffff24;box-shadow:0 30px 80px #0009;
 animation:resultAppear .45s cubic-bezier(.2,.8,.2,1)
}
@keyframes resultAppear{
 0%{opacity:0;transform:scale(.75) translateY(25px)}
 100%{opacity:1;transform:scale(1) translateY(0)}
}
.result-title{font-size:clamp(48px,12vw,76px);font-weight:1000;letter-spacing:3px;margin-bottom:8px}
.result-score{font-size:24px;font-weight:900;opacity:.8;margin-bottom:30px}
.result-coins{display:flex;justify-content:center;align-items:center;gap:9px;font-size:25px;font-weight:1000;color:#ffd84d;margin-bottom:30px}
.result-coins small{font-size:15px;letter-spacing:2px;opacity:.75}
.result-win{color:#55d98a}.result-lose{color:#ff6464}.result-draw{color:#ffd84d}

/* skin effects */
.skin-effect{
 position:absolute;inset:-14px;border-radius:50%;
 pointer-events:none
}
.fx-spin{animation:spin 2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fx-pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15);opacity:.45}}
</style>
</head>

<body>
<div id="app">

<!-- MAIN -->
<div class="menu" id="mainMenu">
 <div class="menu-box">
  <div class="logo">KICKZY</div>
  <div class="menu-subtitle">FAST 2D FOOTBALL</div>

  <div class="coin-display">
   <span class="coin-icon">🪙</span>
   <span id="coinAmount">0</span>
   <span>COINS</span>
  </div>

  <div class="menu-buttons">
   <button class="menu-btn play-btn" id="playButton">PLAY</button>
   <button class="menu-btn" id="storeButton">STORE</button>
  </div>
 </div>
</div>

<!-- MODE -->
<div class="menu hidden" id="modeMenu">
 <div class="menu-box">
  <div class="mode-title">SELECT MODE</div>
  <div class="menu-buttons">
   <button class="menu-btn play-btn" id="botButton">PLAY VS BOT</button>
   <button class="menu-btn" id="localButton">PLAY LOCAL</button>
   <button class="menu-btn coming-soon">PLAY ONLINE <small>COMING SOON</small></button>
   <button class="menu-btn back-btn" id="modeBack">← BACK</button>
  </div>
 </div>
</div>

<!-- DIFFICULTY -->
<div class="menu hidden" id="difficultyMenu">
 <div class="menu-box">
  <div class="mode-title">BOT DIFFICULTY</div>
  <div class="menu-buttons">
   <button class="menu-btn" data-difficulty="easy">EASY</button>
   <button class="menu-btn play-btn" data-difficulty="normal">NORMAL</button>
   <button class="menu-btn" data-difficulty="hard">HARD</button>
   <button class="menu-btn back-btn" id="difficultyBack">← BACK</button>
  </div>
 </div>
</div>

<!-- STORE -->
<div class="menu hidden" id="storeMenu">
 <div class="menu-box store-box">

  <div class="store-header">
   <div class="mode-title">KICKZY STORE</div>
   <div class="coin-display store-coins">
    🪙 <span id="storeCoinAmount">0</span>
   </div>
  </div>

  <div class="filters">
   <button class="filter active" data-filter="all">ALL</button>
   <button class="filter" data-filter="Rare">RARE</button>
   <button class="filter" data-filter="Super Rare">SUPER RARE</button>
   <button class="filter" data-filter="Epic">EPIC</button>
   <button class="filter" data-filter="Mythic">MYTHIC</button>
   <button class="filter" data-filter="Legendary">LEGENDARY</button>
  </div>

  <div class="skin-grid" id="skinGrid"></div>

  <button class="menu-btn back-btn" id="storeBack">← BACK</button>
 </div>
</div>

<!-- GAME -->
<div class="game-wrap hidden" id="gameWrap">
 <canvas id="game"></canvas>

 <div class="scoreboard">
  <span class="team blue">BLUE</span>
  <span class="score" id="score">0 - 0</span>
  <span class="team red">RED</span>
 </div>

 <div class="timer" id="timer">02:00</div>
 <button class="pause-btn" id="menuButton">MENU</button>
 <div id="goalText">GOAL!</div>

 <div id="resultOverlay" class="hidden">
  <div class="result-box">
   <div id="resultTitle" class="result-title">YOU WIN</div>
   <div id="resultScore" class="result-score">0 - 0</div>
   <div class="result-coins">
    <span>🪙</span><span id="resultCoins">+50</span><small>COINS</small>
   </div>
   <button class="menu-btn play-btn" id="resultMenuButton">CONTINUE</button>
  </div>
 </div>
</div>

</div>

const difficultyMenu=document.getElementById("difficultyMenu");

 localStorage.setItem("kickzyCoins",coins);

 document.getElementById("coinAmount").textContent=coins;
 document.getElementById("storeCoinAmount").textContent=coins;

function renderStore(){

function resizeCanvas(){
 const r=canvas.getBoundingClientRect();
 const dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=r.width*dpr;
 canvas.height=r.height*dpr;
 W=r.width;H=r.height;
 gameScale=Math.min(W/BASE_W,H/BASE_H);
 offsetX=(W-BASE_W*gameScale)/2;
 offsetY=(H-BASE_H*gameScale)/2;
 ctx.setTransform(dpr*gameScale,0,0,dpr*gameScale,dpr*offsetX,dpr*offsetY);
}
window.addEventListener("resize",resizeCanvas);

   PLAYERS
========================================================= */

const blue={
 x:0,y:0,vx:0,vy:0,radius:23,
 color:"#4ca7ff",kickCooldown:0,speed:.65,maxSpeed:5
};

const red={
 x:0,y:0,vx:0,vy:0,radius:23,
 color:"#ff5e66",kickCooldown:0,speed:.65,maxSpeed:5
};

const ball={x:0,y:0,vx:0,vy:0,radius:12};

let blueScore=0,redScore=0,matchTime=120;
let lastTime=performance.now(),particles=[],shake=0;
let goalInProgress=false,goalRestartTimer=null;

let botThinkTimer=0,botKickTimer=0,botMistakeTimer=0;
let botMistakeX=0,botMistakeY=0;
let botTargetX=700,botTargetY=280;

function resetPositions(){
 blue.x=field.left+(field.right-field.left)*.28;
 blue.y=BASE_H/2;blue.vx=blue.vy=0;blue.kickCooldown=0;

 red.x=field.left+(field.right-field.left)*.72;
 red.y=BASE_H/2;red.vx=red.vy=0;red.kickCooldown=0;

 ball.x=BASE_W/2;ball.y=BASE_H/2;ball.vx=ball.vy=0;

 botThinkTimer=botKickTimer=botMistakeTimer=0;
 botMistakeX=botMistakeY=0;
}

resetPositions();

function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function distance(a,b,c,d){return Math.hypot(c-a,d-b)}

/* =========================================================
   MOVEMENT
========================================================= */

function movePlayer(p,c,dt){
 let dx=0,dy=0;
 if(keys[c.up])dy--;
 if(keys[c.down])dy++;
 if(keys[c.left])dx--;
 if(keys[c.right])dx++;

 if(dx||dy){
  const l=Math.hypot(dx,dy);
  dx/=l;dy/=l;
  p.vx+=dx*p.speed*dt*60;
  p.vy+=dy*p.speed*dt*60;
 }

 const sp=Math.hypot(p.vx,p.vy);
 if(sp>p.maxSpeed){
  p.vx=p.vx/sp*p.maxSpeed;
  p.vy=p.vy/sp*p.maxSpeed;
 }

 p.vx*=Math.pow(.82,dt*60);
 p.vy*=Math.pow(.82,dt*60);

 p.x+=p.vx*dt*60;
 p.y+=p.vy*dt*60;

 p.x=clamp(p.x,field.left+p.radius,field.right-p.radius);
 p.y=clamp(p.y,field.top+p.radius,field.bottom-p.radius);

 p.kickCooldown-=dt;

 if(keys[c.kick]&&p.kickCooldown<=0){
  kick(p);
  p.kickCooldown=.38;
 }
}

/* =========================================================
   BOT
========================================================= */

function moveBot(dt){
 if(gameMode!=="bot"||goalInProgress)return;

 let reaction=.12,speed=.82,error=8;
 if(botDifficulty==="easy"){reaction=.20;speed=.70;error=25}
 if(botDifficulty==="hard"){reaction=.055;speed=1;error=4}

 botMistakeTimer-=dt;
 if(botMistakeTimer<=0){
  botMistakeTimer=.7+Math.random()*1.8;
  botMistakeX=(Math.random()-.5)*error;
  botMistakeY=(Math.random()-.5)*error;
 }

 botThinkTimer-=dt;
 if(botThinkTimer<=0){
  botThinkTimer=reaction;

  const bd=distance(red.x,red.y,ball.x,ball.y);
  const ballToBot=ball.vx>1.5&&ball.x>red.x-180;
  const blueHasBall=distance(blue.x,blue.y,ball.x,ball.y)<75;

  let tx=ball.x,ty=ball.y;

  if(bd<=70&&!blueHasBall){
   tx=ball.x+28;
   ty=ball.y;
  }

  if(ballToBotGoal){tx=ball.x;ty=ball.y}

  botTargetX=clamp(tx+botMistakeX,field.left+red.radius,field.right-red.radius);
  botTargetY=clamp(ty+botMistakeY,field.top+red.radius,field.bottom-red.radius);
 }

 let dx=botTargetX-red.x,dy=botTargetY-red.y;
 const d=Math.hypot(dx,dy);

 if(d>4){
  dx/=d;dy/=d;
  red.vx+=dx*red.speed*speed*dt*60;
  red.vy+=dy*red.speed*speed*dt*60;
 }

 const sp=Math.hypot(red.vx,red.vy);
 const max=red.maxSpeed*speed;

 if(sp>max){
  red.vx=red.vx/sp*max;
  red.vy=red.vy/sp*max;
 }

 red.vx*=Math.pow(.82,dt*60);
 red.vy*=Math.pow(.82,dt*60);

 red.x+=red.vx*dt*60;
 red.y+=red.vy*dt*60;

 red.x=clamp(red.x,field.left+red.radius,field.right-red.radius);
 red.y=clamp(red.y,field.top+red.radius,field.bottom-red.radius);

 red.kickCooldown-=dt;
 botKickTimer-=dt;

 const bd=distance(red.x,red.y,ball.x,ball.y);

 if(bd<red.radius+ball.radius+32&&red.kickCooldown<=0&&botKickTimer<=0){
  let sx,sy;

  if(ball.x>=red.x-15){
   sx=field.left;
   sy=BASE_H/2+(Math.random()-.5)*error*3;
  }else{
   sx=ball.x+(ball.x-red.x)*2;
   sy=ball.y;
  }

  let dx=sx-ball.x,dy=sy-ball.y;
  const l=Math.hypot(dx,dy);

  if(l){
   dx/=l;dy/=l;
   ball.vx=dx*10.5+red.vx*.45;
   ball.vy=dy*10.5+red.vy*.45;
   createKickParticles(ball.x-dx*7,ball.y-dy*7);
   playKickSound();
   red.kickCooldown=.38;
   botKickTimer=.30;
  }
 }
}

/* =========================================================
   BALL / KICK
========================================================= */

function kick(p){
 const dx=ball.x-p.x,dy=ball.y-p.y;
 const d=Math.hypot(dx,dy);

 if(d<p.radius+ball.radius+32){
  let nx,ny;
  if(d<.01){nx=p===blue?1:-1;ny=0}
  else{nx=dx/d;ny=dy/d}

  ball.vx=nx*10.5+p.vx*.45;
  ball.vy=ny*10.5+p.vy*.45;

  createKickParticles(ball.x-nx*7,ball.y-ny*7);
  playKickSound();
 }
}

function handlePlayerCollision(a,b){
 const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
 const md=a.radius+b.radius;

 if(d>0&&d<md){
  const nx=dx/d,ny=dy/d,o=md-d;
  a.x-=nx*o/2;a.y-=ny*o/2;
  b.x+=nx*o/2;b.y+=ny*o/2;
  a.vx-=nx*1.8;a.vy-=ny*1.8;
  b.vx+=nx*1.8;b.vy+=ny*1.8;
 }
}

function handleBallCollision(p){
 if(goalInProgress)return;

 const dx=ball.x-p.x,dy=ball.y-p.y,d=Math.hypot(dx,dy);
 const md=p.radius+ball.radius;

 if(d<md&&d>0){
  const nx=dx/d,ny=dy/d,o=md-d;
  ball.x+=nx*o;ball.y+=ny*o;
  const sp=Math.max(Math.hypot(ball.vx,ball.vy),1.7);
  ball.vx=nx*sp+p.vx*.25;
  ball.vy=ny*sp+p.vy*.25;
 }
}

function updateBall(dt){
 if(goalInProgress)return;

 ball.x+=ball.vx*dt*60;
 ball.y+=ball.vy*dt*60;

 ball.vx*=Math.pow(.985,dt*60);
 ball.vy*=Math.pow(.985,dt*60);

 const gt=BASE_H/2-goal.height/2;
 const gb=BASE_H/2+goal.height/2;
 const inside=ball.y>gt&&ball.y<gb;

 if(ball.y-ball.radius<field.top){
  ball.y=field.top+ball.radius;ball.vy*= -.8;
  playWallSound();createBounceParticles(ball.x,ball.y);
 }
 if(ball.y+ball.radius>field.bottom){
  ball.y=field.bottom-ball.radius;ball.vy*= -.8;
  playWallSound();createBounceParticles(ball.x,ball.y);
 }

 if(ball.x-ball.radius<field.left){
  if(inside){goalScored("red");return}
  ball.x=field.left+ball.radius;ball.vx*= -.8;
  playWallSound();createBounceParticles(ball.x,ball.y);
 }

 if(ball.x+ball.radius>field.right){
  if(inside){goalScored("blue");return}
  ball.x=field.right-ball.radius;ball.vx*= -.8;
  playWallSound();createBounceParticles(ball.x,ball.y);
 }
}

function goalScored(team){

 shake=15;

 clearTimeout(goalRestartTimer);
 goalRestartTimer=setTimeout(()=>{
  if(!matchFinished){goalInProgress=false;resetPositions()}
 },900);
}

function finishMatch(){
 if(matchFinished)return;

 matchFinished=true;
 gameStarted=false;
 goalInProgress=false;
 clearTimeout(goalRestartTimer);

 let result,reward;

 if(blueScore>redScore){
  result="win";reward=50;
  resultTitle.textContent="YOU WIN";
  resultTitle.className="result-title result-win";
 }else if(blueScore<redScore){
  result="lose";reward=10;
  resultTitle.textContent="YOU LOSE";
  resultTitle.className="result-title result-lose";
 }else{
  result="draw";reward=10;
  resultTitle.textContent="DRAW";
  resultTitle.className="result-title result-draw";
 }

 addCoins(reward);
 resultScore.textContent=`${blueScore} - ${redScore}`;
 resultCoins.textContent=`+${reward}`;
 resultOverlay.classList.remove("hidden");
 playResultSound(result);
}

function restartMatch(){
 clearTimeout(goalRestartTimer);

 blueScore=redScore=0;
 matchTime=120;
 goalInProgress=false;
 matchFinished=false;
 resultOverlay.classList.add("hidden");
 scoreElement.textContent="0 - 0";

}

/* =========================================================
   PARTICLES
========================================================= */

function createKickParticles(x,y){
 for(let i=0;i<7;i++)particles.push({
  x,y,vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3,
  life:.35,size:Math.random()*4+2
 });
}

function createBounceParticles(x,y){
 for(let i=0;i<4;i++)particles.push({
  x,y,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,
  life:.2,size:3
 });
}

function createGoalParticle(x,y){
 particles.push({
  x,y,vx:(Math.random()-.5)*10,vy:(Math.random()-.5)*10,
  life:1,size:Math.random()*7+3
 });
}

function updateParticles(dt){
 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];
  p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;
  p.vx*=.97;p.vy*=.97;p.life-=dt;
  if(p.life<=0)particles.splice(i,1);
 }
}

/* =========================================================
   FIELD
========================================================= */

function drawField(){
 ctx.clearRect(0,0,BASE_W,BASE_H);
 ctx.fillStyle="#19703c";
 ctx.fillRect(0,0,BASE_W,BASE_H);

 for(let x=field.left;x<field.right;x+=80){
  ctx.fillStyle=Math.floor((x-field.left)/80)%2===0?"#ffffff06":"#00000006";
  ctx.fillRect(x,field.top,80,field.bottom-field.top);
 }

 ctx.strokeStyle="#ffffffd9";ctx.lineWidth=4;
 ctx.strokeRect(field.left,field.top,field.right-field.left,field.bottom-field.top);

 ctx.beginPath();ctx.moveTo(BASE_W/2,field.top);ctx.lineTo(BASE_W/2,field.bottom);ctx.stroke();
 ctx.beginPath();ctx.arc(BASE_W/2,BASE_H/2,75,0,Math.PI*2);ctx.stroke();
 ctx.beginPath();ctx.arc(BASE_W/2,BASE_H/2,4,0,Math.PI*2);
 ctx.fillStyle="#fff";ctx.fill();

 drawPenaltyArea("left");drawPenaltyArea("right");

 const gt=BASE_H/2-goal.height/2;
 ctx.fillStyle="#ffffff14";
 ctx.fillRect(field.left-18,gt,18,goal.height);
 ctx.fillRect(field.right,gt,18,goal.height);

 ctx.strokeStyle="#ffffffbf";ctx.lineWidth=3;
 ctx.strokeRect(field.left-18,gt,18,goal.height);
 ctx.strokeRect(field.right,gt,18,goal.height);
}

function drawPenaltyArea(side){
 const width=120,height=240;
 const x=side==="left"?field.left:field.right-width;
 ctx.strokeStyle="#ffffffa6";ctx.lineWidth=3;
 ctx.strokeRect(x,BASE_H/2-height/2,width,height);
}

/* =========================================================
   SKIN DRAWING
========================================================= */

function getSkin(){
 if(equippedSkin==="default")return null;
 return skins.find(s=>s.id===equippedSkin)||null;
}

function drawSkinPattern(s,p){
 const x=p.x,y=p.y,r=p.radius;
 const t=Date.now()/1000;

 ctx.save();

 if(s.type==="stripes"||s.type==="lines"){
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();
  ctx.strokeStyle="#fff8";ctx.lineWidth=7;
  for(let i=-60;i<70;i+=18){
   ctx.beginPath();ctx.moveTo(x+i,y-r);ctx.lineTo(x+i+45,y+r);ctx.stroke();
  }
 }

 if(s.type==="dots"){
  ctx.fillStyle="#fff8";
  for(let a=0;a<8;a++){
   const ang=a*Math.PI/4;
   ctx.beginPath();ctx.arc(x+Math.cos(ang)*13,y+Math.sin(ang)*13,3,0,Math.PI*2);ctx.fill();
  }
 }

 if(["grid","circuit","matrix"].includes(s.type)){
  ctx.strokeStyle="#ffffff55";ctx.lineWidth=2;
  for(let i=-30;i<=30;i+=12){
   ctx.beginPath();ctx.moveTo(x+i,y-r);ctx.lineTo(x+i,y+r);ctx.stroke();
   ctx.beginPath();ctx.moveTo(x-r,y+i);ctx.lineTo(x+r,y+i);ctx.stroke();
  }
 }

 if(["pulse","plasma","energy","void","blackhole"].includes(s.type)){
  ctx.beginPath();ctx.arc(x,y,r+7+Math.sin(t*5)*4,0,Math.PI*2);
  ctx.strokeStyle=s.c;ctx.lineWidth=3;ctx.globalAlpha=.55;ctx.stroke();
 }

 if(["electric","thunder"].includes(s.type)){
  ctx.strokeStyle="#fff";ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(x-18,y-5);ctx.lineTo(x-4,y-15);ctx.lineTo(x-8,y);
  ctx.lineTo(x+12,y-8);ctx.lineTo(x+3,y+15);
  ctx.stroke();
 }

 if(["star","celestial","galaxy","cosmic"].includes(s.type)){
  ctx.fillStyle="#fff";
  for(let i=0;i<8;i++){
   const a=i*Math.PI/4+t*.25;
   const rr=17+(i%2)*5;
   ctx.beginPath();ctx.arc(x+Math.cos(a)*rr,y+Math.sin(a)*rr,2,0,Math.PI*2);ctx.fill();
  }
 }

 if(s.type==="checker"){
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();
  ctx.fillStyle="#111";
  for(let i=-40;i<40;i+=14)
   for(let j=-40;j<40;j+=14)
    if(((i+j)/14)%2===0)ctx.fillRect(x+i,y+j,14,14);
 }

 if(["rainbow","prism","hologram","ultimate"].includes(s.type)){
  ctx.beginPath();ctx.arc(x,y,r+8,0,Math.PI*2);
  ctx.strokeStyle=`hsl(${(t*100)%360},100%,65%)`;
  ctx.lineWidth=5;ctx.stroke();
 }

 if(["gold","diamond","royal"].includes(s.type)){
  ctx.strokeStyle="#fff9";ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(x-r*.7,y);ctx.lineTo(x,y-r*.7);
  ctx.lineTo(x+r*.7,y);ctx.lineTo(x,y+r*.7);ctx.closePath();ctx.stroke();
 }

 if(["lava","inferno","phoenix"].includes(s.type)){
  ctx.strokeStyle="#ffd84d";ctx.lineWidth=4;
  ctx.beginPath();
  for(let i=0;i<7;i++){
   const a=i*Math.PI/3+t*.8;
   const rr=r*.75+Math.sin(t*6+i)*4;
   ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);
  }
  ctx.stroke();
 }

 if(s.type==="glitch"){
  ctx.fillStyle="#00fff088";ctx.fillRect(x-r,y-5,r*1.2,5);
  ctx.fillStyle="#ff2bd688";ctx.fillRect(x-r*.2,y+8,r*1.3,5);
 }

 if(s.type==="samurai"){
  ctx.strokeStyle="#fff";ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(x-r,y);ctx.lineTo(x+r,y);ctx.stroke();
 }

 if(s.type==="reaper"){
  ctx.strokeStyle="#000";ctx.lineWidth=5;
  ctx.beginPath();ctx.arc(x,y,r*.65,0,Math.PI*1.5);ctx.stroke();
 }

 ctx.restore();
}

/* =========================================================
   PLAYER DRAW
========================================================= */

function drawPlayer(p){
 const speed=Math.hypot(p.vx,p.vy);
 const skin=p===blue?getSkin():null;

 ctx.beginPath();
 ctx.ellipse(p.x,p.y+p.radius+5,p.radius*.8,p.radius*.25,0,0,Math.PI*2);
 ctx.fillStyle="#00000038";ctx.fill();

 ctx.beginPath();
 ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);

 if(skin){
  ctx.fillStyle=skin.c;
  ctx.shadowBlur=skin.rarity==="Legendary"?22:skin.rarity==="Mythic"?15:8;
  ctx.shadowColor=skin.c;
 }else{
  ctx.fillStyle=p.color;
  ctx.shadowBlur=0;
 }

 ctx.fill();
 ctx.shadowBlur=0;

 ctx.lineWidth=3;
 ctx.strokeStyle="#ffffffe6";
 ctx.stroke();

 if(skin)drawSkinPattern(skin,p);

 let dx=p.vx,dy=p.vy,len=Math.hypot(dx,dy);
 if(len<.1){dx=p===blue?1:-1;dy=0}
 else{dx/=len;dy/=len}

 ctx.beginPath();
 ctx.arc(p.x+dx*9,p.y+dy*9,5,0,Math.PI*2);
 ctx.fillStyle="#fff";ctx.fill();

 if(speed>1.5){
  ctx.beginPath();
  ctx.arc(p.x,p.y,p.radius+4+Math.sin(Date.now()/70)*2,0,Math.PI*2);
  ctx.strokeStyle=skin?skin.c:p.color;
  ctx.globalAlpha=.25;ctx.stroke();ctx.globalAlpha=1;
 }

 /* legendary orbit */
 if(skin&&skin.rarity==="Legendary"){
  ctx.beginPath();
  ctx.arc(p.x,p.y,p.radius+12,Date.now()/500,Date.now()/500+Math.PI*1.25);
  ctx.strokeStyle=skin.c;ctx.lineWidth=2;ctx.stroke();
 }
}

/* =========================================================
   BALL
========================================================= */

function drawBall(){
 ctx.beginPath();
 ctx.ellipse(ball.x,ball.y+ball.radius+5,ball.radius*.8,ball.radius*.25,0,0,Math.PI*2);
 ctx.fillStyle="#00000040";ctx.fill();

 ctx.beginPath();
 ctx.arc(ball.x,ball.y,ball.radius,0,Math.PI*2);
 ctx.fillStyle="#fff";ctx.fill();
 ctx.strokeStyle="#20252e";ctx.lineWidth=2;ctx.stroke();

 ctx.beginPath();
 ctx.arc(ball.x,ball.y,3,0,Math.PI*2);
 ctx.fillStyle="#20252e";ctx.fill();
}

function drawParticles(){
 for(const p of particles){
  ctx.globalAlpha=Math.max(0,p.life);
  ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
  ctx.fillStyle="#fff";ctx.fill();
 }
 ctx.globalAlpha=1;
}

/* =========================================================
   UPDATE
========================================================= */

function update(dt){
 if(!gameStarted)return;

 if(matchFinished){
  updateParticles(dt);return;
 }

 if(matchTime<=0){
  updateParticles(dt);finishMatch();return;
 }

 if(goalInProgress){
  updateParticles(dt);
  shake*=Math.pow(.82,dt*60);
  if(shake<.1)shake=0;
  return;
 }

 matchTime-=dt;
 if(matchTime<0)matchTime=0;

 const sec=Math.ceil(matchTime);
 const min=Math.floor(sec/60);
 const secs=sec%60;
 timerElement.textContent=`${String(min).padStart(2,"0")}:${String(secs).padStart(2,"0")}`;

 movePlayer(blue,{up:"w",down:"s",left:"a",right:"d",kick:" "},dt);

 if(gameMode==="local"){
  movePlayer(red,{up:"arrowup",down:"arrowdown",left:"arrowleft",right:"arrowright",kick:"enter"},dt);
 }else moveBot(dt);

 handlePlayerCollision(blue,red);
 handleBallCollision(blue);
 handleBallCollision(red);
 updateBall(dt);
 updateParticles(dt);

 shake*=Math.pow(.82,dt*60);
 if(shake<.1)shake=0;
}

/* =========================================================
   DRAW
========================================================= */

function draw(){
 ctx.save();

 if(shake>0){
  ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 }

 drawField();
 drawParticles();
 drawPlayer(blue);
 drawPlayer(red);
 drawBall();

 ctx.restore();
}

function gameLoop(now){
 let dt=(now-lastTime)/1000;
 dt=Math.min(dt,.033);
 lastTime=now;
 update(dt);
 draw();
 requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

/* =========================================================
   START
========================================================= */

function startGame(){
 gameStarted=true;
 matchFinished=false;
 resultOverlay.classList.add("hidden");
 showOnly(gameWrap);
 resizeCanvas();
 restartMatch();
 gameStarted=true;
 lastTime=performance.now();
}

/* =========================================================
   SOUND
========================================================= */

let audioContext=null;

function getAudio(){
 if(!audioContext){
  audioContext=new(window.AudioContext||window.webkitAudioContext)();
 }
 if(audioContext.state==="suspended")audioContext.resume();
 return audioContext;
}

function beep(f,d,type="sine",v=.04){
 const a=getAudio();
 const o=a.createOscillator();
 const g=a.createGain();

 o.type=type;o.frequency.value=f;
 g.gain.setValueAtTime(v,a.currentTime);
 g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);

 o.connect(g);g.connect(a.destination);
 o.start();o.stop(a.currentTime+d);
}

function playKickSound(){
 beep(120,.07,"square",.035);
 setTimeout(()=>beep(75,.05,"triangle",.025),25);
}

function playWallSound(){beep(170,.045,"triangle",.018)}

function playGoalSound(){
 beep(440,.12,"sine",.05);
 setTimeout(()=>beep(660,.14,"sine",.05),100);
 setTimeout(()=>beep(880,.2,"sine",.06),210);
}

function playResultSound(result){
 if(result==="win"){
  beep(523,.12,"sine",.05);
  setTimeout(()=>beep(659,.12,"sine",.05),100);
  setTimeout(()=>beep(784,.25,"sine",.06),200);
 }else if(result==="lose"){
  beep(300,.18,"triangle",.04);
  setTimeout(()=>beep(220,.3,"triangle",.04),140);
 }else{
  beep(440,.15,"triangle",.04);
  setTimeout(()=>beep(440,.15,"triangle",.04),180);
 }
}

/* =========================================================
   INIT
========================================================= */

updateCoins();
resizeCanvas();
showOnly(mainMenu);
</script>
