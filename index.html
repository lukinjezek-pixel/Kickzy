<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KICKZY</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
        radial-gradient(circle at 50% 0%,#17243b 0%,#080b12 55%,#05070b 100%);
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

/* =========================
   MENU
========================= */

#menu{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
    background:
        radial-gradient(circle at center,#182b46 0%,#090e18 55%,#05070b 100%);
}

.menu-box{
    width:min(520px,90vw);
    text-align:center;
}

.logo{
    font-size:clamp(65px,12vw,115px);
    font-weight:1000;
    letter-spacing:8px;
    line-height:.9;
    text-shadow:
        0 0 12px rgba(80,170,255,.5),
        0 0 35px rgba(80,170,255,.25);
    margin-bottom:12px;
}

.menu-subtitle{
    font-size:13px;
    font-weight:800;
    letter-spacing:6px;
    opacity:.55;
    margin-bottom:55px;
}

.menu-button{
    width:100%;
    border:none;
    border-radius:15px;
    padding:19px 25px;
    margin:8px 0;
    background:rgba(255,255,255,.08);
    color:white;
    font-size:20px;
    font-weight:900;
    letter-spacing:2px;
    cursor:pointer;
    transition:
        transform .15s ease,
        background .15s ease,
        box-shadow .15s ease;
}

.menu-button:hover{
    transform:translateY(-2px) scale(1.015);
    background:rgba(255,255,255,.14);
    box-shadow:0 8px 30px rgba(0,0,0,.3);
}

.menu-button:active{
    transform:scale(.98);
}

.menu-button.primary{
    background:linear-gradient(135deg,#318cff,#1761e8);
    box-shadow:0 8px 35px rgba(30,110,255,.25);
}

.menu-button.primary:hover{
    background:linear-gradient(135deg,#4399ff,#2470f5);
}

.menu-button.disabled{
    opacity:.35;
    cursor:not-allowed;
}

.menu-button.disabled:hover{
    transform:none;
    background:rgba(255,255,255,.08);
    box-shadow:none;
}

.back-button{
    margin-top:18px;
    background:transparent;
    font-size:14px;
    opacity:.65;
}

.back-button:hover{
    background:rgba(255,255,255,.05);
}

.menu-title{
    font-size:34px;
    font-weight:1000;
    letter-spacing:3px;
    margin-bottom:25px;
}

.menu-small{
    font-size:13px;
    opacity:.45;
    margin-top:25px;
}

.difficulty-easy{
    border-left:4px solid #55df78;
}

.difficulty-normal{
    border-left:4px solid #ffd34d;
}

.difficulty-hard{
    border-left:4px solid #ff5d68;
}

.hidden{
    display:none !important;
}

/* =========================
   GAME
========================= */

#gameScreen{
    position:fixed;
    inset:0;
    display:none;
    background:#176b3a;
}

#gameScreen.active{
    display:block;
}

canvas{
    position:absolute;
    inset:0;
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
}

.scoreboard{
    position:absolute;
    top:17px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:22px;
    padding:10px 20px;
    border-radius:14px;
    background:rgba(5,10,16,.68);
    backdrop-filter:blur(10px);
    z-index:5;
    pointer-events:none;
}

.team{
    font-size:14px;
    font-weight:1000;
    letter-spacing:1px;
}

.blue{
    color:#53a8ff;
}

.red{
    color:#ff6464;
}

.score{
    min-width:65px;
    text-align:center;
    font-size:27px;
    font-weight:1000;
}

.timer{
    position:absolute;
    top:72px;
    left:50%;
    transform:translateX(-50%);
    padding:6px 14px;
    border-radius:9px;
    background:rgba(5,10,16,.58);
    font-size:16px;
    font-weight:900;
    letter-spacing:1px;
    z-index:5;
    pointer-events:none;
}

#goalText{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:clamp(60px,12vw,125px);
    font-weight:1000;
    letter-spacing:7px;
    opacity:0;
    transform:scale(.65);
    pointer-events:none;
    z-index:10;
    text-shadow:
        0 8px 35px rgba(0,0,0,.5),
        0 0 35px rgba(255,255,255,.25);
}

#goalText.show{
    animation:goalAnimation 1.2s ease-out forwards;
}

@keyframes goalAnimation{
    0%{
        opacity:0;
        transform:scale(.65);
    }
    15%{
        opacity:1;
        transform:scale(1.18);
    }
    35%{
        opacity:1;
        transform:scale(1);
    }
    100%{
        opacity:0;
        transform:scale(1.04);
    }
}

#gameEnd{
    position:absolute;
    inset:0;
    z-index:20;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(3,7,12,.72);
    backdrop-filter:blur(8px);
}

.end-box{
    width:min(420px,88vw);
    padding:35px;
    border-radius:22px;
    background:rgba(15,22,34,.94);
    text-align:center;
    box-shadow:0 25px 70px rgba(0,0,0,.5);
}

.end-title{
    font-size:43px;
    font-weight:1000;
    letter-spacing:3px;
    margin-bottom:10px;
}

.end-score{
    font-size:25px;
    font-weight:900;
    margin-bottom:25px;
}

.end-buttons{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.game-button{
    border:none;
    border-radius:13px;
    padding:15px;
    background:rgba(255,255,255,.1);
    color:white;
    font-size:16px;
    font-weight:900;
    cursor:pointer;
    transition:.15s;
}

.game-button:hover{
    background:rgba(255,255,255,.17);
    transform:translateY(-1px);
}

.game-button.primary{
    background:#247cf0;
}

@media(max-width:600px){
    .logo{
        letter-spacing:5px;
    }

    .menu-subtitle{
        margin-bottom:35px;
    }

    .menu-title{
        font-size:27px;
    }

    .menu-button{
        padding:16px;
        font-size:17px;
    }

    .scoreboard{
        gap:13px;
        padding:8px 13px;
    }

    .team{
        font-size:11px;
    }

    .score{
        font-size:22px;
    }

    .timer{
        top:62px;
        font-size:14px;
    }
}
</style>
</head>

<body>

<!-- =========================
     MAIN MENU
========================= -->

<div id="menu">

    <!-- MAIN -->
    <div class="menu-box" id="mainMenu">
        <div class="logo">KICKZY</div>
        <div class="menu-subtitle">FAST 2D FOOTBALL</div>

        <button class="menu-button primary" id="playButton">
            ▶ PLAY
        </button>

        <button class="menu-button disabled" id="storeButton">
            🛒 STORE
        </button>

        <div class="menu-small">
            STORE COMING SOON
        </div>
    </div>


    <!-- MODE SELECT -->
    <div class="menu-box hidden" id="modeMenu">
        <div class="menu-title">SELECT MODE</div>

        <button class="menu-button primary" id="botButton">
            🤖 PLAY VS BOT
        </button>

        <button class="menu-button" id="localButton">
            👥 PLAY LOCAL
        </button>

        <button class="menu-button disabled">
            🌐 PLAY ONLINE
        </button>

        <div class="menu-small">
            ONLINE MULTIPLAYER COMING SOON
        </div>

        <button class="menu-button back-button" id="modeBack">
            ← BACK
        </button>
    </div>


    <!-- BOT DIFFICULTY -->
    <div class="menu-box hidden" id="difficultyMenu">
        <div class="menu-title">BOT DIFFICULTY</div>

        <button class="menu-button difficulty-easy" id="easyButton">
            🟢 EASY
        </button>

        <button class="menu-button difficulty-normal" id="normalButton">
            🟡 NORMAL
        </button>

        <button class="menu-button difficulty-hard" id="hardButton">
            🔴 HARD
        </button>

        <button class="menu-button back-button" id="difficultyBack">
            ← BACK
        </button>
    </div>

</div>


<!-- =========================
     GAME
========================= -->

<div id="gameScreen">

    <canvas id="game"></canvas>

    <div class="scoreboard">
        <span class="team blue">BLUE</span>
        <span class="score" id="score">0 - 0</span>
        <span class="team red">RED</span>
    </div>

    <div class="timer" id="timer">
        02:00
    </div>

    <div id="goalText">
        GOAL!
    </div>

    <div id="gameEnd" class="hidden">
        <div class="end-box">
            <div class="end-title" id="winnerText">
                BLUE WINS
            </div>

            <div class="end-score" id="finalScore">
                0 - 0
            </div>

            <div class="end-buttons">
                <button class="game-button primary" id="rematchButton">
                    ↻ REMATCH
                </button>

                <button class="game-button" id="menuButton">
                    MENU
                </button>
            </div>
        </div>
    </div>

</div>


<script>

/* =========================================================
   KICKZY
   ========================================================= */

/* =========================
   DOM
========================= */

const menu = document.getElementById("menu");

const mainMenu = document.getElementById("mainMenu");
const modeMenu = document.getElementById("modeMenu");
const difficultyMenu = document.getElementById("difficultyMenu");

const playButton = document.getElementById("playButton");
const botButton = document.getElementById("botButton");
const localButton = document.getElementById("localButton");

const easyButton = document.getElementById("easyButton");
const normalButton = document.getElementById("normalButton");
const hardButton = document.getElementById("hardButton");

const modeBack = document.getElementById("modeBack");
const difficultyBack = document.getElementById("difficultyBack");

const gameScreen = document.getElementById("gameScreen");

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreElement = document.getElementById("score");
const timerElement = document.getElementById("timer");
const goalText = document.getElementById("goalText");

const gameEnd = document.getElementById("gameEnd");
const winnerText = document.getElementById("winnerText");
const finalScore = document.getElementById("finalScore");

const rematchButton = document.getElementById("rematchButton");
const menuButton = document.getElementById("menuButton");


/* =========================
   FIXED GAME WORLD
   Keeps original physics
========================= */

const WORLD_W = 1000;
const WORLD_H = 560;

let viewW = WORLD_W;
let viewH = WORLD_H;

let scaleX = 1;
let scaleY = 1;


/* =========================
   CANVAS RESIZE
========================= */

function resizeCanvas(){

    const rect = canvas.getBoundingClientRect();

    const dpr = Math.min(
        window.devicePixelRatio || 1,
        2
    );

    viewW = rect.width;
    viewH = rect.height;

    canvas.width = Math.round(viewW * dpr);
    canvas.height = Math.round(viewH * dpr);

    scaleX = viewW / WORLD_W;
    scaleY = viewH / WORLD_H;

    ctx.setTransform(
        dpr * scaleX,
        0,
        0,
        dpr * scaleY,
        0,
        0
    );
}

window.addEventListener("resize",resizeCanvas);


/* =========================
   KEYBOARD
========================= */

const keys = {};

window.addEventListener("keydown",e=>{

    const key = e.key.toLowerCase();

    keys[key] = true;

    if([
        "arrowup",
        "arrowdown",
        "arrowleft",
        "arrowright",
        " "
    ].includes(key)){
        e.preventDefault();
    }

});

window.addEventListener("keyup",e=>{

    keys[e.key.toLowerCase()] = false;

});


/* =========================
   PLAYERS
========================= */

const blue = {

    x:0,
    y:0,

    vx:0,
    vy:0,

    radius:23,

    color:"#4ca7ff",

    kickCooldown:0,

    speed:.65,

    maxSpeed:5

};


const red = {

    x:0,
    y:0,

    vx:0,
    vy:0,

    radius:23,

    color:"#ff5e66",

    kickCooldown:0,

    speed:.65,

    maxSpeed:5

};


/* =========================
   BALL
========================= */

const ball = {

    x:0,
    y:0,

    vx:0,
    vy:0,

    radius:12

};


/* =========================
   GAME STATE
========================= */

let blueScore = 0;
let redScore = 0;

let matchTime = 120;

let lastTime = performance.now();

let particles = [];

let shake = 0;

let goalInProgress = false;

let goalRestartTimer = null;

let gameRunning = false;

let gameMode = "local";

let botDifficulty = "normal";

let matchEnded = false;


/* =========================
   FIELD
========================= */

const field = {

    left:35,
    right:965,

    top:35,
    bottom:525

};


const goal = {

    width:34,
    height:150

};


/* =========================
   RESET POSITIONS
========================= */

function resetPositions(){

    blue.x = WORLD_W * .28;
    blue.y = WORLD_H / 2;

    blue.vx = 0;
    blue.vy = 0;

    blue.kickCooldown = 0;


    red.x = WORLD_W * .72;
    red.y = WORLD_H / 2;

    red.vx = 0;
    red.vy = 0;

    red.kickCooldown = 0;


    ball.x = WORLD_W / 2;
    ball.y = WORLD_H / 2;

    ball.vx = 0;
    ball.vy = 0;

}


/* =========================
   HELPERS
========================= */

function clamp(value,min,max){

    return Math.max(
        min,
        Math.min(max,value)
    );

}


function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );

}


/* =========================================================
   PLAYER MOVEMENT
   ORIGINAL PHYSICS
========================================================= */

function movePlayer(player,controls,dt){

    let dx = 0;
    let dy = 0;


    if(keys[controls.up])
        dy -= 1;

    if(keys[controls.down])
        dy += 1;

    if(keys[controls.left])
        dx -= 1;

    if(keys[controls.right])
        dx += 1;


    if(dx !== 0 || dy !== 0){

        const length = Math.hypot(dx,dy);

        dx /= length;
        dy /= length;

        player.vx += dx * player.speed * dt * 60;
        player.vy += dy * player.speed * dt * 60;

    }


    const currentSpeed = Math.hypot(
        player.vx,
        player.vy
    );


    if(currentSpeed > player.maxSpeed){

        player.vx =
            player.vx / currentSpeed *
            player.maxSpeed;

        player.vy =
            player.vy / currentSpeed *
            player.maxSpeed;

    }


    player.vx *= Math.pow(.82,dt*60);
    player.vy *= Math.pow(.82,dt*60);


    player.x += player.vx * dt * 60;
    player.y += player.vy * dt * 60;


    player.x = clamp(
        player.x,
        field.left + player.radius,
        field.right - player.radius
    );


    player.y = clamp(
        player.y,
        field.top + player.radius,
        field.bottom - player.radius
    );


    player.kickCooldown -= dt;


    if(
        keys[controls.kick] &&
        player.kickCooldown <= 0
    ){

        kick(player);

        player.kickCooldown = .38;

    }

}


/* =========================
   KICK
========================= */

function kick(player){

    const dx = ball.x - player.x;
    const dy = ball.y - player.y;

    const dist = Math.hypot(dx,dy);

    if(dist > player.radius + ball.radius + 15)
        return;


    let nx;
    let ny;


    if(dist < .001){

        nx = player === blue ? 1 : -1;
        ny = 0;

    }else{

        nx = dx / dist;
        ny = dy / dist;

    }


    const power = 10.5;


    ball.vx += nx * power;
    ball.vy += ny * power;


    const maxBallSpeed = 15;

    const speed = Math.hypot(
        ball.vx,
        ball.vy
    );


    if(speed > maxBallSpeed){

        ball.vx =
            ball.vx / speed *
            maxBallSpeed;

        ball.vy =
            ball.vy / speed *
            maxBallSpeed;

    }


    createKickParticles(
        ball.x,
        ball.y,
        nx,
        ny
    );

    playKickSound();

}


/* =========================
   PLAYER COLLISION
========================= */

function handlePlayerCollision(a,b){

    const dx = b.x-a.x;
    const dy = b.y-a.y;

    const dist = Math.hypot(dx,dy);

    const minDist =
        a.radius+b.radius;


    if(
        dist > 0 &&
        dist < minDist
    ){

        const nx = dx/dist;
        const ny = dy/dist;

        const overlap =
            minDist-dist;

        a.x -= nx * overlap/2;
        a.y -= ny * overlap/2;

        b.x += nx * overlap/2;
        b.y += ny * overlap/2;


        const relativeVelocity =
            (b.vx-a.vx)*nx +
            (b.vy-a.vy)*ny;


        if(relativeVelocity < 0){

            const impulse =
                -relativeVelocity*.45;

            a.vx -= nx*impulse;
            a.vy -= ny*impulse;

            b.vx += nx*impulse;
            b.vy += ny*impulse;

        }

    }

}


/* =========================
   BALL COLLISION
========================= */

function handleBallCollision(player){

    const dx = ball.x-player.x;
    const dy = ball.y-player.y;

    const dist = Math.hypot(dx,dy);

    const minDist =
        player.radius+ball.radius;


    if(
        dist > 0 &&
        dist < minDist
    ){

        const nx = dx/dist;
        const ny = dy/dist;

        const overlap =
            minDist-dist;

        ball.x += nx*overlap;
        ball.y += ny*overlap;


        const velocity =
            ball.vx*nx+
            ball.vy*ny;


        if(velocity < 0){

            ball.vx -= nx*velocity*1.25;
            ball.vy -= ny*velocity*1.25;

        }

    }

}


/* =========================
   BALL UPDATE
========================= */

function updateBall(dt){

    ball.x += ball.vx*dt*60;
    ball.y += ball.vy*dt*60;


    ball.vx *= Math.pow(.985,dt*60);
    ball.vy *= Math.pow(.985,dt*60);


    const goalTop =
        WORLD_H/2-goal.height/2;

    const goalBottom =
        WORLD_H/2+goal.height/2;


    /* TOP WALL */

    if(ball.y-ball.radius < field.top){

        ball.y =
            field.top+ball.radius;

        ball.vy = Math.abs(ball.vy)*.75;

        createBounceParticles(
            ball.x,
            field.top
        );

        playWallSound();

    }


    /* BOTTOM WALL */

    if(ball.y+ball.radius > field.bottom){

        ball.y =
            field.bottom-ball.radius;

        ball.vy = -Math.abs(ball.vy)*.75;

        createBounceParticles(
            ball.x,
            field.bottom
        );

        playWallSound();

    }


    /* LEFT WALL / GOAL */

    if(ball.x-ball.radius < field.left){

        if(
            ball.y > goalTop &&
            ball.y < goalBottom
        ){

            if(ball.x < -10){

                goalScored("red");

                return;

            }

        }else{

            ball.x =
                field.left+ball.radius;

            ball.vx =
                Math.abs(ball.vx)*.75;

            createBounceParticles(
                field.left,
                ball.y
            );

            playWallSound();

        }

    }


    /* RIGHT WALL / GOAL */

    if(ball.x+ball.radius > field.right){

        if(
            ball.y > goalTop &&
            ball.y < goalBottom
        ){

            if(ball.x > WORLD_W+10){

                goalScored("blue");

                return;

            }

        }else{

            ball.x =
                field.right-ball.radius;

            ball.vx =
                -Math.abs(ball.vx)*.75;

            createBounceParticles(
                field.right,
                ball.y
            );

            playWallSound();

        }

    }

}


/* =========================================================
   BOT
========================================================= */

const botState = {

    reactionTimer:0,

    targetX:0,

    targetY:0,

    kickTimer:0

};


function updateBot(dt){

    if(gameMode !== "bot")
        return;


    if(goalInProgress || matchEnded)
        return;


    let reactionSpeed;

    let accuracy;

    let aggression;


    if(botDifficulty === "easy"){

        reactionSpeed = .28;
        accuracy = .55;
        aggression = .55;

    }

    else if(botDifficulty === "normal"){

        reactionSpeed = .12;
        accuracy = .78;
        aggression = .78;

    }

    else{

        reactionSpeed = .045;
        accuracy = .94;
        aggression = 1;

    }


    botState.reactionTimer -= dt;


    if(botState.reactionTimer <= 0){

        botState.reactionTimer =
            reactionSpeed +
            Math.random()*.08;


        let targetX;
        let targetY;


        /*
          When the ball is on the red side,
          the bot attacks it.
        */

        if(ball.x > WORLD_W*.48){

            targetX = ball.x;
            targetY = ball.y;

        }

        /*
          When ball is far away,
          bot returns toward its half.
        */

        else{

            targetX =
                WORLD_W*.72 +
                (ball.x-WORLD_W*.5)*.12;

            targetY =
                WORLD_H*.5 +
                (ball.y-WORLD_H*.5)*.45;

        }


        /*
          Add small errors on easier difficulties.
        */

        const error =
            (1-accuracy)*70;


        targetX +=
            (Math.random()-.5)*error;

        targetY +=
            (Math.random()-.5)*error;


        botState.targetX = clamp(
            targetX,
            field.left+red.radius,
            field.right-red.radius
        );


        botState.targetY = clamp(
            targetY,
            field.top+red.radius,
            field.bottom-red.radius
        );

    }


    const dx =
        botState.targetX-red.x;

    const dy =
        botState.targetY-red.y;

    const dist =
        Math.hypot(dx,dy);


    if(dist > 4){

        const nx = dx/dist;
        const ny = dy/dist;


        /*
          Bot uses the same basic movement physics
          as the human player.
        */

        red.vx +=
            nx * red.speed * dt * 60 *
            aggression;

        red.vy +=
            ny * red.speed * dt * 60 *
            aggression;

    }


    const currentSpeed =
        Math.hypot(red.vx,red.vy);


    if(currentSpeed > red.maxSpeed){

        red.vx =
            red.vx/currentSpeed*
            red.maxSpeed;

        red.vy =
            red.vy/currentSpeed*
            red.maxSpeed;

    }


    red.vx *= Math.pow(.82,dt*60);
    red.vy *= Math.pow(.82,dt*60);


    red.x += red.vx*dt*60;
    red.y += red.vy*dt*60;


    red.x = clamp(
        red.x,
        field.left+red.radius,
        field.right-red.radius
    );


    red.y = clamp(
        red.y,
        field.top+red.radius,
        field.bottom-red.radius
    );


    red.kickCooldown -= dt;


    const ballDistance =
        distance(red,ball);


    /*
      Bot decides when to kick.
    */

    if(
        ballDistance <
        red.radius+ball.radius+18 &&
        red.kickCooldown <= 0
    ){

        /*
          Easy bot sometimes misses its timing.
        */

        let shouldKick = true;


        if(botDifficulty === "easy"){

            shouldKick =
                Math.random() < .72;

        }

        else if(botDifficulty === "normal"){

            shouldKick =
                Math.random() < .9;

        }


        if(shouldKick){

            kick(red);

        }


        red.kickCooldown =
            botDifficulty === "hard"
                ? .25
                : .38;

    }

}


/* =========================================================
   GOAL
========================================================= */

function goalScored(team){

    if(goalInProgress || matchEnded)
        return;


    goalInProgress = true;


    if(team === "blue"){

        blueScore++;

    }else{

        redScore++;

    }


    scoreElement.textContent =
        `${blueScore} - ${redScore}`;


    /*
      Stop the ball immediately.
    */

    ball.vx = 0;
    ball.vy = 0;


    /*
      Put ball inside the correct goal.
    */

    if(team === "blue"){

        ball.x = WORLD_W+18;

    }else{

        ball.x = -18;

    }


    ball.y = WORLD_H/2;


    goalText.classList.remove("show");

    void goalText.offsetWidth;

    goalText.textContent = "GOAL!";

    goalText.classList.add("show");


    shake = 12;


    createGoalParticles(
        team === "blue"
            ? WORLD_W-25
            : 25,
        WORLD_H/2
    );


    playGoalSound();


    goalRestartTimer =
        setTimeout(()=>{

            goalInProgress = false;

            resetPositions();

        },900);

}


/* =========================================================
   PARTICLES
========================================================= */

function createKickParticles(x,y,nx,ny){

    for(let i=0;i<8;i++){

        particles.push({

            x:x,
            y:y,

            vx:
                nx*(2+Math.random()*3)+
                (Math.random()-.5)*2,

            vy:
                ny*(2+Math.random()*3)+
                (Math.random()-.5)*2,

            life:.35+Math.random()*.25,

            maxLife:.6,

            size:2+Math.random()*3

        });

    }

}


function createBounceParticles(x,y){

    for(let i=0;i<5;i++){

        particles.push({

            x:x,
            y:y,

            vx:(Math.random()-.5)*3,

            vy:(Math.random()-.5)*3,

            life:.25,

            maxLife:.25,

            size:2+Math.random()*2

        });

    }

}


function createGoalParticles(x,y){

    for(let i=0;i<70;i++){

        const angle =
            Math.random()*Math.PI*2;

        const speed =
            2+Math.random()*7;


        particles.push({

            x:x,
            y:y,

            vx:Math.cos(angle)*speed,

            vy:Math.sin(angle)*speed,

            life:.7+Math.random()*.7,

            maxLife:1.4,

            size:2+Math.random()*5

        });

    }

}


function updateParticles(dt){

    for(let i=particles.length-1;i>=0;i--){

        const p=particles[i];

        p.x += p.vx*dt*60;
        p.y += p.vy*dt*60;

        p.vx *= .96;
        p.vy *= .96;

        p.life -= dt;


        if(p.life <= 0){

            particles.splice(i,1);

        }

    }

}


/* =========================================================
   DRAW FIELD
========================================================= */

function drawField(){

    /*
      Grass
    */

    ctx.fillStyle="#176b3a";

    ctx.fillRect(
        0,
        0,
        WORLD_W,
        WORLD_H
    );


    /*
      Grass stripes
    */

    for(let x=field.left;x<field.right;x+=70){

        ctx.fillStyle =
            ((x-field.left)/70)%2===0
                ? "rgba(255,255,255,.018)"
                : "rgba(0,0,0,.018)";

        ctx.fillRect(
            x,
            field.top,
            70,
            field.bottom-field.top
        );

    }


    /*
      Field border
    */

    ctx.strokeStyle="rgba(255,255,255,.82)";
    ctx.lineWidth=4;

    ctx.strokeRect(
        field.left,
        field.top,
        field.right-field.left,
        field.bottom-field.top
    );


    /*
      Center line
    */

    ctx.beginPath();

    ctx.moveTo(
        WORLD_W/2,
        field.top
    );

    ctx.lineTo(
        WORLD_W/2,
        field.bottom
    );

    ctx.stroke();


    /*
      Center circle
    */

    ctx.beginPath();

    ctx.arc(
        WORLD_W/2,
        WORLD_H/2,
        75,
        0,
        Math.PI*2
    );

    ctx.stroke();


    /*
      Center dot
    */

    ctx.beginPath();

    ctx.arc(
        WORLD_W/2,
        WORLD_H/2,
        4,
        0,
        Math.PI*2
    );

    ctx.fillStyle="white";

    ctx.fill();


    drawPenaltyArea("left");
    drawPenaltyArea("right");


    /*
      Goals
    */

    const goalTop =
        WORLD_H/2-goal.height/2;


    ctx.fillStyle="rgba(255,255,255,.13)";

    ctx.fillRect(
        field.left-goal.width,
        goalTop,
        goal.width,
        goal.height
    );

    ctx.fillRect(
        field.right,
        goalTop,
        goal.width,
        goal.height
    );


    ctx.strokeStyle="rgba(255,255,255,.65)";

    ctx.strokeRect(
        field.left-goal.width,
        goalTop,
        goal.width,
        goal.height
    );

    ctx.strokeRect(
        field.right,
        goalTop,
        goal.width,
        goal.height
    );

}


function drawPenaltyArea(side){

    const width=120;
    const height=240;

    const x =
        side==="left"
            ? field.left
            : field.right-width;

    const y =
        WORLD_H/2-height/2;


    ctx.strokeRect(
        x,
        y,
        width,
        height
    );

}


/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer(player){

    /*
      Shadow
    */

    ctx.beginPath();

    ctx.ellipse(
        player.x,
        player.y+player.radius*.75,
        player.radius*1.05,
        player.radius*.4,
        0,
        0,
        Math.PI*2
    );

    ctx.fillStyle="rgba(0,0,0,.25)";

    ctx.fill();


    /*
      Player
    */

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        player.radius,
        0,
        Math.PI*2
    );

    ctx.fillStyle=player.color;

    ctx.fill();


    /*
      Highlight
    */

    ctx.beginPath();

    ctx.arc(
        player.x-7,
        player.y-7,
        player.radius*.35,
        0,
        Math.PI*2
    );

    ctx.fillStyle="rgba(255,255,255,.2)";

    ctx.fill();


    /*
      Outline
    */

    ctx.strokeStyle="rgba(255,255,255,.75)";
    ctx.lineWidth=2;

    ctx.stroke();


    /*
      Small direction indicator
    */

    const speed =
        Math.hypot(
            player.vx,
            player.vy
        );


    if(speed>.4){

        const dx =
            player.vx/speed;

        const dy =
            player.vy/speed;


        ctx.beginPath();

        ctx.moveTo(
            player.x+dx*10,
            player.y+dy*10
        );

        ctx.lineTo(
            player.x+dx*17,
            player.y+dy*17
        );

        ctx.strokeStyle="rgba(255,255,255,.7)";
        ctx.lineWidth=3;

        ctx.stroke();

    }

}


/* =========================================================
   DRAW BALL
========================================================= */

function drawBall(){

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.radius,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#ffffff";

    ctx.fill();


    ctx.strokeStyle="rgba(0,0,0,.3)";
    ctx.lineWidth=2;

    ctx.stroke();


    /*
      Ball highlight
    */

    ctx.beginPath();

    ctx.arc(
        ball.x-3,
        ball.y-3,
        3,
        0,
        Math.PI*2
    );

    ctx.fillStyle="rgba(255,255,255,.8)";

    ctx.fill();

}


/* =========================================================
   DRAW PARTICLES
========================================================= */

function drawParticles(){

    for(const p of particles){

        const alpha =
            Math.max(
                0,
                p.life/p.maxLife
            );


        ctx.globalAlpha=alpha;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fillStyle="#ffffff";

        ctx.fill();

    }

    ctx.globalAlpha=1;

}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

    if(!gameRunning || matchEnded)
        return;


    if(!goalInProgress){

        matchTime -= dt;


        if(matchTime <= 0){

            matchTime=0;

            endMatch();

            return;

        }


        /*
          BLUE HUMAN
        */

        movePlayer(
            blue,
            {
                up:"w",
                down:"s",
                left:"a",
                right:"d",
                kick:" "
            },
            dt
        );


        /*
          RED
        */

        if(gameMode === "local"){

            movePlayer(
                red,
                {
                    up:"arrowup",
                    down:"arrowdown",
                    left:"arrowleft",
                    right:"arrowright",
                    kick:"enter"
                },
                dt
            );

        }else{

            updateBot(dt);

        }


        handlePlayerCollision(
            blue,
            red
        );


        handleBallCollision(blue);
        handleBallCollision(red);


        updateBall(dt);

    }


    updateParticles(dt);


    if(shake>0){

        shake *= Math.pow(.08,dt);

        if(shake<.1)
            shake=0;

    }


    const minutes =
        Math.floor(matchTime/60);

    const seconds =
        Math.floor(matchTime%60);


    timerElement.textContent =
        `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;

}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    /*
      Reset transform.
    */

    const dpr =
        Math.min(
            window.devicePixelRatio||1,
            2
        );


    ctx.setTransform(
        dpr*scaleX,
        0,
        0,
        dpr*scaleY,
        0,
        0
    );


    ctx.save();


    if(shake>0){

        ctx.translate(
            (Math.random()-.5)*shake,
            (Math.random()-.5)*shake
        );

    }


    drawField();

    drawParticles();

    drawPlayer(blue);

    drawPlayer(red);

    drawBall();


    ctx.restore();

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(now){

    const dt =
        Math.min(
            (now-lastTime)/1000,
            .033
        );


    lastTime=now;


    update(dt);

    draw();


    requestAnimationFrame(gameLoop);

}


/* =========================================================
   START GAME
========================================================= */

function startGame(mode,difficulty=null){

    gameMode=mode;

    botDifficulty=difficulty;

    menu.classList.add("hidden");

    gameScreen.classList.add("active");

    gameEnd.classList.add("hidden");


    blueScore=0;
    redScore=0;

    matchTime=120;

    particles=[];

    goalInProgress=false;

    matchEnded=false;

    gameRunning=true;


    scoreElement.textContent="0 - 0";

    timerElement.textContent="02:00";


    resetPositions();

    resizeCanvas();


    lastTime=performance.now();

    getAudio();

}


/* =========================================================
   END GAME
========================================================= */

function endMatch(){

    if(matchEnded)
        return;


    matchEnded=true;

    gameRunning=false;


    finalScore.textContent =
        `${blueScore} - ${redScore}`;


    if(blueScore > redScore){

        winnerText.textContent =
            "BLUE WINS";

    }

    else if(redScore > blueScore){

        winnerText.textContent =
            "RED WINS";

    }

    else{

        winnerText.textContent =
            "DRAW";

    }


    gameEnd.classList.remove("hidden");

}


/* =========================================================
   RETURN TO MENU
========================================================= */

function returnToMainMenu(){

    gameRunning=false;

    matchEnded=true;

    gameScreen.classList.remove("active");

    menu.classList.remove("hidden");

    showMainMenu();

}


/* =========================================================
   MENU NAVIGATION
========================================================= */

function showMainMenu(){

    mainMenu.classList.remove("hidden");

    modeMenu.classList.add("hidden");

    difficultyMenu.classList.add("hidden");

}


playButton.addEventListener("click",()=>{

    mainMenu.classList.add("hidden");

    modeMenu.classList.remove("hidden");

});


botButton.addEventListener("click",()=>{

    modeMenu.classList.add("hidden");

    difficultyMenu.classList.remove("hidden");

});


localButton.addEventListener("click",()=>{

    startGame("local");

});


modeBack.addEventListener("click",()=>{

    showMainMenu();

});


difficultyBack.addEventListener("click",()=>{

    modeMenu.classList.remove("hidden");

    difficultyMenu.classList.add("hidden");

});


easyButton.addEventListener("click",()=>{

    startGame(
        "bot",
        "easy"
    );

});


normalButton.addEventListener("click",()=>{

    startGame(
        "bot",
        "normal"
    );

});


hardButton.addEventListener("click",()=>{

    startGame(
        "bot",
        "hard"
    );

});


rematchButton.addEventListener("click",()=>{

    gameEnd.classList.add("hidden");

    startGame(
        gameMode,
        botDifficulty
    );

});


menuButton.addEventListener("click",()=>{

    returnToMainMenu();

});


/* =========================================================
   AUDIO
========================================================= */

let audioContext=null;


function getAudio(){

    if(!audioContext){

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }


    if(audioContext.state==="suspended"){

        audioContext.resume();

    }


    return audioContext;

}


function beep(
    frequency,
    duration,
    volume,
    type="sine"
){

    const audio=getAudio();

    const oscillator =
        audio.createOscillator();

    const gain =
        audio.createGain();


    oscillator.type=type;

    oscillator.frequency.value=
        frequency;


    gain.gain.setValueAtTime(
        volume,
        audio.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        .001,
        audio.currentTime+duration
    );


    oscillator.connect(gain);

    gain.connect(audio.destination);


    oscillator.start();

    oscillator.stop(
        audio.currentTime+duration
    );

}


function playKickSound(){

    beep(
        150,
        .055,
        .035,
        "square"
    );

}


function playWallSound(){

    beep(
        90,
        .045,
        .018,
        "triangle"
    );

}


function playGoalSound(){

    beep(
        330,
        .12,
        .06,
        "sawtooth"
    );


    setTimeout(()=>{

        beep(
            440,
            .16,
            .06,
            "sawtooth"
        );

    },90);


    setTimeout(()=>{

        beep(
            660,
            .22,
            .055,
            "sawtooth"
        );

    },190);

}


/* =========================================================
   START
========================================================= */

resizeCanvas();

resetPositions();

requestAnimationFrame(gameLoop);

</script>
