let audioContext=null;

function audio(){
  if(!audioContext){
    audioContext=new(window.AudioContext||window.webkitAudioContext)();
  }

  if(audioContext.state==="suspended"){
    audioContext.resume();
  }

  return audioContext;
}

function sound(freq,duration=.06,type="sine",volume=.035){
  if(!sfxEnabled)return;

  try{
    const a=audio();

    const o=a.createOscillator();
    const g=a.createGain();

    o.type=type;
    o.frequency.value=freq;

    g.gain.setValueAtTime(volume,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+duration);

    o.connect(g);
    g.connect(a.destination);

    o.start();
    o.stop(a.currentTime+duration);
  }catch{}
}

function clickSound(){
  sound(560,.045,"square",.025);
}

function hoverSound(){
  sound(800,.025,"sine",.012);
}

document.addEventListener("click",e=>{
  if(e.target.closest("button")){
    clickSound();
    if(musicEnabled&&!musicTimer)startMusic();
  }
});

document.querySelectorAll("button").forEach(btn=>{
  btn.addEventListener("mouseenter",hoverSound);
});

function updateSettingsUI(){
  document.getElementById("sfxToggle").classList.toggle("on",sfxEnabled);
  document.getElementById("musicToggle").classList.toggle("on",musicEnabled);
}

function playMusicNote(){
  if(!musicEnabled)return;

  try{
    const a=audio();
    const notes=[220,277.18,329.63,369.99,440,329.63,277.18,246.94];
    const o=a.createOscillator();
    const g=a.createGain();

    o.type="sine";
    o.frequency.value=notes[musicStep%notes.length];
    g.gain.setValueAtTime(.0001,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.018,a.currentTime+.04);
    g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.42);

    o.connect(g);
    g.connect(a.destination);
    o.start();
    o.stop(a.currentTime+.45);

    musicStep++;
  }catch{}
}

function startMusic(){
  if(!musicEnabled||musicTimer)return;
  playMusicNote();
  musicTimer=setInterval(playMusicNote,480);
}

function stopMusic(){
  if(musicTimer){
    clearInterval(musicTimer);
    musicTimer=null;
  }
}

function resizeCanvas(){
  const rect=canvas.getBoundingClientRect();
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.max(1,rect.width*dpr);
  canvas.height=Math.max(1,rect.height*dpr);
  W=rect.width;
  H=rect.height;
  gameScale=Math.min(W/BASE_W,H/BASE_H);
  offsetX=(W-BASE_W*gameScale)/2;
  offsetY=(H-BASE_H*gameScale)/2;
  ctx.setTransform(
    dpr*gameScale,0,0,dpr*gameScale,
    dpr*offsetX,dpr*offsetY
  );
}

/* =========================================================
   PLAYERS
========================================================= */

let players=[];
let blue=null;
let red=null;

const playerColors={blue:"#4ca7ff",red:"#ff5e66"};

function makePlayer(team,human,index,control=index){
  return {
    id:`${team}-${index}-${Math.random()}`,
    team,
    human,
    index,
    control,
    x:0,y:0,vx:0,vy:0,
    radius:matchSize===1?23:22,
    color:playerColors[team],
    speed:human?.72:.62,
    maxSpeed:human?5.1:4.8,
    kickCooldown:0,
    botThink:0,
    botKick:0,
    stuckTimer:0,
    targetX:0,
    targetY:0
  };
}

const ball={x:0,y:0,vx:0,vy:0,radius:12};
let blueScore=0;
let redScore=0;
let matchTime=120;
let lastTime=performance.now();
let particles=[];
let shake=0;
let goalInProgress=false;
let goalRestartTimer=null;

function setupPlayers(){
  players=[];
  const n=matchSize;

  if(n===1){
    const localTwoPlayer=isTouchMobile && gameMode==="local" ? false : gameMode==="local";
    players.push(makePlayer("blue",true,0));
    players.push(makePlayer("red",localTwoPlayer,1));
    if(gameMode==="bot" || isTouchMobile)players[1].human=false;
  }else if(teamMode==="solo"){
    players.push(makePlayer("blue",true,0));
    for(let i=1;i<n;i++)players.push(makePlayer("blue",false,i));
    for(let i=0;i<n;i++)players.push(makePlayer("red",false,i));
  }else if(teamMode==="together"){
    players.push(makePlayer("blue",true,0,0));
    players.push(makePlayer("blue",true,1,1));
    for(let i=2;i<n;i++)players.push(makePlayer("blue",false,i));
    for(let i=0;i<n;i++)players.push(makePlayer("red",false,i));
  }else{
    players.push(makePlayer("blue",true,0));
    players.push(makePlayer("red",true,0,1));
    for(let i=1;i<n;i++)players.push(makePlayer("blue",false,i));
    for(let i=1;i<n;i++)players.push(makePlayer("red",false,i));
  }

  blue=players.find(p=>p.team==="blue"&&p.human)||players.find(p=>p.team==="blue");
  red=players.find(p=>p.team==="red"&&p.human)||players.find(p=>p.team==="red");
}

function resetPositions(){
  const bluePlayers=players.filter(p=>p.team==="blue");
  const redPlayers=players.filter(p=>p.team==="red");
  const fieldW=field.right-field.left;
  const fieldH=field.bottom-field.top;

  bluePlayers.forEach((p,i)=>{
    const col=i%2;
    const row=Math.floor(i/2);
    const rows=Math.ceil(bluePlayers.length/2);
    p.x=field.left+fieldW*(.18+col*.12);
    p.y=field.top+fieldH*((row+1)/(rows+1));
    p.vx=p.vy=0;
    p.kickCooldown=0;
    p.botThink=0;
    p.botKick=0;
    p.stuckTimer=0;
  });

  redPlayers.forEach((p,i)=>{
    const col=i%2;
    const row=Math.floor(i/2);
    const rows=Math.ceil(redPlayers.length/2);
    p.x=field.left+fieldW*(.82-col*.12);
    p.y=field.top+fieldH*((row+1)/(rows+1));
    p.vx=p.vy=0;
    p.kickCooldown=0;
    p.botThink=0;
    p.botKick=0;
    p.stuckTimer=0;
  });

  ball.x=BASE_W/2;
  ball.y=BASE_H/2;
  ball.vx=0;
  ball.vy=0;
}

/* =========================================================
   HELPERS
========================================================= */
function clamp(v,min,max){return Math.max(min,Math.min(max,v));}
function distance(a,b,c,d){return Math.hypot(c-a,d-b);}
function teamPlayers(team){return players.filter(p=>p.team===team);}

function playerInput(p){
  if(!p.human)return {up:false,down:false,left:false,right:false,kick:false};

  // Touch devices always use the mobile controls, including the online guest.
  if(isTouchMobile){
    return {
      up:mobileInput.y < -.25,
      down:mobileInput.y > .25,
      left:mobileInput.x < -.25,
      right:mobileInput.x > .25,
      kick:mobileInput.shoot
    };
  }

  if(p.control===0){
    return {
      up:keys["w"]||false,
      down:keys["s"]||false,
      left:keys["a"]||false,
      right:keys["d"]||false,
      kick:keys[" "]||false
    };
  }
  return {
    up:keys["arrowup"]||false,
    down:keys["arrowdown"]||false,
    left:keys["arrowleft"]||false,
    right:keys["arrowright"]||false,
    kick:keys["enter"]||false
  };
}

function movePlayer(p,input,dt){
  let dx=0,dy=0;
  if(input.up)dy--;
  if(input.down)dy++;
  if(input.left)dx--;
  if(input.right)dx++;
  if(p===blue&&p.index===0){dx+=mobileInput.x;dy+=mobileInput.y;}

  const len=Math.hypot(dx,dy);
  if(len>1){dx/=len;dy/=len;}

  if(dx||dy){
    p.vx+=dx*p.speed*dt*60;
    p.vy+=dy*p.speed*dt*60;
  }

  const sp=Math.hypot(p.vx,p.vy);
  if(sp>p.maxSpeed){p.vx=p.vx/sp*p.maxSpeed;p.vy=p.vy/sp*p.maxSpeed;}
  p.vx*=Math.pow(.82,dt*60);
  p.vy*=Math.pow(.82,dt*60);
  p.x+=p.vx*dt*60;
  p.y+=p.vy*dt*60;

  p.x=clamp(p.x,field.left+p.radius,field.right-p.radius);
  p.y=clamp(p.y,field.top+p.radius,field.bottom-p.radius);

  p.kickCooldown-=dt;
  if(input.kick&&p.kickCooldown<=0){
    kick(p);
    p.kickCooldown=.38;
  }
}

/* =========================================================
   BOT AI
========================================================= */
function moveBot(p,dt){
  if(goalInProgress)return;

  let reaction=.12,speed=.82,error=8;
  if(botDifficulty==="easy"){reaction=.20;speed=.70;error=25;}
  if(botDifficulty==="hard"){reaction=.055;speed=1;error=4;}

  p.botThink-=dt;
  p.botKick-=dt;

  // If a bot gets trapped against a corner/edge, force it back toward the playable area.
  const nearLeft=p.x<=field.left+p.radius+3;
  const nearRight=p.x>=field.right-p.radius-3;
  const nearTop=p.y<=field.top+p.radius+3;
  const nearBottom=p.y>=field.bottom-p.radius-3;
  const lowSpeed=Math.hypot(p.vx,p.vy)<.7;
  if((nearLeft||nearRight||nearTop||nearBottom)&&lowSpeed)p.stuckTimer+=dt;
  else p.stuckTimer=Math.max(0,p.stuckTimer-dt*2);

  if(p.stuckTimer>.45){
    p.targetX=BASE_W/2;
    p.targetY=BASE_H/2;
    p.botThink=0;
    p.stuckTimer=0;
  }

  if(p.botThink<=0){
    p.botThink=reaction;
    let tx=ball.x+(Math.random()-.5)*error;
    let ty=ball.y+(Math.random()-.5)*error;

    const teammates=teamPlayers(p.team);
    const mateIndex=teammates.indexOf(p);
    // Spread bots so they do not all stack on the ball.
    if(teammates.length>1&&distance(p.x,p.y,ball.x,ball.y)>130){
      const spacing=(mateIndex-(teammates.length-1)/2)*55;
      ty+=spacing;
    }

    // Stay on the correct half when the ball is far away.
    const homeX=p.team==="blue"
      ?field.left+(field.right-field.left)*.28
      :field.right-(field.right-field.left)*.28;
    if(distance(ball.x,ball.y,BASE_W/2,BASE_H/2)>250){
      tx=ball.x*.72+homeX*.28;
    }

    p.targetX=clamp(tx,field.left+p.radius,field.right-p.radius);
    p.targetY=clamp(ty,field.top+p.radius,field.bottom-p.radius);
  }

  let dx=p.targetX-p.x;
  let dy=p.targetY-p.y;
  const d=Math.hypot(dx,dy);
  if(d>3){dx/=d;dy/=d;}else{dx=dy=0;}

  if(p.stuckTimer>0){
    dx+=(BASE_W/2-p.x)/Math.max(BASE_W,1)*2;
    dy+=(BASE_H/2-p.y)/Math.max(BASE_H,1)*2;
    const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
  }

  p.vx+=dx*p.speed*speed*dt*60;
  p.vy+=dy*p.speed*speed*dt*60;

  const max=p.maxSpeed*speed;
  const sp=Math.hypot(p.vx,p.vy);
  if(sp>max){p.vx=p.vx/sp*max;p.vy=p.vy/sp*max;}
  p.vx*=Math.pow(.82,dt*60);
  p.vy*=Math.pow(.82,dt*60);
  p.x+=p.vx*dt*60;
  p.y+=p.vy*dt*60;
  p.x=clamp(p.x,field.left+p.radius,field.right-p.radius);
  p.y=clamp(p.y,field.top+p.radius,field.bottom-p.radius);

  p.kickCooldown-=dt;
  const bd=distance(p.x,p.y,ball.x,ball.y);
  const kickRange=p.radius+ball.radius+10;
  if(bd<kickRange&&p.kickCooldown<=0&&p.botKick<=0){
    const enemyGoalX=p.team==="blue"?field.right:field.left;
    const targetY=BASE_H/2+(Math.random()-.5)*error*3;
    let kx=enemyGoalX-ball.x;
    let ky=targetY-ball.y;
    const len=Math.hypot(kx,ky)||1;
    kx/=len;ky/=len;
    ball.vx=kx*10.5+p.vx*.45;
    ball.vy=ky*10.5+p.vy*.45;
    createKickParticles(ball.x-kx*7,ball.y-ky*7);
    playKickSound();
    p.kickCooldown=.38;
    p.botKick=.30;
  }
}

/* =========================================================
   KICK / COLLISIONS
========================================================= */
function kick(p){
  const dx=ball.x-p.x;
  const dy=ball.y-p.y;
  const d=Math.hypot(dx,dy);
  // Human kick range is still forgiving, but much smaller than the old bot hitbox.
  if(d<p.radius+ball.radius+20){
    let nx,ny;
    if(d<.01){nx=p.team==="blue"?1:-1;ny=0;}
    else{nx=dx/d;ny=dy/d;}
    ball.vx=nx*10.5+p.vx*.45;
    ball.vy=ny*10.5+p.vy*.45;
    createKickParticles(ball.x-nx*7,ball.y-ny*7);
    playKickSound();
  }
}

function handlePlayerCollision(a,b){
  const dx=b.x-a.x,dy=b.y-a.y;
  const d=Math.hypot(dx,dy);
  const min=a.radius+b.radius;
  if(d>0&&d<min){
    const nx=dx/d,ny=dy/d,overlap=min-d;
    a.x-=nx*overlap/2;a.y-=ny*overlap/2;
    b.x+=nx*overlap/2;b.y+=ny*overlap/2;
    a.vx-=nx*1.2;a.vy-=ny*1.2;
    b.vx+=nx*1.2;b.vy+=ny*1.2;
  }
}

function handleBallCollision(p){
  if(goalInProgress)return;
  const dx=ball.x-p.x,dy=ball.y-p.y;
  const d=Math.hypot(dx,dy);
  const min=p.radius+ball.radius;
  if(d<min&&d>0){
    const nx=dx/d,ny=dy/d,overlap=min-d;
    ball.x+=nx*overlap;
    ball.y+=ny*overlap;
    const speed=Math.max(Math.hypot(ball.vx,ball.vy),1.7);
    ball.vx=nx*speed+p.vx*.25;
    ball.vy=ny*speed+p.vy*.25;
  }
}

/* =========================================================
   BALL / GOALS
========================================================= */
function updateBall(dt){
  if(goalInProgress)return;
  ball.x+=ball.vx*dt*60;
  ball.y+=ball.vy*dt*60;
  ball.vx*=Math.pow(.985,dt*60);
  ball.vy*=Math.pow(.985,dt*60);

  const goalTop=BASE_H/2-goal.height/2;
  const goalBottom=BASE_H/2+goal.height/2;
  const insideGoal=ball.y>goalTop&&ball.y<goalBottom;

  if(ball.y-ball.radius<field.top){
    ball.y=field.top+ball.radius;
    ball.vy*=-.8;
    playWallSound();
  }
  if(ball.y+ball.radius>field.bottom){
    ball.y=field.bottom-ball.radius;
    ball.vy*=-.8;
    playWallSound();
  }

  if(ball.x-ball.radius<field.left){
    if(insideGoal){goalScored("red");return;}
    ball.x=field.left+ball.radius;
    ball.vx*=-.8;
    playWallSound();
  }
  if(ball.x+ball.radius>field.right){
    if(insideGoal){goalScored("blue");return;}
    ball.x=field.right-ball.radius;
    ball.vx*=-.8;
    playWallSound();
  }
}

function goalScored(team){
  if(goalInProgress||matchFinished)return;
  goalInProgress=true;
  ball.vx=0;ball.vy=0;
  if(team==="blue"){
    blueScore++;
    ball.x=field.right+8;
  }else{
    redScore++;
    ball.x=field.left-8;
  }
  ball.y=BASE_H/2;
  scoreElement.textContent=`${blueScore} - ${redScore}`;
  goalText.classList.remove("show");
  void goalText.offsetWidth;
  goalText.classList.add("show");
  shake=15;
  playGoalSound();
  for(let i=0;i<45;i++)createGoalParticle(BASE_W/2,BASE_H/2);
  if(gameMode==="online")sendNetworkState();
  clearTimeout(goalRestartTimer);
  goalRestartTimer=setTimeout(()=>{
    if(!matchFinished){goalInProgress=false;resetPositions();}
  },900);
}

function finishMatch(){
  if(matchFinished)return;
  matchFinished=true;
  gameStarted=false;
  goalInProgress=false;
  clearTimeout(goalRestartTimer);

  let result,reward;
  if(blueScore>redScore){
    result="win";reward=50;
    resultTitle.textContent="YOU WIN";
    resultTitle.className="result-title result-win";
  }else if(blueScore<redScore){
    result="lose";reward=10;
    resultTitle.textContent="YOU LOSE";
    resultTitle.className="result-title result-lose";
  }else{
    result="draw";reward=10;
    resultTitle.textContent="DRAW";
    resultTitle.className="result-title result-draw";
  }

  playerStats.matches++;
  playerStats.goals+=blueScore;
  if(result==="win")playerStats.wins++;
  else if(result==="lose")playerStats.losses++;
  else playerStats.draws++;
  saveProfile();
  updateProfileUI();
  addCoins(reward);
  resultScore.textContent=`${blueScore} - ${redScore}`;
  resultCoins.textContent=`+${reward}`;
  resultOverlay.classList.remove("hidden");
  playResultSound(result);
}

  scoreElement.textContent="0 - 0";timerElement.textContent="02:00";
  particles=[];shake=0;goalInProgress=false;
  configureField();setupPlayers();resetPositions();resizeCanvas();
  lastTime=performance.now();
  if(gameMode==="online"&&onlineHost)sendNetworkState();
};

};

/* =========================================================
   PARTICLES
========================================================= */
function createKickParticles(x,y){
  for(let i=0;i<7;i++)particles.push({x,y,vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3,life:.35,size:Math.random()*4+2});
}
function createGoalParticle(x,y){
  particles.push({x,y,vx:(Math.random()-.5)*10,vy:(Math.random()-.5)*10,life:1,size:Math.random()*7+3});
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.vx*=.97;p.vy*=.97;p.life-=dt;
    if(p.life<=0)particles.splice(i,1);
  }
}

/* =========================================================
   FIELD DRAW
========================================================= */
function drawField(){
  ctx.clearRect(0,0,BASE_W,BASE_H);
  ctx.fillStyle="#176d3b";
  ctx.fillRect(0,0,BASE_W,BASE_H);

  const stripe=matchSize===1?80:90;
  for(let x=field.left;x<field.right;x+=stripe){
    ctx.fillStyle=Math.floor((x-field.left)/stripe)%2===0?"#ffffff06":"#00000006";
    ctx.fillRect(x,field.top,stripe,field.bottom-field.top);
  }

  ctx.strokeStyle="#ffffffdd";ctx.lineWidth=4;
  ctx.strokeRect(field.left,field.top,field.right-field.left,field.bottom-field.top);

  ctx.beginPath();
  ctx.moveTo(BASE_W/2,field.top);ctx.lineTo(BASE_W/2,field.bottom);ctx.stroke();
  ctx.beginPath();ctx.arc(BASE_W/2,BASE_H/2,matchSize===1?75:90,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(BASE_W/2,BASE_H/2,4,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();

  drawPenaltyArea("left");drawPenaltyArea("right");

  const goalTop=BASE_H/2-goal.height/2;
  ctx.fillStyle="#ffffff14";
  ctx.fillRect(field.left-18,goalTop,18,goal.height);
  ctx.fillRect(field.right,goalTop,18,goal.height);
  ctx.strokeStyle="#ffffffbb";ctx.lineWidth=3;
  ctx.strokeRect(field.left-18,goalTop,18,goal.height);
  ctx.strokeRect(field.right,goalTop,18,goal.height);
}
function drawPenaltyArea(side){
  const width=matchSize===1?120:150;
  const height=matchSize===1?240:280;
  const x=side==="left"?field.left:field.right-width;
  ctx.strokeStyle="#ffffffaa";ctx.lineWidth=3;
  ctx.strokeRect(x,BASE_H/2-height/2,width,height);
}

/* =========================================================
   SKIN VISUALS
========================================================= */
function getEquippedSkin(){
  if(equippedSkin==="default")return null;
  return skins.find(s=>s.id===equippedSkin)||null;
}

function drawSkinPattern(s,p){
  const x=p.x,y=p.y,r=p.radius,t=Date.now()/1000;
  ctx.save();
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();

  if(s.type==="stripes"||s.type==="lines"){
    ctx.strokeStyle="#fff8";ctx.lineWidth=7;
    for(let i=-70;i<80;i+=18){ctx.beginPath();ctx.moveTo(x+i,y-r);ctx.lineTo(x+i+45,y+r);ctx.stroke();}
  }
  if(s.type==="dots"||s.type==="firefly"){
    ctx.fillStyle="#fff9";
    for(let i=0;i<9;i++){const a=i*Math.PI*2/9+t*.2,rr=10+(i%3)*7;ctx.beginPath();ctx.arc(x+Math.cos(a)*rr,y+Math.sin(a)*rr,2.5,0,Math.PI*2);ctx.fill();}
  }
  if(s.type==="grid"||s.type==="circuit"||s.type==="matrix"){
    ctx.strokeStyle="#ffffff55";ctx.lineWidth=2;
    for(let i=-30;i<=30;i+=12){ctx.beginPath();ctx.moveTo(x+i,y-r);ctx.lineTo(x+i,y+r);ctx.stroke();ctx.beginPath();ctx.moveTo(x-r,y+i);ctx.lineTo(x+r,y+i);ctx.stroke();}
  }
  if(["pulse","plasma","energy","void","blackhole"].includes(s.type)){
    ctx.beginPath();ctx.arc(x,y,r+6+Math.sin(t*5)*4,0,Math.PI*2);ctx.strokeStyle=s.c;ctx.lineWidth=3;ctx.globalAlpha=.65;ctx.stroke();ctx.globalAlpha=1;
  }
  if(s.type==="electric"||s.type==="thunder"){
    ctx.strokeStyle="#fff";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x-18,y-5);ctx.lineTo(x-4,y-15);ctx.lineTo(x-8,y);ctx.lineTo(x+12,y-8);ctx.lineTo(x+3,y+15);ctx.stroke();
  }
  if(["star","celestial","galaxy","cosmic"].includes(s.type)){
    ctx.fillStyle="#fff";
    for(let i=0;i<8;i++){const a=i*Math.PI/4+t*.25,rr=16+(i%2)*5;ctx.beginPath();ctx.arc(x+Math.cos(a)*rr,y+Math.sin(a)*rr,2,0,Math.PI*2);ctx.fill();}
  }
  if(s.type==="checker"){
    ctx.fillStyle="#111";
    for(let i=-40;i<40;i+=14)for(let j=-40;j<40;j+=14){if(Math.floor((i+40)/14+(j+40)/14)%2===0)ctx.fillRect(x+i,y+j,14,14);}
  }
  if(s.type==="rainbow"){
    ctx.beginPath();ctx.arc(x,y,r-3,0,Math.PI*2);ctx.strokeStyle=`hsl(${(t*100)%360},100%,65%)`;ctx.lineWidth=6;ctx.stroke();
    ctx.beginPath();ctx.arc(x,y,r*.55,0,Math.PI*2);ctx.strokeStyle=`hsl(${(t*100+160)%360},100%,75%)`;ctx.lineWidth=2;ctx.globalAlpha=.8;ctx.stroke();ctx.globalAlpha=1;
  }
  if(s.type==="ultimate"){
    const grad=ctx.createRadialGradient(x-r*.25,y-r*.25,2,x,y,r);
    grad.addColorStop(0,"#ffffff");grad.addColorStop(.16,"#ffe66d");grad.addColorStop(.38,"#ff4dca");grad.addColorStop(.68,"#5c2cff");grad.addColorStop(1,"#090014");
    ctx.fillStyle=grad;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
    for(let i=0;i<8;i++){const a=t*.8+i*Math.PI/4,inner=r*.72,outer=r*1.15;ctx.beginPath();ctx.moveTo(x+Math.cos(a)*inner,y+Math.sin(a)*inner);ctx.lineTo(x+Math.cos(a+.10)*outer,y+Math.sin(a+.10)*outer);ctx.lineTo(x+Math.cos(a-.10)*outer,y+Math.sin(a-.10)*outer);ctx.closePath();ctx.fillStyle=`hsl(${(i*45+t*80)%360},100%,65%)`;ctx.globalAlpha=.9;ctx.fill();}
    ctx.globalAlpha=1;ctx.beginPath();ctx.arc(x,y,r*.38,0,Math.PI*2);ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.globalAlpha=.9;ctx.stroke();ctx.globalAlpha=1;
  }
  if(["gold","diamond","royal"].includes(s.type)){
    ctx.strokeStyle="#fff9";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-r*.7,y);ctx.lineTo(x,y-r*.7);ctx.lineTo(x+r*.7,y);ctx.lineTo(x,y+r*.7);ctx.closePath();ctx.stroke();
  }
  if(["lava","inferno","phoenix"].includes(s.type)){
    ctx.strokeStyle="#ffd84d";ctx.lineWidth=4;ctx.beginPath();
    for(let i=0;i<8;i++){const a=i*Math.PI/4+t*.7,rr=r*.7+Math.sin(t*6+i)*4;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.stroke();
  }
  if(s.type==="glitch"){
    ctx.fillStyle="#00fff088";ctx.fillRect(x-r,y-6,r*1.3,5);ctx.fillStyle="#ff2bd688";ctx.fillRect(x-r*.2,y+8,r*1.3,5);
  }
  if(s.type==="dragon"||s.type==="venom"){
    ctx.strokeStyle="#ffffff44";ctx.lineWidth=2;
    for(let i=-2;i<3;i++){ctx.beginPath();ctx.arc(x+i*9,y,9,0,Math.PI);ctx.stroke();}
  }
  if(s.type==="reaper"){
    ctx.strokeStyle="#000";ctx.lineWidth=5;ctx.beginPath();ctx.arc(x,y,r*.65,0,Math.PI*1.5);ctx.stroke();
  }
  ctx.restore();
}

/* =========================================================
   PLAYER / BALL DRAW
========================================================= */
function drawPlayer(p){
  const skin=(p===blue&&p.index===0)?getEquippedSkin():null;

  ctx.beginPath();ctx.ellipse(p.x,p.y+p.radius+5,p.radius*.8,p.radius*.25,0,0,Math.PI*2);ctx.fillStyle="#00000040";ctx.fill();
  ctx.beginPath();ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);

  if(skin){
    ctx.fillStyle=skin.c;
    ctx.shadowBlur=skin.rarity==="Legendary"?22:skin.rarity==="Mythic"?16:10;
    ctx.shadowColor=skin.c;
  }else{ctx.fillStyle=p.color;ctx.shadowBlur=0;}
  ctx.fill();ctx.shadowBlur=0;
  ctx.lineWidth=p.human?3:2;ctx.strokeStyle="#ffffffe8";ctx.stroke();
  if(skin)drawSkinPattern(skin,p);

  let dx=p.vx,dy=p.vy,len=Math.hypot(dx,dy);
  if(len<.1){dx=p.team==="blue"?1:-1;dy=0;}else{dx/=len;dy/=len;}
  ctx.beginPath();ctx.arc(p.x+dx*9,p.y+dy*9,5,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();

  // Small number marks local players in team games.
  if(matchSize>1){
    ctx.fillStyle="#ffffffdd";ctx.font="bold 10px Arial";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(String(p.index+1),p.x,p.y);
  }
  if(p.human){
    ctx.beginPath();ctx.arc(p.x,p.y,p.radius+7,0,Math.PI*2);ctx.strokeStyle=p.team==="blue"?"#7ec5ff55":"#ff929755";ctx.lineWidth=2;ctx.stroke();
  }
  if(skin&&(skin.rarity==="Legendary"||skin.rarity==="Mythic")){
    ctx.beginPath();ctx.arc(p.x,p.y,p.radius+10+Math.sin(Date.now()/180)*2,Date.now()/500,Date.now()/500+Math.PI*1.4);ctx.strokeStyle=skin.c;ctx.lineWidth=2;ctx.globalAlpha=.8;ctx.stroke();ctx.globalAlpha=1;
  }
}

function drawBall(){
  ctx.beginPath();ctx.ellipse(ball.x,ball.y+ball.radius+5,ball.radius*.8,ball.radius*.25,0,0,Math.PI*2);ctx.fillStyle="#00000040";ctx.fill();
  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.radius,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();ctx.strokeStyle="#20252e";ctx.lineWidth=2;ctx.stroke();
  // Football-like black pentagon patches.
  for(let i=0;i<5;i++){
    const a=i*Math.PI*2/5+Date.now()/2200;
    ctx.beginPath();ctx.arc(ball.x+Math.cos(a)*5,ball.y+Math.sin(a)*5,2.2,0,Math.PI*2);ctx.fillStyle="#20252e";ctx.fill();
  }
}

function drawParticles(){
  for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();}
  ctx.globalAlpha=1;
}

/* =========================================================
   ONLINE MULTIPLAYER
========================================================= */
let peer=null;
let connection=null;
let onlineHost=false;
let onlineConnected=false;
let onlineConfigured=false;
let remoteInput={up:false,down:false,left:false,right:false,kick:false};
let onlineLocalPlayer=null;
let onlineRemotePlayer=null;
let networkTimer=0;

function getLocalInput(){
  return playerInput(onlineLocalPlayer||blue);
}

function serializePlayers(){
  return players.map(p=>({
    team:p.team,index:p.index,human:p.human,x:p.x,y:p.y,vx:p.vx,vy:p.vy
  }));
}

function sendNetworkState(){
  if(!onlineConnected||!connection||!onlineHost)return;
  connection.send({
    type:"state",
    players:serializePlayers(),
    ball:{x:ball.x,y:ball.y,vx:ball.vx,vy:ball.vy},
    blueScore,redScore,matchTime
  });
}

function sendInput(){
  if(!onlineConnected||!connection||onlineHost)return;
  connection.send({type:"input",input:getLocalInput()});
}

function applyOnlineState(data){
  if(Array.isArray(data.players)){
    for(const sp of data.players){
      const p=players.find(x=>x.team===sp.team&&x.index===sp.index);
      if(p){p.x=sp.x;p.y=sp.y;p.vx=sp.vx;p.vy=sp.vy;}
    }
  }else{
    // Backwards compatibility with the old 1v1 state format.
    if(blue&&data.blue){blue.x=data.blue.x;blue.y=data.blue.y;blue.vx=data.blue.vx;blue.vy=data.blue.vy;}
    if(red&&data.red){red.x=data.red.x;red.y=data.red.y;red.vx=data.red.vx;red.vy=data.red.vy;}
  }
  if(data.ball){ball.x=data.ball.x;ball.y=data.ball.y;ball.vx=data.ball.vx;ball.vy=data.ball.vy;}
  blueScore=data.blueScore??blueScore;
  redScore=data.redScore??redScore;
  matchTime=data.matchTime??matchTime;
  scoreElement.textContent=`${blueScore} - ${redScore}`;
  const sec=Math.ceil(matchTime);
  timerElement.textContent=`${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`;
}

function configureOnlinePlayers(){
  players=[];
  const n=matchSize;
  if(n===1){
    players.push(makePlayer("blue",true,0,0));
    players.push(makePlayer("red",true,0,1));
  }else if(teamMode==="together"){
    players.push(makePlayer("blue",true,0,0));
    players.push(makePlayer("blue",true,1,1));
    for(let i=2;i<n;i++)players.push(makePlayer("blue",false,i));
    for(let i=0;i<n;i++)players.push(makePlayer("red",false,i));
  }else{
    players.push(makePlayer("blue",true,0,0));
    players.push(makePlayer("red",true,0,1));
    for(let i=1;i<n;i++)players.push(makePlayer("blue",false,i));
    for(let i=1;i<n;i++)players.push(makePlayer("red",false,i));
  }
  onlineLocalPlayer=players.find(p=>p.team===(onlineHost?"blue":"red")&&p.human) || players.find(p=>p.human);
  onlineRemotePlayer=players.find(p=>p.human&&p!==onlineLocalPlayer) || null;
  blue=players.find(p=>p.team==="blue"&&p.human)||players.find(p=>p.team==="blue");
  red=players.find(p=>p.team==="red"&&p.human)||players.find(p=>p.team==="red");
}

function sendOnlineConfig(){
  if(!connection||!onlineConnected||!onlineHost)return;
  connection.send({
    type:"config",
    matchSize,
    teamMode
  });
}

function startOnlineHostGame(){
  gameMode="online";
  onlineConfigured=true;
  configureField();
  configureOnlinePlayers();
  gameStarted=true;matchFinished=false;gamePaused=false;pauseOverlay.classList.add("hidden");
  blueScore=0;redScore=0;matchTime=120;
  resetPositions();particles=[];shake=0;
  resultOverlay.classList.add("hidden");
  gameModeLabel.textContent=`ONLINE • ${matchSize}V${matchSize} • ${teamMode==="together"?"TEAMMATES":"VERSUS"}`;
  showOnly(gameWrap);resizeCanvas();lastTime=performance.now();
  sendOnlineConfig();
  sendNetworkState();
}

function startOnlineGuestGame(){
  gameMode="online";
  onlineConfigured=true;
  configureField();
  configureOnlinePlayers();
  gameStarted=true;matchFinished=false;gamePaused=false;pauseOverlay.classList.add("hidden");
  blueScore=0;redScore=0;matchTime=120;
  resetPositions();particles=[];shake=0;
  resultOverlay.classList.add("hidden");
  gameModeLabel.textContent=`ONLINE • ${matchSize}V${matchSize} • ${teamMode==="together"?"TEAMMATES":"VERSUS"}`;
  showOnly(gameWrap);resizeCanvas();lastTime=performance.now();
}

function setupConnection(conn){
  connection=conn;
  connection.on("open",()=>{
    onlineConnected=true;
    if(onlineHost){
      document.getElementById("onlineStatus").textContent="PLAYER CONNECTED! Choose the match size.";
      document.getElementById("matchSizeNote").textContent="You are the host. Choose 1v1, 2v2 or 3v3. The remaining positions will be filled by bots.";
      showOnly(matchSizeMenu);
    }else{
      document.getElementById("onlineStatus").textContent="Connected! Waiting for the host to choose the match.";
    }
  });

  connection.on("data",data=>{
    if(data.type==="input")remoteInput=data.input||remoteInput;

    if(data.type==="config"){
      matchSize=Number(data.matchSize)||1;
      teamMode=data.teamMode||"against";
      startOnlineGuestGame();
    }

    if(data.type==="state"&&!onlineHost){
      if(!onlineConfigured)return;
      applyOnlineState(data);
    }
  });

  connection.on("close",()=>{
    onlineConnected=false;
    if(gameStarted){
      alert("The other player disconnected.");
      gameStarted=false;
      onlineConfigured=false;
      showOnly(mainMenu);
    }else{
      document.getElementById("onlineStatus").textContent="The other player disconnected.";
    }
  });
  connection.on("error",()=>{
    onlineConnected=false;
    document.getElementById("onlineStatus").textContent="Connection error. Try again.";
  });
}

function randomCode(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code="";
  for(let i=0;i<6;i++)code+=chars[Math.floor(Math.random()*chars.length)];
  return code;
}

function createRoom(){
  if(typeof Peer==="undefined"){
    document.getElementById("onlineStatus").textContent="Online service could not load.";
    return;
  }
  if(peer){try{peer.destroy()}catch{}}
  const code=randomCode();
  peer=new Peer("kickzy-"+code.toLowerCase());
  onlineHost=true;onlineConnected=false;onlineConfigured=false;
  document.getElementById("roomCodeValue").textContent=code;
  document.getElementById("roomCodeBox").classList.remove("hidden");
  document.getElementById("onlineStatus").textContent="Creating room...";
  peer.on("open",()=>document.getElementById("onlineStatus").textContent="Room created! Send the code to your friend.");
  peer.on("connection",conn=>{
    if(onlineConnected){conn.close();return;}
    setupConnection(conn);
  });
  peer.on("error",err=>{
    console.log(err);
    document.getElementById("onlineStatus").textContent="Could not create room. Try again.";
  });
}

function joinRoom(){
  if(typeof Peer==="undefined"){
    document.getElementById("onlineStatus").textContent="Online service could not load.";
    return;
  }
  const code=document.getElementById("roomInput").value.trim().toUpperCase();
  if(code.length!==6){document.getElementById("onlineStatus").textContent="Enter a 6-character room code.";return;}
  if(peer){try{peer.destroy()}catch{}}
  peer=new Peer();onlineHost=false;onlineConnected=false;onlineConfigured=false;
  document.getElementById("onlineStatus").textContent="Connecting to room...";
  peer.on("open",()=>setupConnection(peer.connect("kickzy-"+code.toLowerCase(),{reliable:true})));
  peer.on("error",err=>{console.log(err);document.getElementById("onlineStatus").textContent="Room not found or unavailable.";});
}

function disconnectOnline(){
  if(connection){try{connection.close()}catch{}}
  connection=null;onlineConnected=false;onlineConfigured=false;
  if(peer){try{peer.destroy()}catch{}}
  peer=null;onlineHost=false;onlineLocalPlayer=null;onlineRemotePlayer=null;
}

 document.getElementById("onlineBack").onclick=()=>{disconnectOnline();showOnly(modeMenu)};
 document.getElementById("createRoomButton").onclick=()=>createRoom();
 document.getElementById("joinRoomButton").onclick=()=>joinRoom();

 function startGame(){
   /* Extra safety: no LOCAL match can be started on a touch mobile device,
      even if a hidden button is triggered or a stale menu is still open. */
   if(gameMode==="local"&&isTouchMobile){
     gameStarted=false;
     showOnly(modeMenu);
     return;
   }
   disconnectOnline();
   configureField();
   setupPlayers();
   gameStarted=true;matchFinished=false;gamePaused=false;pauseOverlay.classList.add("hidden");resultOverlay.classList.add("hidden");
   blueScore=0;redScore=0;matchTime=120;scoreElement.textContent="0 - 0";timerElement.textContent="02:00";
   resetPositions();particles=[];shake=0;
   if(matchSize===1){
     gameModeLabel.textContent=gameMode==="bot"?"VS BOT • "+botDifficulty.toUpperCase():"LOCAL • 2 PLAYER";
     if(isTouchMobile&&gameMode==="local")gameModeLabel.textContent="VS BOT • NORMAL";
   }else{
     const label=teamMode==="solo"?"SOLO":("2 PLAYERS "+(teamMode==="together"?"TOGETHER":"VS")+` • ${matchSize}V${matchSize}`);
     gameModeLabel.textContent=label;
   }
   showOnly(gameWrap);resizeCanvas();lastTime=performance.now();
 }

/* =========================================================
   UPDATE / DRAW / LOOP
========================================================= */
function update(dt){
  if(!gameStarted)return;
  if(gamePaused){updateParticles(dt);return;}
  if(matchFinished){updateParticles(dt);return;}

  if(gameMode==="online"&&!onlineHost){sendInput();updateParticles(dt);return;}

  if(matchTime<=0){finishMatch();if(onlineHost)sendNetworkState();return;}
  if(goalInProgress){
    updateParticles(dt);shake*=Math.pow(.82,dt*60);if(shake<.1)shake=0;
    if(onlineHost)sendNetworkState();
    return;
  }

  matchTime-=dt;if(matchTime<0)matchTime=0;
  const sec=Math.ceil(matchTime);
  timerElement.textContent=`${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`;

  if(gameMode==="online"){
    for(const p of players){
      if(!p.human){
        moveBot(p,dt);
      }else if(p===onlineRemotePlayer){
        movePlayer(p,remoteInput,dt);
      }else if(p===onlineLocalPlayer){
        movePlayer(p,playerInput(p),dt);
      }
    }
  }else{
    for(const p of players){
      if(p.human)movePlayer(p,playerInput(p),dt);
      else moveBot(p,dt);
    }
  }

  for(let i=0;i<players.length;i++)for(let j=i+1;j<players.length;j++)handlePlayerCollision(players[i],players[j]);
  for(const p of players)handleBallCollision(p);
  updateBall(dt);
  updateParticles(dt);
  shake*=Math.pow(.82,dt*60);if(shake<.1)shake=0;

  networkTimer-=dt;
  if(gameMode==="online"&&onlineHost&&networkTimer<=0){networkTimer=.033;sendNetworkState();}
}

function draw(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  drawField();drawParticles();
  for(const p of players)drawPlayer(p);
  drawBall();
  ctx.restore();
}

function gameLoop(now){
  let dt=(now-lastTime)/1000;
  dt=Math.min(dt,.033);
  lastTime=now;
  update(dt);draw();
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
