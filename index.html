<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KICKZY</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#176b3a;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

#app{
    width:100vw;
    height:100vh;
}

.game-wrap{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#176b3a;
}

canvas{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
}

/* =========================================================
   MENU
========================================================= */

.menu{
    position:fixed;
    inset:0;
    z-index:100;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle at 50% 35%,
            #203b2c 0%,
            #101b16 45%,
            #050806 100%
        );
}

.menu-box{
    width:min(650px,92vw);
    text-align:center;
}

.logo{
    font-size:clamp(64px,13vw,120px);
    font-weight:1000;
    letter-spacing:8px;

    text-shadow:
        0 8px 30px rgba(0,0,0,.5),
        0 0 30px rgba(76,167,255,.25);

    margin-bottom:4px;
}

.menu-subtitle{
    font-size:14px;
    font-weight:800;
    letter-spacing:5px;
    opacity:.6;
    margin-bottom:42px;
}

.menu-buttons{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.menu-btn{
    width:100%;
    border:0;
    border-radius:16px;

    padding:18px 20px;

    font-size:20px;
    font-weight:900;

    color:white;

    background:rgba(255,255,255,.09);

    border:1px solid rgba(255,255,255,.14);

    cursor:pointer;

    transition:
        transform .15s ease,
        background .15s ease,
        box-shadow .15s ease;
}

.menu-btn:hover{
    transform:translateY(-3px);

    background:rgba(255,255,255,.15);

    box-shadow:
        0 12px 30px rgba(0,0,0,.25);
}

.menu-btn:active{
    transform:scale(.97);
}

.play-btn{
    background:
        linear-gradient(
            135deg,
            #2384e8,
            #4ca7ff
        );
}

.play-btn:hover{
    background:
        linear-gradient(
            135deg,
            #2b91f7,
            #60b1ff
        );
}

.back-btn{
    margin-top:8px;
    font-size:15px;
    padding:13px;

    background:transparent;

    border-color:
        rgba(255,255,255,.08);
}

.mode-title{
    font-size:32px;
    font-weight:1000;
    margin-bottom:28px;
}

.coming-soon{
    opacity:.45;
    cursor:default;
}

.coming-soon:hover{
    transform:none;
    background:
        rgba(255,255,255,.09);
    box-shadow:none;
}

.hidden{
    display:none !important;
}

/* =========================================================
   COINS
========================================================= */

.coin-display{
    margin:0 auto 28px;

    width:max-content;

    display:flex;
    align-items:center;
    gap:9px;

    padding:10px 17px;

    border-radius:999px;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.12);

    font-size:18px;
    font-weight:900;

    box-shadow:
        0 8px 25px rgba(0,0,0,.18);
}

.coin-icon{
    font-size:20px;
}

#coinAmount,
#storeCoinAmount{
    color:#ffd84d;
}

/* =========================================================
   STORE
========================================================= */

.store-box{
    width:min(850px,94vw);
    max-height:90vh;
    overflow-y:auto;

    padding:20px;

    scrollbar-width:thin;
}

.store-box::-webkit-scrollbar{
    width:6px;
}

.store-box::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.2);
    border-radius:10px;
}

.store-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:18px;
}

.store-title{
    font-size:40px;
    font-weight:1000;
    letter-spacing:2px;
}

.store-grid{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:14px;

    margin-bottom:18px;
}

.skin-card{
    position:relative;

    min-height:225px;

    padding:20px;

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.10),
            rgba(255,255,255,.035)
        );

    border:1px solid rgba(255,255,255,.12);

    overflow:hidden;

    transition:
        transform .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;
}

.skin-card:hover{
    transform:translateY(-4px);

    border-color:
        rgba(255,255,255,.25);

    box-shadow:
        0 15px 35px rgba(0,0,0,.25);
}

.skin-card.legendary{
    background:
        linear-gradient(
            145deg,
            rgba(255,210,70,.15),
            rgba(255,255,255,.04)
        );
}

.skin-preview{
    width:76px;
    height:76px;

    margin:0 auto 12px;

    border-radius:50%;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:22px;
    font-weight:1000;

    border:4px solid white;

    box-shadow:
        0 10px 30px rgba(0,0,0,.3);
}

.skin-preview::after{
    content:"";

    width:12px;
    height:12px;

    background:white;

    border-radius:50%;

    position:absolute;

    right:13px;
    top:13px;
}

.skin-name{
    font-size:20px;
    font-weight:1000;

    margin-bottom:5px;
}

.skin-rarity{
    font-size:11px;
    font-weight:1000;

    letter-spacing:2px;

    text-transform:uppercase;

    margin-bottom:12px;
}

.skin-price{
    font-size:16px;
    font-weight:900;

    color:#ffd84d;

    margin-bottom:12px;
}

.skin-btn{
    width:100%;

    border:0;
    border-radius:12px;

    padding:11px;

    font-size:14px;
    font-weight:1000;

    color:white;

    cursor:pointer;

    background:rgba(255,255,255,.11);

    transition:
        transform .12s ease,
        background .12s ease;
}

.skin-btn:hover{
    transform:translateY(-2px);

    background:rgba(255,255,255,.18);
}

.skin-btn.buy{
    background:
        linear-gradient(
            135deg,
            #2384e8,
            #4ca7ff
        );
}

.skin-btn.equipped{
    background:
        linear-gradient(
            135deg,
            #29a866,
            #55d98a
        );

    cursor:default;
}

.skin-btn.locked{
    opacity:.45;
    cursor:not-allowed;
}

.skin-btn.locked:hover{
    transform:none;
}

.rarity-rare{
    color:#58aaff;
}

.rarity-super{
    color:#b878ff;
}

.rarity-epic{
    color:#e06cff;
}

.rarity-mythic{
    color:#42e7ff;
}

.rarity-legendary{
    color:#ffd84d;
}

.store-message{
    min-height:22px;

    margin-bottom:12px;

    font-size:14px;
    font-weight:900;

    opacity:.8;
}

.store-message.good{
    color:#55d98a;
}

.store-message.bad{
    color:#ff6464;
}

/* =========================================================
   RESULT
========================================================= */

#resultOverlay{
    position:absolute;
    inset:0;

    z-index:30;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
        rgba(3,8,6,.76);

    backdrop-filter:blur(10px);
}

.result-box{
    width:min(460px,88vw);

    padding:42px 30px;

    text-align:center;

    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            rgba(25,38,31,.98),
            rgba(8,14,11,.98)
        );

    border:
        1px solid
        rgba(255,255,255,.14);

    box-shadow:
        0 30px 80px rgba(0,0,0,.55);

    animation:
        resultAppear
        .45s
        cubic-bezier(.2,.8,.2,1);
}

@keyframes resultAppear{

    0%{
        opacity:0;
        transform:scale(.75) translateY(25px);
    }

    100%{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

.result-title{
    font-size:clamp(48px,12vw,76px);
    font-weight:1000;
    letter-spacing:3px;

    margin-bottom:8px;
}

.result-score{
    font-size:24px;
    font-weight:900;

    opacity:.8;

    margin-bottom:30px;
}

.result-coins{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:9px;

    font-size:25px;
    font-weight:1000;

    color:#ffd84d;

    margin-bottom:30px;
}

.result-coins small{
    font-size:15px;
    letter-spacing:2px;
    opacity:.75;
}

.result-win{
    color:#55d98a;
}

.result-lose{
    color:#ff6464;
}

.result-draw{
    color:#ffd84d;
}

/* =========================================================
   GAME
========================================================= */

.scoreboard{
    position:absolute;

    top:14px;
    left:50%;

    transform:translateX(-50%);

    display:flex;
    align-items:center;

    gap:18px;

    padding:9px 18px;

    border-radius:16px;

    background:
        rgba(5,8,14,.72);

    backdrop-filter:blur(10px);

    border:
        1px solid
        rgba(255,255,255,.12);

    pointer-events:none;

    z-index:5;
}

.team{
    font-weight:900;
    font-size:15px;
}

.blue{
    color:#53a8ff;
}

.red{
    color:#ff6464;
}

.score{
    font-size:25px;
    font-weight:900;
    min-width:52px;
}

.timer{
    position:absolute;

    top:70px;
    left:50%;

    transform:translateX(-50%);

    color:rgba(255,255,255,.8);

    font-size:13px;

    font-weight:700;

    letter-spacing:1px;

    pointer-events:none;

    z-index:5;
}

#goalText{
    position:absolute;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:clamp(48px,10vw,110px);

    font-weight:1000;

    letter-spacing:5px;

    opacity:0;

    transform:scale(.65);

    pointer-events:none;

    z-index:8;

    text-shadow:
        0 8px 35px rgba(0,0,0,.5),
        0 0 35px rgba(255,255,255,.25);
}

#goalText.show{
    animation:
        goalAnimation
        1.2s
        ease-out
        forwards;
}

@keyframes goalAnimation{

    0%{
        opacity:0;
        transform:scale(.65);
    }

    20%{
        opacity:1;
        transform:scale(1.12);
    }

    45%{
        transform:scale(1);
    }

    100%{
        opacity:0;
        transform:scale(1.08);
    }
}

.pause-btn{
    position:absolute;

    right:15px;
    top:15px;

    z-index:10;

    border:0;

    border-radius:10px;

    padding:8px 12px;

    color:white;

    background:
        rgba(5,8,14,.65);

    cursor:pointer;

    font-weight:800;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:650px){

    .store-box{
        padding:12px;
    }

    .store-grid{
        grid-template-columns:1fr;
    }

    .store-title{
        font-size:32px;
    }

    .skin-card{
        min-height:205px;
    }
}

@media(max-width:600px){

    .logo{
        letter-spacing:4px;
    }

    .menu-subtitle{
        letter-spacing:3px;
    }

    .menu-btn{
        padding:16px;
        font-size:18px;
    }

    .result-box{
        padding:35px 20px;
    }
}

</style>
</head>

<body>

<div id="app">

<!-- =========================================================
     MAIN MENU
========================================================= -->

<div class="menu" id="mainMenu">

    <div class="menu-box">

        <div class="logo">
            KICKZY
        </div>

        <div class="menu-subtitle">
            FAST 2D FOOTBALL
        </div>

        <div class="coin-display">
            <span class="coin-icon">🪙</span>
            <span id="coinAmount">0</span>
            <span>COINS</span>
        </div>

        <div class="menu-buttons">

            <button
                class="menu-btn play-btn"
                id="playButton">
                PLAY
            </button>

            <button
                class="menu-btn"
                id="storeButton">
                STORE
            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     MODE MENU
========================================================= -->

<div
    class="menu hidden"
    id="modeMenu">

    <div class="menu-box">

        <div class="mode-title">
            SELECT MODE
        </div>

        <div class="menu-buttons">

            <button
                class="menu-btn play-btn"
                id="botButton">
                PLAY VS BOT
            </button>

            <button
                class="menu-btn"
                id="localButton">
                PLAY LOCAL
            </button>

            <button
                class="menu-btn coming-soon">
                PLAY ONLINE
                <small>COMING SOON</small>
            </button>

            <button
                class="menu-btn back-btn"
                id="modeBack">
                ← BACK
            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     DIFFICULTY
========================================================= -->

<div
    class="menu hidden"
    id="difficultyMenu">

    <div class="menu-box">

        <div class="mode-title">
            BOT DIFFICULTY
        </div>

        <div class="menu-buttons">

            <button
                class="menu-btn"
                data-difficulty="easy">
                EASY
            </button>

            <button
                class="menu-btn play-btn"
                data-difficulty="normal">
                NORMAL
            </button>

            <button
                class="menu-btn"
                data-difficulty="hard">
                HARD
            </button>

            <button
                class="menu-btn back-btn"
                id="difficultyBack">
                ← BACK
            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     STORE
========================================================= -->

<div
    class="menu hidden"
    id="storeMenu">

    <div class="store-box">

        <div class="store-header">

            <div class="store-title">
                STORE
            </div>

            <div class="coin-display">
                <span class="coin-icon">🪙</span>
                <span id="storeCoinAmount">0</span>
            </div>

        </div>

        <div
            class="store-message"
            id="storeMessage">
        </div>

        <div
            class="store-grid"
            id="storeGrid">
        </div>

        <button
            class="menu-btn back-btn"
            id="storeBack">
            ← BACK
        </button>

    </div>

</div>


<!-- =========================================================
     GAME
========================================================= -->

<div
    class="game-wrap hidden"
    id="gameWrap">

    <canvas id="game"></canvas>

    <div class="scoreboard">

        <span class="team blue">
            BLUE
        </span>

        <span
            class="score"
            id="score">
            0 - 0
        </span>

        <span class="team red">
            RED
        </span>

    </div>

    <div
        class="timer"
        id="timer">
        02:00
    </div>

    <button
        class="pause-btn"
        id="menuButton">
        MENU
    </button>

    <div id="goalText">
        GOAL!
    </div>

    <div
        id="resultOverlay"
        class="hidden">

        <div class="result-box">

            <div
                id="resultTitle"
                class="result-title">
                YOU WIN
            </div>

            <div
                id="resultScore"
                class="result-score">
                0 - 0
            </div>

            <div class="result-coins">

                <span>🪙</span>

                <span id="resultCoins">
                    +50
                </span>

                <small>
                    COINS
                </small>

            </div>

            <button
                class="menu-btn play-btn"
                id="resultMenuButton">
                CONTINUE
            </button>

        </div>

    </div>

</div>

</div>


<script>

/* =========================================================
   MENU ELEMENTS
========================================================= */

const mainMenu =
    document.getElementById("mainMenu");

const modeMenu =
    document.getElementById("modeMenu");

const difficultyMenu =
    document.getElementById("difficultyMenu");

const storeMenu =
    document.getElementById("storeMenu");

const gameWrap =
    document.getElementById("gameWrap");

const resultOverlay =
    document.getElementById("resultOverlay");

const resultTitle =
    document.getElementById("resultTitle");

const resultScore =
    document.getElementById("resultScore");

const resultCoins =
    document.getElementById("resultCoins");

const coinAmount =
    document.getElementById("coinAmount");

const storeCoinAmount =
    document.getElementById("storeCoinAmount");

const storeGrid =
    document.getElementById("storeGrid");

const storeMessage =
    document.getElementById("storeMessage");


let gameMode = "local";

let botDifficulty = "normal";

let gameStarted = false;

let matchFinished = false;


/* =========================================================
   COINS
========================================================= */

let coins =
    Number(
        localStorage.getItem(
            "kickzyCoins"
        )
    ) || 0;


function saveCoins(){

    localStorage.setItem(
        "kickzyCoins",
        coins
    );

    updateCoinDisplays();
}


function updateCoinDisplays(){

    coinAmount.textContent =
        coins;

    storeCoinAmount.textContent =
        coins;
}


function addCoins(amount){

    coins += amount;

    saveCoins();
}


updateCoinDisplays();


/* =========================================================
   SKINS
========================================================= */

const skins = [

    {
        id:"default",
        name:"Classic",
        rarity:"Default",
        price:0,
        color:"#4ca7ff",
        glow:"#4ca7ff"
    },

    {
        id:"neon",
        name:"Neon Blue",
        rarity:"Rare",
        price:100,
        color:"#16d9ff",
        glow:"#16d9ff"
    },

    {
        id:"lava",
        name:"Lava",
        rarity:"Super Rare",
        price:250,
        color:"#ff5b2e",
        glow:"#ff7a3d"
    },

    {
        id:"galaxy",
        name:"Galaxy",
        rarity:"Epic",
        price:500,
        color:"#8d54ff",
        glow:"#d76cff"
    },

    {
        id:"cyber",
        name:"Cyber",
        rarity:"Mythic",
        price:900,
        color:"#12e7d0",
        glow:"#22ffff"
    },

    {
        id:"gold",
        name:"Golden",
        rarity:"Legendary",
        price:1500,
        color:"#ffd84d",
        glow:"#fff1a1"
    }

];


let ownedSkins =
    JSON.parse(
        localStorage.getItem(
            "kickzyOwnedSkins"
        ) || '["default"]'
    );


let equippedSkin =
    localStorage.getItem(
        "kickzyEquippedSkin"
    ) || "default";


if(
    !ownedSkins.includes("default")
){

    ownedSkins.push("default");

}


function saveSkins(){

    localStorage.setItem(
        "kickzyOwnedSkins",
        JSON.stringify(
            ownedSkins
        )
    );

    localStorage.setItem(
        "kickzyEquippedSkin",
        equippedSkin
    );

}


function getSkin(id){

    return skins.find(
        skin =>
            skin.id === id
    ) || skins[0];

}


function setStoreMessage(
    message,
    type=""
){

    storeMessage.textContent =
        message;

    storeMessage.className =
        "store-message " +
        type;

}


function rarityClass(
    rarity
){

    if(rarity === "Rare")
        return "rarity-rare";

    if(rarity === "Super Rare")
        return "rarity-super";

    if(rarity === "Epic")
        return "rarity-epic";

    if(rarity === "Mythic")
        return "rarity-mythic";

    if(rarity === "Legendary")
        return "rarity-legendary";

    return "";
}


function buySkin(id){

    const skin =
        getSkin(id);


    if(
        ownedSkins.includes(id)
    ){

        equipSkin(id);

        return;
    }


    if(
        coins <
        skin.price
    ){

        setStoreMessage(
            `You need ${skin.price - coins} more coins.`,
            "bad"
        );

        return;
    }


    coins -=
        skin.price;


    ownedSkins.push(id);

    equippedSkin =
        id;


    saveCoins();

    saveSkins();

    renderStore();


    setStoreMessage(
        `${skin.name} purchased and equipped!`,
        "good"
    );
}


function equipSkin(id){

    if(
        !ownedSkins.includes(id)
    ){
        return;
    }


    equippedSkin =
        id;


    saveSkins();

    renderStore();


    const skin =
        getSkin(id);


    setStoreMessage(
        `${skin.name} equipped!`,
        "good"
    );
}


function renderStore(){

    storeGrid.innerHTML = "";


    skins.forEach(
        skin => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "skin-card";


            if(
                skin.rarity ===
                "Legendary"
            ){

                card.classList.add(
                    "legendary"
                );

            }


            const owned =
                ownedSkins.includes(
                    skin.id
                );


            const equipped =
                equippedSkin ===
                skin.id;


            let buttonText =
                "BUY";


            let buttonClass =
                "skin-btn buy";


            if(
                equipped
            ){

                buttonText =
                    "EQUIPPED";

                buttonClass =
                    "skin-btn equipped";

            }
            else if(
                owned
            ){

                buttonText =
                    "EQUIP";

                buttonClass =
                    "skin-btn";

            }
            else if(
                coins <
                skin.price
            ){

                buttonText =
                    "NOT ENOUGH COINS";

                buttonClass =
                    "skin-btn locked";

            }


            const preview =
                document.createElement(
                    "div"
                );


            preview.className =
                "skin-preview";


            preview.style.background =
                skin.color;


            preview.style.boxShadow =
                `0 0 25px ${skin.glow}`;


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "skin-name";


            name.textContent =
                skin.name;


            const rarity =
                document.createElement(
                    "div"
                );


            rarity.className =
                "skin-rarity " +
                rarityClass(
                    skin.rarity
                );


            rarity.textContent =
                skin.rarity;


            const price =
                document.createElement(
                    "div"
                );

function resizeCanvas(){

    const rect =
        canvas.getBoundingClientRect();


    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvas.width =
        rect.width * dpr;

    canvas.height =
        rect.height * dpr;


    W = rect.width;

    H = rect.height;


    gameScale =
        Math.min(
            W / BASE_W,
            H / BASE_H
        );


    const gameWidth =
        BASE_W *
        gameScale;


    const gameHeight =
        BASE_H *
        gameScale;


    offsetX =
        (W -
        gameWidth) /
        2;


    offsetY =
        (H -
        gameHeight) /
        2;


    ctx.setTransform(
        dpr *
        gameScale,
        0,
        0,
        dpr *
        gameScale,
        dpr *
        offsetX,
        dpr *
        offsetY
    );

}


window.addEventListener(
    "resize",
    resizeCanvas
);

/* =========================================================
   HELPERS
========================================================= */

function clamp(
    value,
    min,
    max
){

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );

}


function distance(
    x1,
    y1,
    x2,
    y2
){

    return Math.hypot(
        x2 - x1,
        y2 - y1
    );

}


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function movePlayer(
    player,
    controls,
    dt
){

    let dx = 0;

    let dy = 0;


    if(
        keys[
            controls.up
        ]
    ){

        dy -= 1;

    }


    if(
        keys[
            controls.down
        ]
    ){

        dy += 1;

    }


    if(
        keys[
            controls.left
        ]
    ){

        dx -= 1;

    }


    if(
        keys[
            controls.right
        ]
    ){

        dx += 1;

    }


    if(
        dx !== 0 ||
        dy !== 0
    ){

        const length =
            Math.hypot(
                dx,
                dy
            );


        dx /= length;

        dy /= length;


        player.vx +=
            dx *
            player.speed *
            dt *
            60;


        player.vy +=
            dy *
            player.speed *
            dt *
            60;

    }


    const currentSpeed =
        Math.hypot(
            player.vx,
            player.vy
        );


    if(
        currentSpeed >
        player.maxSpeed
    ){

        player.vx =
            player.vx /
            currentSpeed *
            player.maxSpeed;


        player.vy =
            player.vy /
            currentSpeed *
            player.maxSpeed;

    }


    player.vx *=
        Math.pow(
            .82,
            dt * 60
        );


    player.vy *=
        Math.pow(
            .82,
            dt * 60
        );


    player.x +=
        player.vx *
        dt *
        60;


    player.y +=
        player.vy *
        dt *
        60;


    player.x =
        clamp(
            player.x,
            field.left +
                player.radius,
            field.right -
                player.radius
        );


    player.y =
        clamp(
            player.y,
            field.top +
                player.radius,
            field.bottom -
                player.radius
        );


    player.kickCooldown -=
        dt;


    if(
        keys[
            controls.kick
        ] &&
        player.kickCooldown <= 0
    ){

        kick(player);

        player.kickCooldown =
            .38;

    }

}


/* =========================================================
   BOT
========================================================= */

function moveBot(dt){

    if(
        gameMode !== "bot" ||
        goalInProgress
    ){

        return;

    }


    let reactionTime = .12;

    let speedMultiplier = .82;

    let errorAmount = 8;


    if(
        botDifficulty === "easy"
    ){

        reactionTime = .20;

        speedMultiplier = .70;

        errorAmount = 25;

    }


    if(
        botDifficulty === "normal"
    ){

        reactionTime = .11;

        speedMultiplier = .84;

        errorAmount = 10;

    }


    if(
        botDifficulty === "hard"
    ){

        reactionTime = .055;

        speedMultiplier = 1;

        errorAmount = 4;

    }


    botMistakeTimer -=
        dt;


    if(
        botMistakeTimer <= 0
    ){

        botMistakeTimer =
            .7 +
            Math.random() *
            1.8;


        botMistakeX =
            (Math.random() -
            .5) *
            errorAmount;


        botMistakeY =
            (Math.random() -
            .5) *
            errorAmount;

    }


    botThinkTimer -=
        dt;


    if(
        botThinkTimer <= 0
    ){

        botThinkTimer =
            reactionTime;


        const ballDistance =
            distance(
                red.x,
                red.y,
                ball.x,
                ball.y
            );


        const ballMovingToBotGoal =
            ball.vx > 1.5 &&
            ball.x >
            red.x - 180;


        const blueHasBall =
            distance(
                blue.x,
                blue.y,
                ball.x,
                ball.y
            ) < 75;


        let targetX;

        let targetY;


        if(
            ballDistance > 70
        ){

            targetX =
                ball.x;

            targetY =
                ball.y;

        }
        else{

            if(
                blueHasBall
            ){

                targetX =
                    ball.x;

                targetY =
                    ball.y;

            }
            else{

                targetX =
                    ball.x +
                    28;

                targetY =
                    ball.y;

            }

        }


        if(
            ballMovingToBotGoal
        ){

            targetX =
                ball.x;

            targetY =
                ball.y;

        }


        targetX +=
            botMistakeX;

        targetY +=
            botMistakeY;


        botTargetX =
            clamp(
                targetX,
                field.left +
                    red.radius,
                field.right -
                    red.radius
            );


        botTargetY =
            clamp(
                targetY,
                field.top +
                    red.radius,
                field.bottom -
                    red.radius
            );

    }


    let dx =
        botTargetX -
        red.x;


    let dy =
        botTargetY -
        red.y;


    const targetDistance =
        Math.hypot(
            dx,
            dy
        );


    if(
        targetDistance > 4
    ){

        dx /=
            targetDistance;

        dy /=
            targetDistance;


        red.vx +=
            dx *
            red.speed *
            speedMultiplier *
            dt *
            60;


        red.vy +=
            dy *
            red.speed *
            speedMultiplier *
            dt *
            60;

    }


    const currentSpeed =
        Math.hypot(
            red.vx,
            red.vy
        );


    const maxBotSpeed =
        red.maxSpeed *
        speedMultiplier;


    if(
        currentSpeed >
        maxBotSpeed
    ){

        red.vx =
            red.vx /
            currentSpeed *
            maxBotSpeed;


        red.vy =
            red.vy /
            currentSpeed *
            maxBotSpeed;

    }


    red.vx *=
        Math.pow(
            .82,
            dt * 60
        );


    red.vy *=
        Math.pow(
            .82,
            dt * 60
        );


    red.x +=
        red.vx *
        dt *
        60;


    red.y +=
        red.vy *
        dt *
        60;


    red.x =
        clamp(
            red.x,
            field.left +
                red.radius,
            field.right -
                red.radius
        );


    red.y =
        clamp(
            red.y,
            field.top +
                red.radius,
            field.bottom -
                red.radius
        );


    red.kickCooldown -=
        dt;

    botKickTimer -=
        dt;


    const ballDistance =
        distance(
            red.x,
            red.y,
            ball.x,
            ball.y
        );


    if(
        ballDistance <
            red.radius +
            ball.radius +
            32 &&
        red.kickCooldown <= 0 &&
        botKickTimer <= 0
    ){

        let shotX;

        let shotY;


        if(
            ball.x >=
            red.x - 15
        ){

            shotX =
                field.left;

            shotY =
                BASE_H / 2;

            shotY +=
                (Math.random() -
                .5) *
                errorAmount *
                3;

        }
        else{

            shotX =
                ball.x +
                (ball.x -
                red.x) *
                2;

            shotY =
                ball.y;

        }


        let shotDX =
            shotX -
            ball.x;


        let shotDY =
            shotY -
            ball.y;


        const shotLength =
            Math.hypot(
                shotDX,
                shotDY
            );


        if(
            shotLength > 0
        ){

            shotDX /=
                shotLength;

            shotDY /=
                shotLength;


            const power =
                10.5;


            ball.vx =
                shotDX *
                power +
                red.vx *
                .45;


            ball.vy =
                shotDY *
                power +
                red.vy *
                .45;


            createKickParticles(
                ball.x -
                shotDX * 7,

                ball.y -
                shotDY * 7
            );


            playKickSound();


            red.kickCooldown =
                .38;

            botKickTimer =
                .30;

        }

    }

}


/* =========================================================
   KICK
========================================================= */

function kick(player){

    const dx =
        ball.x -
        player.x;


    const dy =
        ball.y -
        player.y;


    const dist =
        Math.hypot(
            dx,
            dy
        );


    if(
        dist <
        player.radius +
        ball.radius +
        32
    ){

        let nx;

        let ny;


        if(
            dist < .01
        ){

            nx =
                player === blue
                ? 1
                : -1;

            ny = 0;

        }
        else{

            nx =
                dx / dist;

            ny =
                dy / dist;

        }


        const power =
            10.5;


        ball.vx =
            nx *
            power +
            player.vx *
            .45;


        ball.vy =
            ny *
            power +
            player.vy *
            .45;


        createKickParticles(
            ball.x -
            nx * 7,

            ball.y -
            ny * 7
        );


        playKickSound();

    }

}


/* =========================================================
   PLAYER COLLISION
========================================================= */

function handlePlayerCollision(
    a,
    b
){

    const dx =
        b.x -
        a.x;


    const dy =
        b.y -
        a.y;


    const dist =
        Math.hypot(
            dx,
            dy
        );


    const minDist =
        a.radius +
        b.radius;


    if(
        dist > 0 &&
        dist < minDist
    ){

        const nx =
            dx / dist;

        const ny =
            dy / dist;


        const overlap =
            minDist -
            dist;


        a.x -=
            nx *
            overlap /
            2;


        a.y -=
            ny *
            overlap /
            2;


        b.x +=
            nx *
            overlap /
            2;


        b.y +=
            ny *
            overlap /
            2;


        const push = 1.8;


        a.vx -=
            nx *
            push;


        a.vy -=
            ny *
            push;


        b.vx +=
            nx *
            push;


        b.vy +=
            ny *
            push;

    }

}


/* =========================================================
   BALL COLLISION
========================================================= */

function handleBallCollision(
    player
){

    if(
        goalInProgress
    ){

        return;

    }


    const dx =
        ball.x -
        player.x;


    const dy =
        ball.y -
        player.y;


    const dist =
        Math.hypot(
            dx,
            dy
        );


    const minDist =
        player.radius +
        ball.radius;


    if(
        dist <
        minDist &&
        dist > 0
    ){

        const nx =
            dx / dist;


        const ny =
            dy / dist;


        const overlap =
            minDist -
            dist;


        ball.x +=
            nx *
            overlap;


        ball.y +=
            ny *
            overlap;


        const speed =
            Math.max(
                Math.hypot(
                    ball.vx,
                    ball.vy
                ),
                1.7
            );


        ball.vx =
            nx *
            speed +
            player.vx *
            .25;


        ball.vy =
            ny *
            speed +
            player.vy *
            .25;

    }

}


/* =========================================================
   BALL UPDATE
========================================================= */

function updateBall(dt){

    if(
        goalInProgress
    ){

        return;

    }


    ball.x +=
        ball.vx *
        dt *
        60;


    ball.y +=
        ball.vy *
        dt *
        60;


    ball.vx *=
        Math.pow(
            .985,
            dt * 60
        );


    ball.vy *=
        Math.pow(
            .985,
            dt * 60
        );


    const goalTop =
        BASE_H / 2 -
        goal.height / 2;


    const goalBottom =
        BASE_H / 2 +
        goal.height / 2;


    const insideGoal =
        ball.y >
        goalTop &&
        ball.y <
        goalBottom;


    if(
        ball.y -
        ball.radius <
        field.top
    ){

        ball.y =
            field.top +
            ball.radius;


        ball.vy *=
            -.8;


        playWallSound();


        createBounceParticles(
            ball.x,
            ball.y
        );

    }


    if(
        ball.y +
        ball.radius >
        field.bottom
    ){

        ball.y =
            field.bottom -
            ball.radius;


        ball.vy *=
            -.8;


        playWallSound();


        createBounceParticles(
            ball.x,
            ball.y
        );

    }


    if(
        ball.x -
        ball.radius <
        field.left
    ){

        if(
            insideGoal
        ){

            goalScored(
                "red"
            );

            return;

        }


        ball.x =
            field.left +
            ball.radius;


        ball.vx *=
            -.8;


        playWallSound();


        createBounceParticles(
            ball.x,
            ball.y
        );

    }


    if(
        ball.x +
        ball.radius >
        field.right
    ){

        if(
            insideGoal
        ){

            goalScored(
                "blue"
            );

            return;

        }


        ball.x =
            field.right -
            ball.radius;


        ball.vx *=
            -.8;


        playWallSound();


        createBounceParticles(
            ball.x,
            ball.y
        );

    }

}


/* =========================================================
   GOAL
========================================================= */

function goalScored(
    team
){

    if(
        goalInProgress ||
        matchFinished
    ){

        return;

    }


    goalInProgress =
        true;


    ball.vx = 0;

    ball.vy = 0;


    if(
        team === "blue"
    ){

        blueScore++;


        ball.x =
            field.right +
            8;

    }
    else{

        redScore++;


        ball.x =
            field.left -
            8;

    }


    ball.y =
        BASE_H / 2;


    scoreElement.textContent =
        `${blueScore} - ${redScore}`;


    goalText.classList.remove(
        "show"
    );


    void goalText.offsetWidth;


    goalText.classList.add(
        "show"
    );


    shake = 15;


    playGoalSound();


    for(
        let i = 0;
        i < 40;
        i++
    ){

        createGoalParticle(
            BASE_W / 2,
            BASE_H / 2
        );

    }


    clearTimeout(
        goalRestartTimer
    );


    goalRestartTimer =
        setTimeout(
            () => {

                if(
                    !matchFinished
                ){

                    goalInProgress =
                        false;


                    resetPositions();

                }

            },
            900
        );

}


/* =========================================================
   MATCH RESULT
========================================================= */

function finishMatch(){

    if(
        matchFinished
    ){

        return;

    }


    matchFinished =
        true;


    gameStarted =
        false;


    goalInProgress =
        false;


    clearTimeout(
        goalRestartTimer
    );


    let result;

    let reward;


    if(
        blueScore >
        redScore
    ){

        result =
            "win";

        reward =
            50;


        resultTitle.textContent =
            "YOU WIN";


        resultTitle.className =
            "result-title result-win";

    }
    else if(
        blueScore <
        redScore
    ){

        result =
            "lose";

        reward =
            10;


        resultTitle.textContent =
            "YOU LOSE";


        resultTitle.className =
            "result-title result-lose";

    }
    else{

        result =
            "draw";

        reward =
            10;


        resultTitle.textContent =
            "DRAW";


        resultTitle.className =
            "result-title result-draw";

    }


    addCoins(
        reward
    );


    resultScore.textContent =
        `${blueScore} - ${redScore}`;


    resultCoins.textContent =
        `+${reward}`;


    resultOverlay.classList.remove(
        "hidden"
    );


    playResultSound(
        result
    );

}


/* =========================================================
   RESTART
========================================================= */

function restartMatch(){

    clearTimeout(
        goalRestartTimer
    );


    blueScore = 0;

    redScore = 0;

    matchTime = 120;


    goalInProgress =
        false;


    matchFinished =
        false;


    resultOverlay.classList.add(
        "hidden"
    );


    scoreElement.textContent =
        "0 - 0";


    timerElement.textContent =
        "02:00";


    goalText.classList.remove(
        "show"
    );


    particles = [];


    shake = 0;


    resetPositions();

}


/* =========================================================
   PARTICLES
========================================================= */

function createKickParticles(
    x,
    y
){

    for(
        let i = 0;
        i < 7;
        i++
    ){

        particles.push({

            x,
            y,

            vx:
                (Math.random() -
                .5) *
                3,

            vy:
                (Math.random() -
                .5) *
                3,

            life:.35,

            size:
                Math.random() *
                4 +
                2

        });

    }

}


function createBounceParticles(
    x,
    y
){

    for(
        let i = 0;
        i < 4;
        i++
    ){

        particles.push({

            x,
            y,

            vx:
                (Math.random() -
                .5) *
                2,

            vy:
                (Math.random() -
                .5) *
                2,

            life:.2,

            size:3

        });

    }

}


function createGoalParticle(
    x,
    y
){

    particles.push({

        x,
        y,

        vx:
            (Math.random() -
            .5) *
            10,

        vy:
            (Math.random() -
            .5) *
            10,

        life:1,

        size:
            Math.random() *
            7 +
            3

    });

}


function updateParticles(dt){

    for(
        let i =
            particles.length -
            1;

        i >= 0;

        i--
    ){

        const p =
            particles[i];


        p.x +=
            p.vx *
            dt *
            60;


        p.y +=
            p.vy *
            dt *
            60;


        p.vx *=
            .97;


        p.vy *=
            .97;


        p.life -=
            dt;


        if(
            p.life <= 0
        ){

            particles.splice(
                i,
                1
            );

        }

    }

}


/* =========================================================
   FIELD DRAW
========================================================= */

function drawField(){

    ctx.clearRect(
        0,
        0,
        BASE_W,
        BASE_H
    );


    ctx.fillStyle =
        "#19703c";


    ctx.fillRect(
        0,
        0,
        BASE_W,
        BASE_H
    );


    for(
        let x =
            field.left;

        x <
            field.right;

        x += 80
    ){

        ctx.fillStyle =
            Math.floor(
                (x -
                field.left) /
                80
            ) % 2 === 0

            ? "rgba(255,255,255,.025)"

            : "rgba(0,0,0,.025)";


        ctx.fillRect(
            x,
            field.top,
            80,
            field.bottom -
            field.top
        );

    }


    ctx.strokeStyle =
        "rgba(255,255,255,.85)";


    ctx.lineWidth =
        4;


    ctx.strokeRect(
        field.left,
        field.top,
        field.right -
        field.left,
        field.bottom -
        field.top
    );


    ctx.beginPath();


    ctx.moveTo(
        BASE_W / 2,
        field.top
    );


    ctx.lineTo(
        BASE_W / 2,
        field.bottom
    );


    ctx.stroke();


    ctx.beginPath();


    ctx.arc(
        BASE_W / 2,
        BASE_H / 2,
        75,
        0,
        Math.PI * 2
    );


    ctx.stroke();


    ctx.beginPath();


    ctx.arc(
        BASE_W / 2,
        BASE_H / 2,
        4,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "white";


    ctx.fill();


    drawPenaltyArea(
        "left"
    );


    drawPenaltyArea(
        "right"
    );


    const goalTop =
        BASE_H / 2 -
        goal.height / 2;


    ctx.fillStyle =
        "rgba(255,255,255,.08)";


    ctx.fillRect(
        field.left - 18,
        goalTop,
        18,
        goal.height
    );


    ctx.fillRect(
        field.right,
        goalTop,
        18,
        goal.height
    );


    ctx.strokeStyle =
        "rgba(255,255,255,.75)";


    ctx.lineWidth =
        3;


    ctx.strokeRect(
        field.left - 18,
        goalTop,
        18,
        goal.height
    );


    ctx.strokeRect(
        field.right,
        goalTop,
        18,
        goal.height
    );

}


function drawPenaltyArea(
    side
){

    const width =
        120;

    const height =
        240;


    const x =
        side === "left"

        ? field.left

        : field.right -
            width;


    ctx.strokeStyle =
        "rgba(255,255,255,.65)";


    ctx.lineWidth =
        3;


    ctx.strokeRect(
        x,
        BASE_H / 2 -
        height / 2,
        width,
        height
    );

}


/* =========================================================
   PLAYER DRAW
========================================================= */

function drawPlayer(
    player
){

    const speed =
        Math.hypot(
            player.vx,
            player.vy
        );


    const isBlue =
        player === blue;


    const skin =
        isBlue
        ? getSkin(
            equippedSkin
        )
        : {
            color:"#ff5e66",
            glow:"#ff5e66",
            rarity:"Default"
        };


    /* shadow */

    ctx.beginPath();


    ctx.ellipse(

        player.x,

        player.y +
        player.radius +
        5,

        player.radius *
        .8,

        player.radius *
        .25,

        0,
        0,
        Math.PI * 2

    );


    ctx.fillStyle =
        "rgba(0,0,0,.22)";


    ctx.fill();


    /* rarity glow */

    if(
        isBlue &&
        skin.rarity !==
        "Default"
    ){

        let glowSize =
            8;


        if(
            skin.rarity ===
            "Super Rare"
        ){
            glowSize = 10;
        }

        if(
            skin.rarity ===
            "Epic"
        ){
            glowSize = 13;
        }

        if(
            skin.rarity ===
            "Mythic"
        ){
            glowSize = 16;
        }

        if(
            skin.rarity ===
            "Legendary"
        ){
            glowSize =
                20 +
                Math.sin(
                    Date.now() /
                    120
                ) * 5;
        }


        ctx.save();


        ctx.globalAlpha =
            .28;


        ctx.shadowBlur =
            glowSize *
            2;


        ctx.shadowColor =
            skin.glow;


        ctx.beginPath();


        ctx.arc(
            player.x,
            player.y,
            player.radius +
            glowSize / 2,
            0,
            Math.PI * 2
        );


        ctx.strokeStyle =
            skin.glow;


        ctx.lineWidth =
            5;


        ctx.stroke();


        ctx.restore();

    }


    /* player */

    ctx.beginPath();


    ctx.arc(

        player.x,
        player.y,
        player.radius,

        0,
        Math.PI * 2

    );


    ctx.fillStyle =
        skin.color;


    ctx.fill();


    ctx.lineWidth =
        isBlue &&
        skin.rarity ===
        "Legendary"
        ? 5
        : 3;


    ctx.strokeStyle =
        "rgba(255,255,255,.9)";


    ctx.stroke();


    /* direction indicator */

    let dx =
        player.vx;

    let dy =
        player.vy;


    const len =
        Math.hypot(
            dx,
            dy
        );


    if(
        len < .1
    ){

        dx =
            player === blue
            ? 1
            : -1;

        dy = 0;

    }
    else{

        dx /= len;

        dy /= len;

    }


    ctx.beginPath();


    ctx.arc(

        player.x +
        dx * 9,

        player.y +
        dy * 9,

        5,

        0,
        Math.PI * 2

    );


    ctx.fillStyle =
        "white";


    ctx.fill();


    /* speed ring */

    if(
        speed > 1.5
    ){

        ctx.beginPath();


        ctx.arc(

            player.x,
            player.y,

            player.radius +
            4 +
            Math.sin(
                Date.now() /
                70
            ) * 2,

            0,
            Math.PI * 2

        );


        ctx.strokeStyle =
            skin.glow ||
            skin.color;


        ctx.globalAlpha =
            .25;


        ctx.stroke();


        ctx.globalAlpha =
            1;

    }


    /* legendary particles */

    if(
        isBlue &&
        skin.rarity ===
        "Legendary" &&
        Math.random() <
        .12
    ){

        particles.push({

            x:
                player.x +
                (Math.random() -
                .5) *
                35,

            y:
                player.y +
                (Math.random() -
                .5) *
                35,

            vx:0,

            vy:-.4,

            life:.35,

            size:
                Math.random() *
                3 +
                1

        });

    }

}


/* =========================================================
   BALL DRAW
========================================================= */

function drawBall(){

    ctx.beginPath();


    ctx.ellipse(

        ball.x,

        ball.y +
        ball.radius +
        5,

        ball.radius *
        .8,

        ball.radius *
        .25,

        0,
        0,
        Math.PI * 2

    );


    ctx.fillStyle =
        "rgba(0,0,0,.25)";


    ctx.fill();


    ctx.beginPath();


    ctx.arc(

        ball.x,
        ball.y,
        ball.radius,

        0,
        Math.PI * 2

    );


    ctx.fillStyle =
        "#fff";


    ctx.fill();


    ctx.strokeStyle =
        "#20252e";


    ctx.lineWidth =
        2;


    ctx.stroke();


    ctx.beginPath();


    ctx.arc(

        ball.x,
        ball.y,

        3,

        0,
        Math.PI * 2

    );


    ctx.fillStyle =
        "#20252e";


    ctx.fill();

}


/* =========================================================
   PARTICLES DRAW
========================================================= */

function drawParticles(){

    for(
        const p of particles
    ){

        ctx.globalAlpha =
            Math.max(
                0,
                p.life
            );


        ctx.beginPath();


        ctx.arc(

            p.x,
            p.y,
            p.size,

            0,
            Math.PI * 2

        );


        ctx.fillStyle =
            "white";


        ctx.fill();

    }


    ctx.globalAlpha =
        1;

}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

    if(
        !gameStarted
    ){

        return;

    }


    if(
        matchFinished
    ){

        updateParticles(
            dt
        );

        return;

    }


    if(
        matchTime <= 0
    ){

        updateParticles(
            dt
        );


        finishMatch();


        return;

    }


    if(
        goalInProgress
    ){

        updateParticles(
            dt
        );


        shake *=
            Math.pow(
                .82,
                dt * 60
            );


        if(
            shake < .1
        ){

            shake = 0;

        }


        return;

    }


    matchTime -=
        dt;


    if(
        matchTime < 0
    ){

        matchTime = 0;

    }


    const seconds =
        Math.ceil(
            matchTime
        );


    const minutes =
        Math.floor(
            seconds /
            60
        );


    const secs =
        seconds %
        60;


    timerElement.textContent =
        `${String(minutes).padStart(2,"0")}:${String(secs).padStart(2,"0")}`;


    movePlayer(

        blue,

        {
            up:"w",
            down:"s",
            left:"a",
            right:"d",
            kick:" "
        },

        dt

    );


    if(
        gameMode ===
        "local"
    ){

        movePlayer(

            red,

            {
                up:"arrowup",
                down:"arrowdown",
                left:"arrowleft",
                right:"arrowright",
                kick:"enter"
            },

            dt

        );

    }
    else{

        moveBot(
            dt
        );

    }


    handlePlayerCollision(
        blue,
        red
    );


    handleBallCollision(
        blue
    );


    handleBallCollision(
        red
    );


    updateBall(
        dt
    );


    updateParticles(
        dt
    );


    shake *=
        Math.pow(
            .82,
            dt * 60
        );


    if(
        shake < .1
    ){

        shake = 0;

    }

}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    ctx.save();


    if(
        shake > 0
    ){

        ctx.translate(

            (Math.random() -
            .5) *
            shake,

            (Math.random() -
            .5) *
            shake

        );

    }


    drawField();

    drawParticles();

    drawPlayer(
        blue
    );

    drawPlayer(
        red
    );

    drawBall();


    ctx.restore();

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(now){

    let dt =
        (now -
        lastTime) /
        1000;


    dt =
        Math.min(
            dt,
            .033
        );


    lastTime =
        now;


    update(
        dt
    );


    draw();


    requestAnimationFrame(
        gameLoop
    );

}


requestAnimationFrame(
    gameLoop
);


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    gameStarted =
        true;


    matchFinished =
        false;


    resultOverlay.classList.add(
        "hidden"
    );


    showOnly(
        gameWrap
    );


    resizeCanvas();


    restartMatch();


    lastTime =
        performance.now();

}

/* =========================================================
   SOUND
========================================================= */

let audioContext =
    null;


function getAudio(){

    if(
        !audioContext
    ){

        audioContext =
            new(
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }


    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }


    return audioContext;

}


function beep(
    frequency,
    duration,
    type="sine",
    volume=.04
){

    const audio =
        getAudio();


    const oscillator =
        audio.createOscillator();


    const gain =
        audio.createGain();


    oscillator.type =
        type;


    oscillator.frequency.value =
        frequency;


    gain.gain.setValueAtTime(
        volume,
        audio.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        .001,
        audio.currentTime +
        duration
    );


    oscillator.connect(
        gain
    );


    gain.connect(
        audio.destination
    );


    oscillator.start();


    oscillator.stop(
        audio.currentTime +
        duration
    );

}
