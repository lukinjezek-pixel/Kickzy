<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KICKZY</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #07101c;
}

body {
  width: 100vw;
  height: 100vh;
}

#app {
  width: 100vw;
  height: 100vh;
  position: relative;
}

.game-wrap {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #101820;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  background: #178447;
}

/* SCOREBOARD */
.scoreboard {
  position: absolute;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;

  display: flex;
  align-items: center;
  gap: 18px;

  padding: 9px 20px;
  border-radius: 16px;

  background: rgba(5, 12, 20, 0.78);
  border: 1px solid rgba(255,255,255,0.12);
  box-shadow: 0 8px 30px rgba(0,0,0,0.25);

  color: white;
  font-family: Arial, sans-serif;
  font-weight: 900;
  user-select: none;
  pointer-events: none;
}

.score {
  font-size: clamp(22px, 3vw, 38px);
  min-width: 42px;
  text-align: center;
}

.blue-score {
  color: #38a9ff;
}

.red-score {
  color: #ff4d5e;
}

.timer {
  min-width: 70px;
  text-align: center;
  font-size: clamp(18px, 2.4vw, 30px);
  color: white;
}

.goal-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.7);

  z-index: 20;

  font-family: Arial, sans-serif;
  font-size: clamp(48px, 9vw, 120px);
  font-weight: 1000;
  color: white;

  text-shadow:
    0 0 15px rgba(255,255,255,0.5),
    0 0 40px rgba(0,0,0,0.6);

  opacity: 0;
  pointer-events: none;
}

.goal-text.show {
  animation: goalPop 1.2s ease forwards;
}

@keyframes goalPop {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.55);
  }

  25% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.15);
  }

  55% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  100% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(1.05);
  }
}

@media (max-width: 700px) {
  .scoreboard {
    top: 10px;
    gap: 10px;
    padding: 7px 13px;
  }
}
</style>
</head>

<body>

<div id="app">

  <div class="game-wrap">

    <canvas id="game"></canvas>

    <div class="scoreboard">
      <div id="blueScore" class="score blue-score">0</div>
      <div id="timer" class="timer">2:00</div>
      <div id="redScore" class="score red-score">0</div>
    </div>

    <div id="goalText" class="goal-text">GOAL!</div>

  </div>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const blueScoreEl = document.getElementById("blueScore");
const redScoreEl = document.getElementById("redScore");
const timerEl = document.getElementById("timer");
const goalText = document.getElementById("goalText");

let W = 1000;
let H = 560;

let field = {
  left: 30,
  right: 970,
  top: 30,
  bottom: 530
};

let goal = {
  height: 170
};

function resizeCanvas() {

  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);

  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const margin = Math.max(
    18,
    Math.min(W, H) * 0.045
  );

  field.left = margin;
  field.right = W - margin;
  field.top = margin;
  field.bottom = H - margin;

  goal.height = Math.min(
    H * 0.30,
    190
  );

  updateObjectSizes();
}

window.addEventListener("resize", resizeCanvas);


/* =========================
   OBJECTS
========================= */

const blue = {
  x: 180,
  y: 280,
  radius: 23,
  color: "#249cff",
  vx: 0,
  vy: 0
};

const red = {
  x: 820,
  y: 280,
  radius: 23,
  color: "#ff4054",
  vx: 0,
  vy: 0
};

const ball = {
  x: 500,
  y: 280,
  radius: 12,
  vx: 0,
  vy: 0
};

function updateObjectSizes() {

  const scale = Math.min(
    W / 1000,
    H / 560
  );

  blue.radius = 23 * scale;
  red.radius = 23 * scale;
  ball.radius = 12 * scale;
}


/* =========================
   GAME STATE
========================= */

let blueScore = 0;
let redScore = 0;

let timeLeft = 120;

let running = true;
let goalInProgress = false;

let lastTime = performance.now();

let particles = [];

let shake = 0;


/* =========================
   CONTROLS
========================= */

const keys = {};

window.addEventListener("keydown", e => {

  keys[e.key.toLowerCase()] = true;

  if (
    ["arrowup", "arrowdown", "arrowleft", "arrowright", " "]
      .includes(e.key.toLowerCase())
  ) {
    e.preventDefault();
  }

  if (e.key.toLowerCase() === "r") {
    restartGame();
  }
});

window.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});


/* =========================
   AUDIO
========================= */

let audioCtx = null;

function initAudio() {

  if (!audioCtx) {
    audioCtx = new (
      window.AudioContext ||
      window.webkitAudioContext
    )();
  }

  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }
}

window.addEventListener("keydown", initAudio, { once: true });

function sound(
  frequency,
  duration,
  type = "sine",
  volume = 0.06
) {

  if (!audioCtx) return;

  const oscillator = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  oscillator.type = type;
  oscillator.frequency.value = frequency;

  gain.gain.setValueAtTime(
    volume,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    audioCtx.currentTime + duration
  );

  oscillator.connect(gain);
  gain.connect(audioCtx.destination);

  oscillator.start();

  oscillator.stop(
    audioCtx.currentTime + duration
  );
}

function kickSound() {
  sound(180, 0.07, "square", 0.045);
}

function wallSound() {
  sound(110, 0.05, "triangle", 0.025);
}

function goalSound() {

  sound(220, 0.15, "sawtooth", 0.07);

  setTimeout(() => {
    sound(330, 0.18, "sawtooth", 0.07);
  }, 100);

  setTimeout(() => {
    sound(440, 0.25, "sawtooth", 0.08);
  }, 220);
}


/* =========================
   RESET
========================= */

function resetPositions() {

  blue.x = field.left + (field.right - field.left) * 0.18;
  blue.y = (field.top + field.bottom) / 2;

  red.x = field.left + (field.right - field.left) * 0.82;
  red.y = (field.top + field.bottom) / 2;

  ball.x = (field.left + field.right) / 2;
  ball.y = (field.top + field.bottom) / 2;

  blue.vx = 0;
  blue.vy = 0;

  red.vx = 0;
  red.vy = 0;

  ball.vx = 0;
  ball.vy = 0;
}

function restartGame() {

  blueScore = 0;
  redScore = 0;

  timeLeft = 120;

  running = true;
  goalInProgress = false;

  blueScoreEl.textContent = "0";
  redScoreEl.textContent = "0";

  resetPositions();
}


/* =========================
   PLAYER MOVEMENT
========================= */

function movePlayer(player, controls, dt) {

  let dx = 0;
  let dy = 0;

  if (keys[controls.up]) dy -= 1;
  if (keys[controls.down]) dy += 1;
  if (keys[controls.left]) dx -= 1;
  if (keys[controls.right]) dx += 1;

  if (dx !== 0 || dy !== 0) {

    const length = Math.hypot(dx, dy);

    dx /= length;
    dy /= length;

    const speed = Math.min(W, H) * 0.72;

    player.vx = dx * speed;
    player.vy = dy * speed;

  } else {

    player.vx *= Math.pow(0.0005, dt);
    player.vy *= Math.pow(0.0005, dt);
  }

  player.x += player.vx * dt;
  player.y += player.vy * dt;

  player.x = Math.max(
    field.left + player.radius,
    Math.min(
      field.right - player.radius,
      player.x
    )
  );

  player.y = Math.max(
    field.top + player.radius,
    Math.min(
      field.bottom - player.radius,
      player.y
    )
  );
}


/* =========================
   PLAYER / BALL COLLISION
========================= */

function playerBallCollision(player, controls) {

  const dx = ball.x - player.x;
  const dy = ball.y - player.y;

  const distance = Math.hypot(dx, dy);

  const minDistance =
    player.radius + ball.radius;

  if (distance < minDistance) {

    let nx;
    let ny;

    if (distance === 0) {
      nx = 1;
      ny = 0;
    } else {
      nx = dx / distance;
      ny = dy / distance;
    }

    ball.x =
      player.x +
      nx * minDistance;

    ball.y =
      player.y +
      ny * minDistance;

    const pushPower =
      Math.min(W, H) * 0.95;

    ball.vx = nx * pushPower + player.vx * 0.25;
    ball.vy = ny * pushPower + player.vy * 0.25;

    kickSound();

    /* EXTRA KICK */
    if (keys[controls.kick]) {

      const kickPower =
        Math.min(W, H) * 1.45;

      ball.vx = nx * kickPower + player.vx * 0.35;
      ball.vy = ny * kickPower + player.vy * 0.35;
    }
  }
}


/* =========================
   BALL PHYSICS
========================= */

function updateBall(dt) {

  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;

  const friction = Math.pow(0.025, dt);

  ball.vx *= friction;
  ball.vy *= friction;

  const maxSpeed =
    Math.min(W, H) * 2.2;

  const speed =
    Math.hypot(ball.vx, ball.vy);

  if (speed > maxSpeed) {

    ball.vx =
      ball.vx / speed * maxSpeed;

    ball.vy =
      ball.vy / speed * maxSpeed;
  }

  /* TOP / BOTTOM */

  if (
    ball.y - ball.radius < field.top
  ) {

    ball.y =
      field.top + ball.radius;

    ball.vy = Math.abs(ball.vy) * 0.8;

    wallSound();
  }

  if (
    ball.y + ball.radius > field.bottom
  ) {

    ball.y =
      field.bottom - ball.radius;

    ball.vy = -Math.abs(ball.vy) * 0.8;

    wallSound();
  }


  /* LEFT SIDE */

  const goalTop =
    (H / 2) - goal.height / 2;

  const goalBottom =
    (H / 2) + goal.height / 2;

  if (
    ball.x - ball.radius < field.left &&
    !(ball.y > goalTop && ball.y < goalBottom)
  ) {

    ball.x =
      field.left + ball.radius;

    ball.vx =
      Math.abs(ball.vx) * 0.8;

    wallSound();
  }


  /* RIGHT SIDE */

  if (
    ball.x + ball.radius > field.right &&
    !(ball.y > goalTop && ball.y < goalBottom)
  ) {

    ball.x =
      field.right - ball.radius;

    ball.vx =
      -Math.abs(ball.vx) * 0.8;

    wallSound();
  }


  /* GOAL CHECK */

  if (
    ball.x < field.left - ball.radius * 0.5 &&
    ball.y > goalTop &&
    ball.y < goalBottom
  ) {

    scoreGoal("red");
    return;
  }

  if (
    ball.x > field.right + ball.radius * 0.5 &&
    ball.y > goalTop &&
    ball.y < goalBottom
  ) {

    scoreGoal("blue");
    return;
  }
}


/* =========================
   GOAL
========================= */

function scoreGoal(team) {

  if (goalInProgress || !running) return;

  goalInProgress = true;

  if (team === "blue") {
    blueScore++;
    blueScoreEl.textContent = blueScore;
  } else {
    redScore++;
    redScoreEl.textContent = redScore;
  }

  ball.vx = 0;
  ball.vy = 0;

  if (team === "blue") {
    ball.x = field.right - ball.radius * 0.3;
  } else {
    ball.x = field.left + ball.radius * 0.3;
  }

  ball.y = H / 2;

  goalText.classList.remove("show");

  void goalText.offsetWidth;

  goalText.textContent =
    team === "blue"
      ? "BLUE GOAL!"
      : "RED GOAL!";

  goalText.classList.add("show");

  goalSound();

  shake = 18;

  createGoalParticles();

  setTimeout(() => {

    if (!running) return;

    resetPositions();

    goalInProgress = false;

  }, 1200);
}


/* =========================
   PARTICLES
========================= */

function createGoalParticles() {

  for (let i = 0; i < 80; i++) {

    const angle =
      Math.random() * Math.PI * 2;

    const speed =
      150 + Math.random() * 500;

    particles.push({

      x: W / 2,
      y: H / 2,

      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,

      life: 1,

      size:
        3 + Math.random() * 6
    });
  }
}

function updateParticles(dt) {

  for (let i = particles.length - 1; i >= 0; i--) {

    const p = particles[i];

    p.x += p.vx * dt;
    p.y += p.vy * dt;

    p.vx *= 0.97;
    p.vy *= 0.97;

    p.life -= dt * 1.7;

    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }
}


/* =========================
   DRAW FIELD
========================= */

function drawField() {

  ctx.fillStyle = "#178447";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  /* FIELD */

  ctx.strokeStyle =
    "rgba(255,255,255,0.8)";

  ctx.lineWidth =
    Math.max(2, Math.min(W,H) * 0.004);

  ctx.strokeRect(
    field.left,
    field.top,
    field.right - field.left,
    field.bottom - field.top
  );


  /* CENTER LINE */

  ctx.beginPath();

  ctx.moveTo(
    (field.left + field.right) / 2,
    field.top
  );

  ctx.lineTo(
    (field.left + field.right) / 2,
    field.bottom
  );

  ctx.stroke();


  /* CENTER CIRCLE */

  const centerX =
    (field.left + field.right) / 2;

  const centerY =
    (field.top + field.bottom) / 2;

  const centerRadius =
    Math.min(W,H) * 0.14;

  ctx.beginPath();

  ctx.arc(
    centerX,
    centerY,
    centerRadius,
    0,
    Math.PI * 2
  );

  ctx.stroke();


  /* CENTER DOT */

  ctx.fillStyle = "white";

  ctx.beginPath();

  ctx.arc(
    centerX,
    centerY,
    Math.min(W,H) * 0.009,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /* PENALTY AREAS */

  const penaltyWidth =
    (field.right - field.left) * 0.16;

  const penaltyHeight =
    (field.bottom - field.top) * 0.48;

  const penaltyTop =
    centerY - penaltyHeight / 2;

  ctx.strokeRect(
    field.left,
    penaltyTop,
    penaltyWidth,
    penaltyHeight
  );

  ctx.strokeRect(
    field.right - penaltyWidth,
    penaltyTop,
    penaltyWidth,
    penaltyHeight
  );


  /* GOALS */

  const goalTop =
    centerY - goal.height / 2;

  const goalWidth =
    Math.min(W,H) * 0.055;

  ctx.fillStyle =
    "rgba(235,235,235,0.85)";

  ctx.fillRect(
    field.left - goalWidth,
    goalTop,
    goalWidth,
    goal.height
  );

  ctx.fillRect(
    field.right,
    goalTop,
    goalWidth,
    goal.height
  );

  ctx.strokeStyle =
    "rgba(255,255,255,0.9)";

  ctx.strokeRect(
    field.left - goalWidth,
    goalTop,
    goalWidth,
    goal.height
  );

  ctx.strokeRect(
    field.right,
    goalTop,
    goalWidth,
    goal.height
  );
}


/* =========================
   DRAW PLAYER
========================= */

function drawPlayer(player) {

  ctx.save();

  ctx.shadowBlur = 18;
  ctx.shadowColor = player.color;

  ctx.fillStyle = player.color;

  ctx.beginPath();

  ctx.arc(
    player.x,
    player.y,
    player.radius,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.shadowBlur = 0;

  /* shine */

  ctx.fillStyle =
    "rgba(255,255,255,0.35)";

  ctx.beginPath();

  ctx.arc(
    player.x - player.radius * 0.32,
    player.y - player.radius * 0.35,
    player.radius * 0.25,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.restore();
}


/* =========================
   DRAW BALL
========================= */

function drawBall() {

  ctx.save();

  ctx.shadowBlur = 12;
  ctx.shadowColor =
    "rgba(255,255,255,0.5)";

  ctx.fillStyle = "#ffffff";

  ctx.beginPath();

  ctx.arc(
    ball.x,
    ball.y,
    ball.radius,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.shadowBlur = 0;

  ctx.strokeStyle =
    "rgba(0,0,0,0.2)";

  ctx.lineWidth = 2;

  ctx.stroke();

  ctx.restore();
}


/* =========================
   DRAW PARTICLES
========================= */

function drawParticles() {

  for (const p of particles) {

    ctx.globalAlpha =
      Math.max(0, p.life);

    ctx.fillStyle = "white";

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI * 2
    );

    ctx.fill();
  }

  ctx.globalAlpha = 1;
}


/* =========================
   UPDATE
========================= */

function update(dt) {

  updateParticles(dt);

  if (shake > 0) {
    shake *= 0.88;
  }

  if (!running || goalInProgress) {
    return;
  }

  timeLeft -= dt;

  if (timeLeft <= 0) {

    timeLeft = 0;
    running = false;

    ball.vx = 0;
    ball.vy = 0;

    goalText.textContent =
      blueScore === redScore
        ? "DRAW!"
        : blueScore > redScore
          ? "BLUE WINS!"
          : "RED WINS!";

    goalText.classList.remove("show");

    void goalText.offsetWidth;

    goalText.classList.add("show");
  }

  const minutes =
    Math.floor(timeLeft / 60);

  const seconds =
    Math.floor(timeLeft % 60);

  timerEl.textContent =
    minutes + ":" +
    seconds.toString().padStart(2, "0");


  movePlayer(
    blue,
    {
      up: "w",
      down: "s",
      left: "a",
      right: "d",
      kick: " "
    },
    dt
  );

  movePlayer(
    red,
    {
      up: "arrowup",
      down: "arrowdown",
      left: "arrowleft",
      right: "arrowright",
      kick: "enter"
    },
    dt
  );


  playerBallCollision(
    blue,
    {
      kick: " "
    }
  );

  playerBallCollision(
    red,
    {
      kick: "enter"
    }
  );

  updateBall(dt);
}


/* =========================
   DRAW
========================= */

function draw() {

  ctx.save();

  if (shake > 0) {

    ctx.translate(
      (Math.random() - 0.5) * shake,
      (Math.random() - 0.5) * shake
    );
  }

  drawField();

  drawParticles();

  drawPlayer(blue);
  drawPlayer(red);

  drawBall();

  ctx.restore();
}


/* =========================
   GAME LOOP
========================= */

function loop(now) {

  let dt =
    (now - lastTime) / 1000;

  lastTime = now;

  dt = Math.min(dt, 0.033);

  update(dt);
  draw();

  requestAnimationFrame(loop);
}


/* =========================
   START
========================= */

resizeCanvas();

resetPositions();

requestAnimationFrame(loop);

</script>

</body>
</html>
