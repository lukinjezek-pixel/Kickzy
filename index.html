<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KICKZY</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #176b3a;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

#app,
.game-wrap,
canvas {
    width: 100vw;
    height: 100vh;
}

#app {
    position: relative;
}

.game-wrap {
    position: relative;
    overflow: hidden;
    background: #176b3a;
}

canvas {
    display: block;
    touch-action: none;
}

/* ================= MENU ================= */

.menu {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at 50% 35%, #203b2c 0%, #101b16 45%, #050806 100%);
}

.menu-box {
    width: min(500px, 90vw);
    text-align: center;
}

.logo {
    font-size: clamp(64px, 13vw, 120px);
    font-weight: 1000;
    letter-spacing: 8px;
    text-shadow:
        0 8px 30px rgba(0,0,0,.5),
        0 0 30px rgba(76,167,255,.25);
    margin-bottom: 4px;
}

.menu-subtitle {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 5px;
    opacity: .6;
    margin-bottom: 42px;
}

.menu-buttons {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.menu-btn {
    width: 100%;
    border: 0;
    border-radius: 16px;
    padding: 18px 20px;
    font-size: 20px;
    font-weight: 900;
    color: white;
    background: rgba(255,255,255,.09);
    border: 1px solid rgba(255,255,255,.14);
    cursor: pointer;
    transition:
        transform .15s ease,
        background .15s ease,
        box-shadow .15s ease;
}

.menu-btn:hover {
    transform: translateY(-3px);
    background: rgba(255,255,255,.15);
    box-shadow: 0 12px 30px rgba(0,0,0,.25);
}

.menu-btn:active {
    transform: scale(.97);
}

.play-btn {
    background: linear-gradient(135deg,#2384e8,#4ca7ff);
}

.play-btn:hover {
    background: linear-gradient(135deg,#2b91f7,#60b1ff);
}

.store-btn {
    background: rgba(255,255,255,.07);
}

.back-btn {
    margin-top: 8px;
    font-size: 15px;
    padding: 13px;
    background: transparent;
    border-color: rgba(255,255,255,.08);
}

.mode-title {
    font-size: 32px;
    font-weight: 1000;
    margin-bottom: 28px;
}

.mode-description {
    font-size: 13px;
    opacity: .55;
    margin-top: 20px;
}

.coming-soon {
    opacity: .45;
    cursor: default;
}

.coming-soon:hover {
    transform: none;
    background: rgba(255,255,255,.09);
    box-shadow: none;
}

.hidden {
    display: none !important;
}

/* ================= GAME UI ================= */

.scoreboard {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 9px 18px;
    border-radius: 16px;
    background: rgba(5,8,14,.72);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.12);
    pointer-events: none;
    z-index: 5;
}

.team {
    font-weight: 900;
    font-size: 15px;
}

.blue {
    color: #53a8ff;
}

.red {
    color: #ff6464;
}

.score {
    font-size: 25px;
    font-weight: 900;
    min-width: 52px;
}

.timer {
    position: absolute;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,.8);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    pointer-events: none;
    z-index: 5;
}

#goalText {
    position: absolute;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: clamp(48px, 10vw, 110px);
    font-weight: 1000;
    letter-spacing: 5px;

    opacity: 0;
    transform: scale(.65);

    pointer-events: none;
    z-index: 8;

    text-shadow:
        0 8px 35px rgba(0,0,0,.5),
        0 0 35px rgba(255,255,255,.25);
}

#goalText.show {
    animation: goalAnimation 1.2s ease-out forwards;
}

@keyframes goalAnimation {
    0% {
        opacity: 0;
        transform: scale(.65);
    }

    20% {
        opacity: 1;
        transform: scale(1.12);
    }

    45% {
        transform: scale(1);
    }

    100% {
        opacity: 0;
        transform: scale(1.08);
    }
}

/* ================= PAUSE ================= */

.pause-btn {
    position: absolute;
    right: 15px;
    top: 15px;
    z-index: 10;
    border: 0;
    border-radius: 10px;
    padding: 8px 12px;
    color: white;
    background: rgba(5,8,14,.65);
    cursor: pointer;
    font-weight: 800;
}

@media(max-width:600px) {
    .menu-subtitle {
        margin-bottom: 30px;
    }

    .menu-btn {
        padding: 16px;
        font-size: 18px;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- ================= MAIN MENU ================= -->

    <div class="menu" id="mainMenu">
        <div class="menu-box">

            <div class="logo">KICKZY</div>
            <div class="menu-subtitle">FAST 2D FOOTBALL</div>

            <div class="menu-buttons">

                <button class="menu-btn play-btn" id="playButton">
                    PLAY
                </button>

                <button class="menu-btn store-btn" id="storeButton">
                    STORE
                </button>

            </div>

        </div>
    </div>


    <!-- ================= MODE MENU ================= -->

    <div class="menu hidden" id="modeMenu">
        <div class="menu-box">

            <div class="mode-title">SELECT MODE</div>

            <div class="menu-buttons">

                <button class="menu-btn play-btn" id="botButton">
                    PLAY VS BOT
                </button>

                <button class="menu-btn" id="localButton">
                    PLAY LOCAL
                </button>

                <button class="menu-btn coming-soon" id="onlineButton">
                    PLAY ONLINE
                    <small>COMING SOON</small>
                </button>

                <button class="menu-btn back-btn" id="modeBack">
                    ← BACK
                </button>

            </div>

        </div>
    </div>


    <!-- ================= DIFFICULTY MENU ================= -->

    <div class="menu hidden" id="difficultyMenu">
        <div class="menu-box">

            <div class="mode-title">BOT DIFFICULTY</div>

            <div class="menu-buttons">

                <button class="menu-btn" data-difficulty="easy">
                    EASY
                </button>

                <button class="menu-btn play-btn" data-difficulty="normal">
                    NORMAL
                </button>

                <button class="menu-btn" data-difficulty="hard">
                    HARD
                </button>

                <button class="menu-btn back-btn" id="difficultyBack">
                    ← BACK
                </button>

            </div>

        </div>
    </div>


    <!-- ================= STORE ================= -->

    <div class="menu hidden" id="storeMenu">
        <div class="menu-box">

            <div class="mode-title">STORE</div>

            <div class="menu-subtitle">
                COMING SOON
            </div>

            <div class="menu-buttons">

                <button class="menu-btn coming-soon">
                    MORE CONTENT SOON
                </button>

                <button class="menu-btn back-btn" id="storeBack">
                    ← BACK
                </button>

            </div>

        </div>
    </div>


    <!-- ================= GAME ================= -->

    <div class="game-wrap hidden" id="gameWrap">

        <canvas id="game"></canvas>

        <div class="scoreboard">
            <span class="team blue">BLUE</span>
            <span class="score" id="score">0 - 0</span>
            <span class="team red">RED</span>
        </div>

        <div class="timer" id="timer">02:00</div>

        <button class="pause-btn" id="menuButton">
            MENU
        </button>

        <div id="goalText">GOAL!</div>

    </div>

</div>


<script>

/* =========================================================
   MENU
========================================================= */

const mainMenu = document.getElementById("mainMenu");
const modeMenu = document.getElementById("modeMenu");
const difficultyMenu = document.getElementById("difficultyMenu");
const storeMenu = document.getElementById("storeMenu");
const gameWrap = document.getElementById("gameWrap");

let gameMode = "local";
let botDifficulty = "normal";
let gameStarted = false;

function showOnly(element) {

    mainMenu.classList.add("hidden");
    modeMenu.classList.add("hidden");
    difficultyMenu.classList.add("hidden");
    storeMenu.classList.add("hidden");
    gameWrap.classList.add("hidden");

    if (element) {
        element.classList.remove("hidden");
    }
}

document.getElementById("playButton").onclick = () => {
    showOnly(modeMenu);
};

document.getElementById("storeButton").onclick = () => {
    showOnly(storeMenu);
};

document.getElementById("modeBack").onclick = () => {
    showOnly(mainMenu);
};

document.getElementById("storeBack").onclick = () => {
    showOnly(mainMenu);
};

document.getElementById("botButton").onclick = () => {

    gameMode = "bot";

    showOnly(difficultyMenu);
};

document.getElementById("localButton").onclick = () => {

    gameMode = "local";

    startGame();
};

document.getElementById("difficultyBack").onclick = () => {

    showOnly(modeMenu);
};

document.querySelectorAll("[data-difficulty]").forEach(button => {

    button.addEventListener("click", () => {

        botDifficulty =
            button.dataset.difficulty;

        gameMode = "bot";

        startGame();
    });

});


document.getElementById("menuButton").onclick = () => {

    gameStarted = false;

    clearTimeout(goalRestartTimer);

    showOnly(mainMenu);
};


/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const scoreElement =
    document.getElementById("score");

const timerElement =
    document.getElementById("timer");

const goalText =
    document.getElementById("goalText");


let W = 1000;
let H = 560;

const BASE_W = 1000;
const BASE_H = 560;

const field = {
    left: 35,
    right: 965,
    top: 35,
    bottom: 525
};

const goal = {
    width: 34,
    height: 150
};

let gameScale = 1;
let offsetX = 0;
let offsetY = 0;


function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        rect.width * dpr;

    canvas.height =
        rect.height * dpr;

    W = rect.width;
    H = rect.height;

    gameScale =
        Math.min(
            W / BASE_W,
            H / BASE_H
        );

    const gameWidth =
        BASE_W * gameScale;

    const gameHeight =
        BASE_H * gameScale;

    offsetX =
        (W - gameWidth) / 2;

    offsetY =
        (H - gameHeight) / 2;

    ctx.setTransform(
        dpr * gameScale,
        0,
        0,
        dpr * gameScale,
        dpr * offsetX,
        dpr * offsetY
    );
}

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   INPUT
========================================================= */

const keys = {};

window.addEventListener("keydown", e => {

    const key =
        e.key.toLowerCase();

    keys[key] = true;

    if (
        [
            "arrowup",
            "arrowdown",
            "arrowleft",
            "arrowright",
            " "
        ].includes(key)
    ) {
        e.preventDefault();
    }

    if (
        key === "r" &&
        gameStarted
    ) {
        restartMatch();
    }
});

window.addEventListener("keyup", e => {

    keys[
        e.key.toLowerCase()
    ] = false;

});


/* =========================================================
   PLAYERS
========================================================= */

const blue = {

    x: 0,
    y: 0,

    vx: 0,
    vy: 0,

    radius: 23,

    color: "#4ca7ff",

    kickCooldown: 0,

    speed: 0.65,
    maxSpeed: 5
};

const red = {

    x: 0,
    y: 0,

    vx: 0,
    vy: 0,

    radius: 23,

    color: "#ff5e66",

    kickCooldown: 0,

    speed: 0.65,
    maxSpeed: 5
};


/* =========================================================
   BALL
========================================================= */

const ball = {

    x: 0,
    y: 0,

    vx: 0,
    vy: 0,

    radius: 12
};


/* =========================================================
   GAME STATE
========================================================= */

let blueScore = 0;
let redScore = 0;

let matchTime = 120;

let lastTime =
    performance.now();

let particles = [];

let shake = 0;

let goalInProgress = false;

let goalRestartTimer = null;


/* =========================================================
   RESET
========================================================= */

function resetPositions() {

    blue.x =
        field.left +
        (field.right - field.left) *
        .28;

    blue.y =
        BASE_H / 2;

    blue.vx = 0;
    blue.vy = 0;

    blue.kickCooldown = 0;


    red.x =
        field.left +
        (field.right - field.left) *
        .72;

    red.y =
        BASE_H / 2;

    red.vx = 0;
    red.vy = 0;

    red.kickCooldown = 0;


    ball.x =
        BASE_W / 2;

    ball.y =
        BASE_H / 2;

    ball.vx = 0;
    ball.vy = 0;
}

resetPositions();


/* =========================================================
   HELPERS
========================================================= */

function clamp(value, min, max) {

    return Math.max(
        min,
        Math.min(max, value)
    );
}


/* =========================================================
   ORIGINAL PLAYER MOVEMENT
========================================================= */

function movePlayer(
    player,
    controls,
    dt
) {

    let dx = 0;
    let dy = 0;

    if (keys[controls.up]) {
        dy -= 1;
    }

    if (keys[controls.down]) {
        dy += 1;
    }

    if (keys[controls.left]) {
        dx -= 1;
    }

    if (keys[controls.right]) {
        dx += 1;
    }

    if (
        dx !== 0 ||
        dy !== 0
    ) {

        const length =
            Math.hypot(dx, dy);

        dx /= length;
        dy /= length;

        player.vx +=
            dx *
            player.speed *
            dt *
            60;

        player.vy +=
            dy *
            player.speed *
            dt *
            60;
    }

    const currentSpeed =
        Math.hypot(
            player.vx,
            player.vy
        );

    if (
        currentSpeed >
        player.maxSpeed
    ) {

        player.vx =
            player.vx /
            currentSpeed *
            player.maxSpeed;

        player.vy =
            player.vy /
            currentSpeed *
            player.maxSpeed;
    }

    player.vx *=
        Math.pow(
            .82,
            dt * 60
        );

    player.vy *=
        Math.pow(
            .82,
            dt * 60
        );

    player.x +=
        player.vx *
        dt *
        60;

    player.y +=
        player.vy *
        dt *
        60;

    player.x =
        clamp(
            player.x,
            field.left +
                player.radius,
            field.right -
                player.radius
        );

    player.y =
        clamp(
            player.y,
            field.top +
                player.radius,
            field.bottom -
                player.radius
        );

    player.kickCooldown -= dt;

    if (
        keys[controls.kick] &&
        player.kickCooldown <= 0
    ) {

        kick(player);

        player.kickCooldown = .38;
    }
}


/* =========================================================
   BOT MOVEMENT
========================================================= */

let botKickTimer = 0;
let botThinkTimer = 0;

function moveBot(dt) {

    if (gameMode !== "bot") {
        return;
    }

    if (goalInProgress) {
        return;
    }

    botKickTimer -= dt;
    botThinkTimer -= dt;

    let targetX = ball.x;
    let targetY = ball.y;

    /*
       EASY:
       Bot reacts slowly and sometimes
       doesn't go directly toward ball.
    */

    let reaction = .10;
    let aimError = 45;
    let speedMultiplier = .65;

    if (botDifficulty === "normal") {
        reaction = .06;
        aimError = 18;
        speedMultiplier = .82;
    }

    if (botDifficulty === "hard") {
        reaction = .025;
        aimError = 5;
        speedMultiplier = 1;
    }

    if (botThinkTimer <= 0) {

        botThinkTimer = reaction;

        targetX =
            ball.x +
            (Math.random() - .5) *
            aimError;

        targetY =
            ball.y +
            (Math.random() - .5) *
            aimError;
    }

    /*
       When ball is on the blue side,
       bot starts positioning itself
       toward the ball.
    */

    let dx =
        targetX - red.x;

    let dy =
        targetY - red.y;

    const distance =
        Math.hypot(dx, dy);

    if (distance > 25) {

        dx /= distance;
        dy /= distance;

        red.vx +=
            dx *
            red.speed *
            speedMultiplier *
            dt *
            60;

        red.vy +=
            dy *
            red.speed *
            speedMultiplier *
            dt *
            60;
    }

    const currentSpeed =
        Math.hypot(
            red.vx,
            red.vy
        );

    const maxBotSpeed =
        red.maxSpeed *
        speedMultiplier;

    if (
        currentSpeed >
        maxBotSpeed
    ) {

        red.vx =
            red.vx /
            currentSpeed *
            maxBotSpeed;

        red.vy =
            red.vy /
            currentSpeed *
            maxBotSpeed;
    }

    red.vx *=
        Math.pow(
            .82,
            dt * 60
        );

    red.vy *=
        Math.pow(
            .82,
            dt * 60
        );

    red.x +=
        red.vx *
        dt *
        60;

    red.y +=
        red.vy *
        dt *
        60;

    red.x =
        clamp(
            red.x,
            field.left +
                red.radius,
            field.right -
                red.radius
        );

    red.y =
        clamp(
            red.y,
            field.top +
                red.radius,
            field.bottom -
                red.radius
        );

    red.kickCooldown -= dt;

    /*
       Bot kicks when close enough.
    */

    const ballDistance =
        Math.hypot(
            ball.x - red.x,
            ball.y - red.y
        );

    let kickDistance = 75;

    if (botDifficulty === "easy") {
        kickDistance = 55;
    }

    if (botDifficulty === "hard") {
        kickDistance = 95;
    }

    if (
        ballDistance < kickDistance &&
        red.kickCooldown <= 0
    ) {

        kick(red);

        red.kickCooldown = .38;
    }
}


/* =========================================================
   KICK
========================================================= */

function kick(player) {

    const dx =
        ball.x - player.x;

    const dy =
        ball.y - player.y;

    const dist =
        Math.hypot(dx, dy);

    if (
        dist <
        player.radius +
        ball.radius +
        32
    ) {

        let nx;
        let ny;

        if (dist < .01) {

            nx =
                player === blue
                ? 1
                : -1;

            ny = 0;

        } else {

            nx =
                dx / dist;

            ny =
                dy / dist;
        }

        const power = 10.5;

        ball.vx =
            nx *
            power +
            player.vx *
            .45;

        ball.vy =
            ny *
            power +
            player.vy *
            .45;

        createKickParticles(
            ball.x - nx * 7,
            ball.y - ny * 7
        );

        playKickSound();
    }
}


/* =========================================================
   PLAYER COLLISION
========================================================= */

function handlePlayerCollision(
    a,
    b
) {

    const dx =
        b.x - a.x;

    const dy =
        b.y - a.y;

    const dist =
        Math.hypot(dx, dy);

    const minDist =
        a.radius +
        b.radius;

    if (
        dist > 0 &&
        dist < minDist
    ) {

        const nx =
            dx / dist;

        const ny =
            dy / dist;

        const overlap =
            minDist - dist;

        a.x -=
            nx *
            overlap /
            2;

        a.y -=
            ny *
            overlap /
            2;

        b.x +=
            nx *
            overlap /
            2;

        b.y +=
            ny *
            overlap /
            2;

        const push = 1.8;

        a.vx -=
            nx * push;

        a.vy -=
            ny * push;

        b.vx +=
            nx * push;

        b.vy +=
            ny * push;
    }
}


/* =========================================================
   BALL COLLISION
========================================================= */

function handleBallCollision(
    player
) {

    if (goalInProgress) {
        return;
    }

    const dx =
        ball.x - player.x;

    const dy =
        ball.y - player.y;

    const dist =
        Math.hypot(dx, dy);

    const minDist =
        player.radius +
        ball.radius;

    if (
        dist < minDist &&
        dist > 0
    ) {

        const nx =
            dx / dist;

        const ny =
            dy / dist;

        const overlap =
            minDist - dist;

        ball.x +=
            nx * overlap;

        ball.y +=
            ny * overlap;

        const speed =
            Math.max(
                Math.hypot(
                    ball.vx,
                    ball.vy
                ),
                1.7
            );

        ball.vx =
            nx *
            speed +
            player.vx *
            .25;

        ball.vy =
            ny *
            speed +
            player.vy *
            .25;
    }
}


/* =========================================================
   BALL UPDATE
========================================================= */

function updateBall(dt) {

    if (goalInProgress) {
        return;
    }

    ball.x +=
        ball.vx *
        dt *
        60;

    ball.y +=
        ball.vy *
        dt *
        60;

    ball.vx *=
        Math.pow(
            .985,
            dt * 60
        );

    ball.vy *=
        Math.pow(
            .985,
            dt * 60
        );

    const goalTop =
        BASE_H / 2 -
        goal.height / 2;

    const goalBottom =
        BASE_H / 2 +
        goal.height / 2;

    const insideGoal =
        ball.y > goalTop &&
        ball.y < goalBottom;


    if (
        ball.y -
        ball.radius <
        field.top
    ) {

        ball.y =
            field.top +
            ball.radius;

        ball.vy *= -.8;

        playWallSound();

        createBounceParticles(
            ball.x,
            ball.y
        );
    }


    if (
        ball.y +
        ball.radius >
        field.bottom
    ) {

        ball.y =
            field.bottom -
            ball.radius;

        ball.vy *= -.8;

        playWallSound();

        createBounceParticles(
            ball.x,
            ball.y
        );
    }


    if (
        ball.x -
        ball.radius <
        field.left
    ) {

        if (insideGoal) {

            goalScored("red");

            return;
        }

        ball.x =
            field.left +
            ball.radius;

        ball.vx *= -.8;

        playWallSound();

        createBounceParticles(
            ball.x,
            ball.y
        );
    }


    if (
        ball.x +
        ball.radius >
        field.right
    ) {

        if (insideGoal) {

            goalScored("blue");

            return;
        }

        ball.x =
            field.right -
            ball.radius;

        ball.vx *= -.8;

        playWallSound();

        createBounceParticles(
            ball.x,
            ball.y
        );
    }
}


/* =========================================================
   GOAL
========================================================= */

function goalScored(team) {

    if (goalInProgress) {
        return;
    }

    goalInProgress = true;

    ball.vx = 0;
    ball.vy = 0;

    if (team === "blue") {

        blueScore++;

        ball.x =
            field.right + 8;

    } else {

        redScore++;

        ball.x =
            field.left - 8;
    }

    ball.y =
        BASE_H / 2;

    scoreElement.textContent =
        `${blueScore} - ${redScore}`;

    goalText.classList.remove(
        "show"
    );

    void goalText.offsetWidth;

    goalText.classList.add(
        "show"
    );

    shake = 15;

    playGoalSound();

    for (
        let i = 0;
        i < 40;
        i++
    ) {

        createGoalParticle(
            BASE_W / 2,
            BASE_H / 2
        );
    }

    clearTimeout(
        goalRestartTimer
    );

    goalRestartTimer =
        setTimeout(() => {

            goalInProgress =
                false;

            resetPositions();

        }, 900);
}


/* =========================================================
   RESTART
========================================================= */

function restartMatch() {

    clearTimeout(
        goalRestartTimer
    );

    blueScore = 0;
    redScore = 0;

    matchTime = 120;

    goalInProgress = false;

    scoreElement.textContent =
        "0 - 0";

    timerElement.textContent =
        "02:00";

    goalText.classList.remove(
        "show"
    );

    particles = [];

    shake = 0;

    resetPositions();
}


/* =========================================================
   PARTICLES
========================================================= */

function createKickParticles(x, y) {

    for (
        let i = 0;
        i < 7;
        i++
    ) {

        particles.push({

            x,
            y,

            vx:
                (Math.random() - .5) *
                3,

            vy:
                (Math.random() - .5) *
                3,

            life: .35,

            size:
                Math.random() *
                4 +
                2
        });
    }
}

function createBounceParticles(x, y) {

    for (
        let i = 0;
        i < 4;
        i++
    ) {

        particles.push({

            x,
            y,

            vx:
                (Math.random() - .5) *
                2,

            vy:
                (Math.random() - .5) *
                2,

            life: .2,

            size: 3
        });
    }
}

function createGoalParticle(x, y) {

    particles.push({

        x,
        y,

        vx:
            (Math.random() - .5) *
            10,

        vy:
            (Math.random() - .5) *
            10,

        life: 1,

        size:
            Math.random() *
            7 +
            3
    });
}

function updateParticles(dt) {

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            particles[i];

        p.x +=
            p.vx *
            dt *
            60;

        p.y +=
            p.vy *
            dt *
            60;

        p.vx *= .97;
        p.vy *= .97;

        p.life -= dt;

        if (p.life <= 0) {

            particles.splice(
                i,
                1
            );
        }
    }
}


/* =========================================================
   FIELD
========================================================= */

function drawField() {

    ctx.clearRect(
        0,
        0,
        BASE_W,
        BASE_H
    );

    ctx.fillStyle =
        "#19703c";

    ctx.fillRect(
        0,
        0,
        BASE_W,
        BASE_H
    );


    for (
        let x = field.left;
        x < field.right;
        x += 80
    ) {

        ctx.fillStyle =
            Math.floor(
                (x - field.left) / 80
            ) % 2 === 0
            ? "rgba(255,255,255,.025)"
            : "rgba(0,0,0,.025)";

        ctx.fillRect(
            x,
            field.top,
            80,
            field.bottom -
            field.top
        );
    }


    ctx.strokeStyle =
        "rgba(255,255,255,.85)";

    ctx.lineWidth = 4;

    ctx.strokeRect(
        field.left,
        field.top,
        field.right -
        field.left,
        field.bottom -
        field.top
    );


    ctx.beginPath();

    ctx.moveTo(
        BASE_W / 2,
        field.top
    );

    ctx.lineTo(
        BASE_W / 2,
        field.bottom
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.arc(
        BASE_W / 2,
        BASE_H / 2,
        75,
        0,
        Math.PI * 2
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.arc(
        BASE_W / 2,
        BASE_H / 2,
        4,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "white";

    ctx.fill();


    drawPenaltyArea("left");
    drawPenaltyArea("right");


    const goalTop =
        BASE_H / 2 -
        goal.height / 2;

    ctx.fillStyle =
        "rgba(255,255,255,.08)";

    ctx.fillRect(
        field.left - 18,
        goalTop,
        18,
        goal.height
    );

    ctx.fillRect(
        field.right,
        goalTop,
        18,
        goal.height
    );

    ctx.strokeStyle =
        "rgba(255,255,255,.75)";

    ctx.lineWidth = 3;

    ctx.strokeRect(
        field.left - 18,
        goalTop,
        18,
        goal.height
    );

    ctx.strokeRect(
        field.right,
        goalTop,
        18,
        goal.height
    );
}


function drawPenaltyArea(side) {

    const width = 120;
    const height = 240;

    const x =
        side === "left"
        ? field.left
        : field.right - width;

    ctx.strokeStyle =
        "rgba(255,255,255,.65)";

    ctx.lineWidth = 3;

    ctx.strokeRect(
        x,
        BASE_H / 2 -
        height / 2,
        width,
        height
    );
}


/* =========================================================
   PLAYER DRAW
========================================================= */

function drawPlayer(player) {

    const speed =
        Math.hypot(
            player.vx,
            player.vy
        );

    ctx.beginPath();

    ctx.ellipse(
        player.x,
        player.y +
            player.radius +
            5,

        player.radius * .8,
        player.radius * .25,

        0,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "rgba(0,0,0,.22)";

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        player.radius,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        player.color;

    ctx.fill();

    ctx.lineWidth = 3;

    ctx.strokeStyle =
        "rgba(255,255,255,.85)";

    ctx.stroke();


    let dx = player.vx;
    let dy = player.vy;

    const len =
        Math.hypot(dx, dy);

    if (len < .1) {

        dx =
            player === blue
            ? 1
            : -1;

        dy = 0;

    } else {

        dx /= len;
        dy /= len;
    }

    ctx.beginPath();

    ctx.arc(
        player.x + dx * 9,
        player.y + dy * 9,
        5,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "white";

    ctx.fill();


    if (speed > 1.5) {

        ctx.beginPath();

        ctx.arc(
            player.x,
            player.y,
            player.radius +
                4 +
                Math.sin(
                    Date.now() / 70
                ) * 2,

            0,
            Math.PI * 2
        );

        ctx.strokeStyle =
            player.color;

        ctx.globalAlpha = .25;

        ctx.stroke();

        ctx.globalAlpha = 1;
    }
}


/* =========================================================
   BALL DRAW
========================================================= */

function drawBall() {

    ctx.beginPath();

    ctx.ellipse(
        ball.x,
        ball.y +
            ball.radius +
            5,

        ball.radius * .8,
        ball.radius * .25,

        0,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "rgba(0,0,0,.25)";

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.radius,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#fff";

    ctx.fill();

    ctx.strokeStyle =
        "#20252e";

    ctx.lineWidth = 2;

    ctx.stroke();


    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        3,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#20252e";

    ctx.fill();
}


/* =========================================================
   PARTICLES DRAW
========================================================= */

function drawParticles() {

    for (const p of particles) {

        ctx.globalAlpha =
            Math.max(
                0,
                p.life
            );

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "white";

        ctx.fill();
    }

    ctx.globalAlpha = 1;
}


/* =========================================================
   GAME UPDATE
========================================================= */

function update(dt) {

    if (!gameStarted) {
        return;
    }

    if (matchTime <= 0) {

        updateParticles(dt);

        return;
    }

    if (goalInProgress) {

        updateParticles(dt);

        shake *=
            Math.pow(
                .82,
                dt * 60
            );

        if (shake < .1) {
            shake = 0;
        }

        return;
    }

    matchTime -= dt;

    if (matchTime < 0) {
        matchTime = 0;
    }

    const seconds =
        Math.ceil(matchTime);

    const minutes =
        Math.floor(
            seconds / 60
        );

    const secs =
        seconds % 60;

    timerElement.textContent =
        `${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;


    /* BLUE = PLAYER */

    movePlayer(
        blue,
        {
            up: "w",
            down: "s",
            left: "a",
            right: "d",
            kick: " "
        },
        dt
    );


    /* RED = LOCAL PLAYER OR BOT */

    if (gameMode === "local") {

        movePlayer(
            red,
            {
                up: "arrowup",
                down: "arrowdown",
                left: "arrowleft",
                right: "arrowright",
                kick: "enter"
            },
            dt
        );

    } else {

        moveBot(dt);
    }


    handlePlayerCollision(
        blue,
        red
    );

    handleBallCollision(
        blue
    );

    handleBallCollision(
        red
    );

    updateBall(dt);

    updateParticles(dt);

    shake *=
        Math.pow(
            .82,
            dt * 60
        );

    if (shake < .1) {
        shake = 0;
    }
}


/* =========================================================
   DRAW
========================================================= */

function draw() {

    ctx.save();

    if (shake > 0) {

        ctx.translate(
            (Math.random() - .5) *
                shake,

            (Math.random() - .5) *
                shake
        );
    }

    drawField();

    drawParticles();

    drawPlayer(blue);

    drawPlayer(red);

    drawBall();

    ctx.restore();
}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(now) {

    let dt =
        (now - lastTime) /
        1000;

    dt = Math.min(
        dt,
        .033
    );

    lastTime = now;

    update(dt);

    draw();

    requestAnimationFrame(
        gameLoop
    );
}

requestAnimationFrame(
    gameLoop
);


/* =========================================================
   START GAME
========================================================= */

function startGame() {

    gameStarted = true;

    showOnly(gameWrap);

    resizeCanvas();

    restartMatch();

    lastTime =
        performance.now();

    /*
       Audio se aktivuje až při
       skutečném hraní / stisknutí klávesy.
    */
}


/* =========================================================
   SOUND
========================================================= */

let audioContext = null;

function getAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }

    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();
    }

    return audioContext;
}

function beep(
    frequency,
    duration,
    type = "sine",
    volume = .04
) {

    const audio =
        getAudio();

    const oscillator =
        audio.createOscillator();

    const gain =
        audio.createGain();

    oscillator.type =
        type;

    oscillator.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        volume,
        audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audio.currentTime +
            duration
    );

    oscillator.connect(gain);

    gain.connect(
        audio.destination
    );

    oscillator.start();

    oscillator.stop(
        audio.currentTime +
        duration
    );
}

function playKickSound() {

    beep(
        120,
        .07,
        "square",
        .035
    );

    setTimeout(
        () =>
            beep(
                75,
                .05,
                "triangle",
                .025
            ),
        25
    );
}

function playWallSound() {

    beep(
        170,
        .045,
        "triangle",
        .018
    );
}

function playGoalSound() {

    beep(
        440,
        .12,
        "sine",
        .05
    );

    setTimeout(
        () =>
            beep(
                660,
                .14,
                "sine",
                .05
            ),
        100
    );

    setTimeout(
        () =>
            beep(
                880,
                .2,
                "sine",
                .06
            ),
        210
    );
}


/* =========================================================
   INITIALIZE
========================================================= */

resizeCanvas();

showOnly(mainMenu);

</script>
